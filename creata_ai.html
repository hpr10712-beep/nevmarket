<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI Forge — Build Your Own AI</title>
<meta name="theme-color" content="#0a0d14" />
<meta name="color-scheme" content="dark light" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b8cff'/%3E%3Cpath d='M9 22l7-13 7 13M12 18h8' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
:root{
  --bg:#070a10;--bg-2:#0b1018;--panel:#0f1521;--panel-2:#131a28;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
  --txt:#e8edf7;--txt-2:#98a5bd;--txt-3:#67748d;
  --brand:#5b8cff;--brand-2:#8b5cf6;--ok:#2fbf71;--warn:#f0b429;--err:#f0564a;
  --radius:14px;--radius-sm:10px;--radius-lg:20px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html[data-theme="light"]{
  --bg:#f4f6fb;--bg-2:#eef1f8;--panel:#ffffff;--panel-2:#f7f9fd;
  --line:rgba(15,23,42,.10);--line-2:rgba(15,23,42,.18);
  --txt:#0d1524;--txt-2:#4b5872;--txt-3:#78859c;
  --shadow:0 10px 30px rgba(15,23,42,.10);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden}
html[data-theme="dark"] body{background:radial-gradient(1100px 600px at 12% -10%,rgba(91,140,255,.16),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(139,92,246,.13),transparent 55%),var(--bg)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(140,155,185,.28);border-radius:20px;border:3px solid transparent;background-clip:content-box}
[hidden]{display:none!important}
.app-root{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 18px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--panel-2);color:var(--txt);cursor:pointer;font-weight:600;font-size:14px;transition:transform .12s,background .16s,border-color .16s,opacity .16s;white-space:nowrap;user-select:none}
.btn:hover{background:rgba(255,255,255,.06)}
html[data-theme="light"] .btn:hover{background:rgba(15,23,42,.05)}
.btn:active{transform:translateY(1px)}
.btn[disabled],.btn.is-loading{opacity:.55;pointer-events:none}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent;color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-danger{background:rgba(240,86,74,.12);border-color:rgba(240,86,74,.4);color:#ff8f85}
.btn-danger:hover{background:rgba(240,86,74,.2)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn-lg{padding:13px 22px;font-size:15px;border-radius:12px}
.btn-block{width:100%}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--txt-2)}
.icon-btn:hover{background:rgba(255,255,255,.07);color:var(--txt)}
html[data-theme="light"] .icon-btn:hover{background:rgba(15,23,42,.06)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
svg.i.sm{width:15px;height:15px}
svg.i.lg{width:22px;height:22px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.label{font-size:13px;font-weight:600;color:var(--txt-2)}
.hint{font-size:12px;color:var(--txt-3);line-height:1.45}
.input,.select,.textarea{width:100%;padding:11px 13px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--panel);color:var(--txt);outline:none;transition:border-color .15s,box-shadow .15s;font-size:14px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,140,255,.18)}
.textarea{resize:vertical;min-height:110px;line-height:1.6}
.textarea.code{font-family:var(--mono);font-size:13px;min-height:190px}
.select{appearance:none;padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,var(--txt-2) 50%),linear-gradient(135deg,var(--txt-2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 200px;min-width:0}
.check{display:flex;align-items:flex-start;gap:10px;cursor:pointer;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel-2)}
.check input{margin-top:3px;accent-color:var(--brand);width:16px;height:16px;flex:0 0 auto}
.check-txt{font-size:14px;font-weight:600}
.check-sub{font-size:12px;color:var(--txt-3);font-weight:400;margin-top:2px;display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.card-title{font-size:15px;font-weight:700;margin:0}
.card-sub{font-size:12.5px;color:var(--txt-3);margin:2px 0 0}
.nav{position:sticky;top:0;z-index:40;border-bottom:1px solid var(--line);background:rgba(7,10,16,.72);backdrop-filter:blur(14px)}
html[data-theme="light"] .nav{background:rgba(244,246,251,.8)}
.nav-in{display:flex;align-items:center;gap:14px;height:62px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em;font-size:16px;cursor:pointer}
.logo-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff}
.nav-links{display:flex;gap:4px;margin-left:14px;flex:1}
.nav-link{padding:8px 12px;border-radius:9px;font-size:14px;color:var(--txt-2);font-weight:600;cursor:pointer;border:none;background:none}
.nav-link:hover{color:var(--txt);background:rgba(255,255,255,.06)}
html[data-theme="light"] .nav-link:hover{background:rgba(15,23,42,.05)}
.nav-actions{display:flex;gap:8px;align-items:center}
.menu-btn{display:none}
@media (max-width:900px){
  .nav-links{display:none;position:absolute;left:0;right:0;top:62px;flex-direction:column;padding:12px;gap:2px;background:var(--panel);border-bottom:1px solid var(--line)}
  .nav-links.open{display:flex}
  .nav-link{text-align:left;width:100%}
  .menu-btn{display:inline-flex}
  .nav-actions .hide-sm{display:none}
}
.hero{padding:64px 0 40px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
@media (max-width:960px){.hero-grid{grid-template-columns:1fr;gap:28px}.hero{padding:38px 0 24px}}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:rgba(91,140,255,.1);color:#adc4ff;font-size:12.5px;font-weight:600;margin-bottom:18px}
html[data-theme="light"] .pill{color:#2c50b8}
h1.hero-title{font-size:clamp(34px,6vw,58px);line-height:1.05;letter-spacing:-.035em;margin:0 0 16px;font-weight:800}
.grad{background:linear-gradient(100deg,#6ea1ff,#a06bff 55%,#5b8cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{font-size:clamp(15px,2.1vw,18px);color:var(--txt-2);max-width:560px;margin:0 0 26px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-note{margin-top:14px;font-size:12.5px;color:var(--txt-3)}
.mock{border-radius:var(--radius-lg);border:1px solid var(--line-2);background:linear-gradient(180deg,var(--panel-2),var(--panel));overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.mock-bar{display:flex;gap:6px;padding:11px 13px;border-bottom:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.16)}
.mock-body{display:grid;grid-template-columns:150px 1fr;min-height:290px}
@media(max-width:520px){.mock-body{grid-template-columns:1fr}.mock-side{display:none}}
.mock-side{border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:7px}
.mock-line{height:9px;border-radius:6px;background:rgba(255,255,255,.07)}
.mock-main{padding:16px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:88%;padding:10px 13px;border-radius:13px;font-size:13px;line-height:1.55}
.bubble.user{align-self:flex-end;background:linear-gradient(135deg,rgba(91,140,255,.9),rgba(139,92,246,.85));color:#fff}
.bubble.ai{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line)}
.section{padding:56px 0}
.section-head{text-align:center;max-width:680px;margin:0 auto 34px}
.section-head h2{font-size:clamp(24px,3.6vw,34px);letter-spacing:-.03em;margin:0 0 10px}
.section-head p{color:var(--txt-2);margin:0;font-size:15px}
.features{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.feature{padding:18px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel);transition:border-color .16s,transform .16s}
.feature:hover{border-color:var(--line-2);transform:translateY(-2px)}
.feature-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(91,140,255,.13);color:#8fb0ff;margin-bottom:12px}
.feature h3{margin:0 0 6px;font-size:15px}
.feature p{margin:0;font-size:13.5px;color:var(--txt-2);line-height:1.6}
.price-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.price{padding:24px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel)}
.price.hl{border-color:rgba(91,140,255,.5);background:linear-gradient(180deg,rgba(91,140,255,.09),transparent)}
.price h3{margin:0 0 4px;font-size:16px}
.price .amt{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:10px 0 4px}
.price ul{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:9px}
.price li{display:flex;gap:9px;font-size:13.5px;color:var(--txt-2);align-items:flex-start}
.price li svg{color:var(--ok);margin-top:2px}
.footer{border-top:1px solid var(--line);padding:28px 0;margin-top:30px;color:var(--txt-3);font-size:13px}
.footer-in{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.auth-wrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:26px 16px}
.auth-card{width:100%;max-width:420px;padding:26px;border-radius:var(--radius-lg);border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.auth-card h1{font-size:23px;margin:14px 0 4px;letter-spacing:-.02em}
.auth-card .sub{color:var(--txt-2);font-size:14px;margin:0 0 20px}
.divider{display:flex;align-items:center;gap:12px;color:var(--txt-3);font-size:12px;margin:18px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.alert{padding:11px 13px;border-radius:var(--radius-sm);font-size:13.5px;margin-bottom:14px;border:1px solid;display:flex;gap:9px;align-items:flex-start}
.alert.err{background:rgba(240,86,74,.1);border-color:rgba(240,86,74,.35);color:#ffa79f}
.alert.ok{background:rgba(47,191,113,.1);border-color:rgba(47,191,113,.35);color:#8ee0b3}
.alert.info{background:rgba(91,140,255,.1);border-color:rgba(91,140,255,.35);color:#a9c2ff}
.shell{display:grid;grid-template-columns:246px 1fr;min-height:100vh;min-height:100dvh}
@media (max-width:1024px){.shell{grid-template-columns:1fr}}
.side{position:sticky;top:0;height:100vh;height:100dvh;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow-y:auto;z-index:60}
@media (max-width:1024px){
  .side{position:fixed;left:0;top:0;width:270px;transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow)}
  .side.open{transform:translateX(0)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.on{opacity:1;pointer-events:auto}
}
.side-head{padding:16px 16px 12px;display:flex;align-items:center;justify-content:space-between}
#sidebar-close{display:none}
@media (max-width:1024px){#sidebar-close{display:inline-flex}}
.side-nav{padding:6px 10px 20px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--txt-2);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background .14s,color .14s}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--txt)}
html[data-theme="light"] .nav-item:hover{background:rgba(15,23,42,.05)}
.nav-item.active{background:rgba(91,140,255,.14);color:#a8c0ff}
html[data-theme="light"] .nav-item.active{color:#2c50b8}
.nav-sep{margin:12px 12px 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--txt-3);font-weight:700}
.side-foot{padding:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:10px;object-fit:cover;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:0 0 auto;overflow:hidden}
.avatar.lg{width:52px;height:52px;border-radius:14px;font-size:18px}
.avatar.xl{width:78px;height:78px;border-radius:20px;font-size:26px}
.avatar.sm{width:26px;height:26px;border-radius:8px;font-size:11px}
.avatar img{width:100%;height:100%;object-fit:cover}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(11,16,24,.82);backdrop-filter:blur(12px)}
html[data-theme="light"] .topbar{background:rgba(255,255,255,.85)}
.topbar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page{padding:20px 16px 96px;max-width:1180px;width:100%;margin:0 auto}
@media(min-width:1025px){.page{padding-bottom:40px}}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:none;border-top:1px solid var(--line);background:rgba(11,16,24,.94);backdrop-filter:blur(12px);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
html[data-theme="light"] .bottom-nav{background:rgba(255,255,255,.95)}
.bottom-nav .inner{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:10px;border:none;background:none;color:var(--txt-3);font-size:10.5px;font-weight:600;cursor:pointer;min-width:0}
.bn-item.active{color:#8fb0ff;background:rgba(91,140,255,.12)}
.bn-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
@media(max-width:1024px){.bottom-nav{display:block}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{padding:16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel)}
.stat .k{font-size:12px;color:var(--txt-3);font-weight:600;display:flex;align-items:center;gap:7px}
.stat .v{font-size:27px;font-weight:800;letter-spacing:-.03em;margin-top:7px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.ai-card{padding:16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:12px;transition:border-color .16s,transform .16s}
.ai-card:hover{border-color:var(--line-2);transform:translateY(-2px)}
.ai-card-top{display:flex;gap:12px;align-items:flex-start;min-width:0}
.ai-card-top .meta{min-width:0;flex:1}
.ai-name{font-weight:700;font-size:15px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-desc{font-size:13px;color:var(--txt-2);margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--txt-2);background:var(--panel-2);cursor:pointer;font-family:inherit}
.tag.b{color:#a8c0ff;border-color:rgba(91,140,255,.4);background:rgba(91,140,255,.1)}
.tag.g{color:#8ee0b3;border-color:rgba(47,191,113,.4);background:rgba(47,191,113,.1)}
.tag.y{color:#f5cd6a;border-color:rgba(240,180,41,.4);background:rgba(240,180,41,.1)}
.tag.r{color:#ffa79f;border-color:rgba(240,86,74,.4);background:rgba(240,86,74,.1)}
.ai-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:18px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step-chip{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600;color:var(--txt-3);cursor:pointer;white-space:nowrap;font-family:inherit}
.step-chip .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);font-size:11px;border:1px solid var(--line-2)}
.step-chip.active{color:var(--txt);border-color:rgba(91,140,255,.5);background:rgba(91,140,255,.1)}
.step-chip.active .n{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
.step-chip.done .n{background:rgba(47,191,113,.2);color:#8ee0b3;border-color:rgba(47,191,113,.4)}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
.preset{padding:12px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--panel-2);cursor:pointer;text-align:left;font-family:inherit;color:inherit}
.preset:hover{border-color:var(--line-2)}
.preset.on{border-color:var(--brand);background:rgba(91,140,255,.1)}
.preset b{display:block;font-size:13.5px;margin-bottom:3px}
.preset span{font-size:11.5px;color:var(--txt-3);line-height:1.4}
.chat-layout{display:grid;grid-template-columns:262px 1fr;gap:14px;height:calc(100vh - 60px - 40px);height:calc(100dvh - 60px - 40px);min-height:420px}
@media(max-width:1024px){.chat-layout{grid-template-columns:1fr;height:calc(100dvh - 60px - 62px)}}
.chat-side{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden;min-height:0}
@media(max-width:1024px){.chat-side{display:none}.chat-side.mobile-open{display:flex;position:fixed;inset:60px 0 62px 0;z-index:50;border-radius:0;margin:0}}
.chat-side-head{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.conv-list{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:3px;flex:1;min-height:0}
.conv-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;border:none;background:none;width:100%;text-align:left;color:var(--txt-2);font-size:13.5px;font-family:inherit}
.conv-item:hover{background:rgba(255,255,255,.06);color:var(--txt)}
html[data-theme="light"] .conv-item:hover{background:rgba(15,23,42,.05)}
.conv-item.active{background:rgba(91,140,255,.14);color:#a8c0ff}
.conv-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

window.addEventListener('error', e => {
  console.error(e.error || e.message);

});
window.addEventListener('unhandledrejection', e => {
  console.error(e.reason);

});
function showFatal(msg){
  let el = document.getElementById('__fatal');
  if(!el){
    el = document.createElement('div');
    el.id = '__fatal';
    el.className = 'global-error';
    document.body.appendChild(el);

  el.innerHTML = '<h2>Terjadi Kesalahan</h2><p style="margin:0 0 12px;color:#98a5bd">Periksa Console browser untuk detail. Jika masalah berlanjut, pastikan Firestore sudah diaktifkan di Firebase Console.</p><pre>'+String(msg).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</pre><button id="__fatal-reload" style="margin-top:14px;padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#131a28;color:#fff;cursor:pointer;font-weight:600">Muat Ulang</button>';

}

function toast(msg, kind='info', ms=3200){
  const host = $('#toast-host');
  if(!host) return;
  const el = document.createElement('div');
  el.className = 'toast '+kind;
  const ic = kind==='err' ? svg('alert','i sm') : kind==='ok' ? svg('check','i sm') : svg('bell','i sm');
  el.innerHTML = `${ic}<div>${esc(msg)}</div>`;
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, ms);
}

  const host = $('#modal-host');

const timeAgo = ts => {
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const s = Math.floor((Date.now()-d.getTime())/1000);
  if(s<60) return 'baru saja';
  if(s<3600) return Math.floor(s/60)+' mnt lalu';
  if(s<86400) return Math.floor(s/3600)+' jam lalu';
  if(s<604800) return Math.floor(s/86400)+' hari lalu';
  return d.toLocaleDateString('id-ID');
};

async function saveUserProfileDoc(user, data={}){
  const ref = doc(db,'users',user.uid);
  const snap = await getDoc(ref);
  const base = {
    uid: user.uid,
    email: user.email || '',
    displayName: user.displayName || (user.email||'').split('@')[0],
    photoURL: user.photoURL || '',
    updatedAt: serverTimestamp()
  };
  if(!snap.exists()){
    await setDoc(ref, { ...base, createdAt: serverTimestamp(), ...data });
  } else {
    await updateDoc(ref, { ...base, ...data });
  }
}
async function loadProfile(user){
  const ref = doc(db,'users',user.uid);
  let snap = await getDoc(ref);
  if(!snap.exists()){ await saveUserProfileDoc(user); snap = await getDoc(ref); }
  State.profile = { id: snap.id, ...snap.data() };
  if(State.profile.settings) State.settings = { ...State.settings, ...State.profile.settings };
  return State.profile;
}
async function saveProfilePatch(patch){
  if(!State.user) return;
  const ref = doc(db,'users', State.user.uid);
  await updateDoc(ref, { ...patch, updatedAt: serverTimestamp() });
  State.profile = { ...State.profile, ...patch };
}
async function updateSettings(patch){
  const s = { ...State.settings, ...patch };
  State.settings = s;
  await saveProfilePatch({ settings: s });
}

async function getApiKey(provider){
  if(!State.user) return null;
  const ref = doc(db,'users',State.user.uid,'secrets','providers');
  const snap = await getDoc(ref);
  if(!snap.exists()) return null;
  return snap.data()[provider] || null;
}
async function saveApiKey(provider, key){
  const ref = doc(db,'users',State.user.uid,'secrets','providers');
  const snap = await getDoc(ref);
  const data = snap.exists() ? snap.data() : {};
  data[provider] = key;
  await setDoc(ref, data, { merge:true });
}

async function* callAI({ provider, model, apiKey, messages, system, temperature=0.7, maxTokens=1024, signal }){
  if(!apiKey) throw new Error('API key belum dikonfigurasi. Buka Settings > API Providers.');
  if(provider === 'gemini'){
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse&key=${apiKey}`;
    const contents = messages.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] }));
    const body = { contents, systemInstruction: system ? { parts:[{text: system}] } : undefined, generationConfig: { temperature, maxOutputTokens: maxTokens } };
    const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body), signal });
    if(!res.ok){ const t = await res.text().catch(()=>''); throw new Error('Gemini '+res.status+': '+t.slice(0,200)); }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while(true){
      const { value, done } = await reader.read(); if(done) break;
      buf += dec.decode(value, { stream:true });
      const parts = buf.split('\n'); buf = parts.pop();
      for(const line of parts){
        if(!line.startsWith('data:')) continue;
        const json = line.slice(5).trim();
        if(!json || json === '[DONE]') continue;
        try{ const obj = JSON.parse(json); const text = obj.candidates?.[0]?.content?.parts?.map(p=>p.text).join('') || ''; if(text) yield { delta: text, done:false }; }catch(e){}
      }
    }
    yield { delta:'', done:true }; return;
  }
  const endpoints = {
    openrouter:'https://openrouter.ai/api/v1/chat/completions',
    openai:'https://api.openai.com/v1/chat/completions',
    groq:'https://api.groq.com/openai/v1/chat/completions',
    together:'https://api.together.xyz/v1/chat/completions',
    deepseek:'https://api.deepseek.com/v1/chat/completions',
    mistral:'https://api.mistral.ai/v1/chat/completions'
  };
  const url = endpoints[provider] || endpoints.openrouter;
  const finalMessages = system ? [{role:'system',content:system}, ...messages] : messages;
  const headers = { 'Content-Type':'application/json', 'Authorization': 'Bearer '+apiKey };
  if(provider === 'openrouter'){ headers['HTTP-Referer'] = location.origin; headers['X-Title'] = 'AI Forge'; }
  const res = await fetch(url, {
    method:'POST', headers,
    body: JSON.stringify({ model, messages: finalMessages, temperature, max_tokens: maxTokens, stream: true }),
    signal
  });
  if(!res.ok){ let detail=''; try{ detail = await res.text(); }catch(e){} throw new Error(`${provider} ${res.status}: ${detail.slice(0,240)}`); }
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
  while(true){
    const { value, done } = await reader.read(); if(done) break;
    buf += dec.decode(value, { stream:true });
    const parts = buf.split('\n'); buf = parts.pop();
    for(const line of parts){
      const t = line.trim(); if(!t.startsWith('data:')) continue;
      const json = t.slice(5).trim();
      if(json === '[DONE]'){ yield { delta:'', done:true }; return; }
      try{ const obj = JSON.parse(json); const d = obj.choices?.[0]?.delta?.content; if(d) yield { delta: d, done:false }; }catch(e){}
    }
  }
  yield { delta:'', done:true };
}

  }

async function previewSend(){
  const inp = $('#preview-input');
  const text = inp.value.trim();
  if(!text) return;
  inp.value = '';
  const container = $('#preview-chat');
  const emptyMsg = container.querySelector('div[style*="text-align:center"]');
  if(emptyMsg) emptyMsg.remove();
  const userEl = document.createElement('div');
  userEl.className = 'msg user';
  userEl.innerHTML = `<div class="body">${esc(text)}</div>`;
  container.appendChild(userEl);
  const aiEl = document.createElement('div');
  aiEl.className = 'msg ai';
  aiEl.innerHTML = `<div class="body"><div class="typing"><i></i><i></i><i></i></div></div>`;
  container.appendChild(aiEl);
  container.scrollTop = container.scrollHeight;
  try{
    const key = await getApiKey(Draft.data.provider);
    if(!key) throw new Error('API key '+Draft.data.provider+' belum dikonfigurasi di Settings → API.');
    const sys = buildSystemPrompt(Draft.data, State.profile);
    let out = '';
    for await (const chunk of callAI({ provider: Draft.data.provider, model: Draft.data.model, apiKey: key, system: sys, messages: [{ role:'user', content: text }] })){
      if(chunk.done) break;
      out += chunk.delta;
      aiEl.querySelector('.body').textContent = out;
      container.scrollTop = container.scrollHeight;
    }
    if(!out) aiEl.querySelector('.body').textContent = '(tidak ada respons)';
  }catch(err){
    aiEl.querySelector('.body').innerHTML = `<span style="color:#ff8f85">${esc(err.message)}</span>`;
  }
}

function buildSystemPrompt(ai, profile){
  const now = new Date();
  const lang = State.settings.defaultLanguage === 'id' ? 'Bahasa Indonesia' : State.settings.defaultLanguage;
  let s = ai.instructions || `You are ${ai.name || 'an AI'}, a helpful assistant.`;
  s = s.replace(/\{\{user_name\}\}/g, profile?.displayName || 'Pengguna').replace(/\{\{ai_name\}\}/g, ai.name || 'AI').replace(/\{\{date\}\}/g, now.toISOString().slice(0,10)).replace(/\{\{language\}\}/g, lang);
  const parts = [s];
  if(ai.personalityDesc) parts.push(`Kepribadian: ${ai.personalityDesc}`);
  if(ai.tone) parts.push(`Tone: ${ai.tone}`);
  if(ai.speakingStyle) parts.push(`Gaya bicara: ${ai.speakingStyle}`);
  if(ai.behavior) parts.push(`Perilaku: ${ai.behavior}`);
  if(ai.rules) parts.push(`Aturan: ${ai.rules}`);
  if(ai.avoid) parts.push(`Hindari: ${ai.avoid}`);
  if(ai.knowledge?.length){
    const k = ai.knowledge.filter(x=>x.content).map(x=>`### ${x.name}\n${x.content.slice(0,4000)}`).join('\n\n');
    if(k) parts.push(`\nKONTEKS PENGETAHUAN:\n${k}`);
  }
  return parts.join('\n\n');
}

async function publishAI(){
  if(!Draft.data.name.trim()){ toast('Nama AI wajib','err'); Draft.step=0; render(); return; }
  if(!Draft.data.slug.trim()) Draft.data.slug = slugify(Draft.data.name);
  try{
    const isEdit = !!State.params.id;
    const aiId = isEdit ? State.params.id : uid();
    const existing = State.ais.find(a=>a.id===aiId);
    const docData = {
      ownerId: State.user.uid,
      name: Draft.data.name.trim(), slug: Draft.data.slug, description: Draft.data.description||'', avatar: Draft.data.avatar||'',
      category: Draft.data.category, visibility: Draft.data.visibility,
      personality: Draft.data.personality, personalityDesc: Draft.data.personalityDesc||'',
      tone: Draft.data.tone||'', speakingStyle: Draft.data.speakingStyle||'', behavior: Draft.data.behavior||'', rules: Draft.data.rules||'', avoid: Draft.data.avoid||'',
      instructions: Draft.data.instructions||'', knowledge: Draft.data.knowledge||[], capabilities: Draft.data.capabilities||{},
      model: Draft.data.model, provider: Draft.data.provider, status: 'published',
      usageCount: existing?.usageCount || 0,
      updatedAt: serverTimestamp()
    };
    if(!isEdit) docData.createdAt = serverTimestamp();
    await setDoc(doc(db,'ais',aiId), docData, { merge:true });
    toast(isEdit ? 'AI diperbarui' : 'AI dipublikasikan','ok');
    clearDraft();
    Draft.step = 0;
    Draft.data = { name:'',slug:'',description:'',avatar:'',category:'General',visibility:'private',personality:'Friendly',personalityDesc:'',tone:'friendly',speakingStyle:'conversational',behavior:'',rules:'',avoid:'',instructions:'',knowledge:[],capabilities:{webSearch:false,fileReading:true,codeGeneration:true,memory:true},model:'meta-llama/llama-3.1-8b-instruct:free',provider:'openrouter' };
    State.params = {};
    navigate('my-ai');
  }catch(err){ toast('Gagal menyimpan: '+err.message,'err'); }
}

async function sendMessage(){
  const input = $('#chat-input');
  const text = input.value.trim();
  if(!text) return;
  const aiId = State.params.aiId || (State.ais[0]?.id);
  const ai = State.ais.find(a=>a.id===aiId);
  if(!ai){ toast('Pilih AI dulu','err'); return; }

  let convId = State.currentConversation?.id;
  if(!convId){
    const ref = doc(collection(db,'conversations'));
    convId = ref.id;
    await setDoc(ref, {
      ownerId: State.user.uid,
      aiId: ai.id, aiName: ai.name, aiAvatar: ai.avatar||'',
      title: text.slice(0,50), messageCount: 0,
      createdAt: serverTimestamp(), updatedAt: serverTimestamp()
    });
    State.currentConversation = { id: convId, aiId: ai.id, aiName: ai.name, title: text.slice(0,50), messageCount:0 };
  }
  const userMsg = { role:'user', content: text, createdAt: Date.now() };
  const userRef = doc(collection(db,'conversations',convId,'messages'));
  userMsg.id = userRef.id;
  await setDoc(userRef, { role:'user', content:text, createdAt: serverTimestamp() });
  State.messages.push(userMsg);
  input.value = '';
  input.style.height = 'auto';

  const body = $('#chat-body');
  const em = body.querySelector('.empty');
  if(em) em.remove();
  body.insertAdjacentHTML('beforeend', renderMessage({ ...userMsg, createdAt: new Date() }));

  const aiMsgId = 'streaming-'+uid();
  body.insertAdjacentHTML('beforeend', `
    <div class="msg ai" data-msg="${aiMsgId}">
      <div class="avatar sm">${svg('ai','i sm')}</div>
      <div><div class="body"><div class="typing"><i></i><i></i><i></i></div></div></div>
    </div>`);
  body.scrollTop = body.scrollHeight;

  const history = State.messages.filter(m=>m.content).slice(-16).map(m=>({ role:m.role, content:m.content }));
  const sys = buildSystemPrompt(ai, State.profile);
  const stopBtn = $('#chat-stop');
  const sendBtn = $('#chat-send');
  const controller = new AbortController();
  State._abort = controller;
  if(stopBtn) stopBtn.classList.remove('hidden');
  if(sendBtn) sendBtn.classList.add('hidden');

  let fullText = '';
  try{
    const key = await getApiKey(ai.provider);
    if(!key) throw new Error(`API key ${ai.provider} belum dikonfigurasi. Buka Settings → API.`);
    const el = document.querySelector(`[data-msg="${aiMsgId}"] .body`);
    for await (const chunk of callAI({ provider: ai.provider, model: ai.model, apiKey: key, system: sys, messages: history, signal: controller.signal })){
      if(chunk.done) break;
      fullText += chunk.delta;
      if(el) el.textContent = fullText;
      body.scrollTop = body.scrollHeight;
    }
    if(!fullText) throw new Error('Model tidak mengembalikan teks. Coba lagi.');
    const aiRef = doc(collection(db,'conversations',convId,'messages'));
    await setDoc(aiRef, { role:'assistant', content: fullText, createdAt: serverTimestamp() });
    await updateDoc(doc(db,'conversations',convId), { messageCount: (State.currentConversation.messageCount||0)+2, updatedAt: serverTimestamp() });
    State.currentConversation.messageCount = (State.currentConversation.messageCount||0)+2;
    State.messages.push({ id: aiRef.id, role:'assistant', content: fullText, createdAt: Date.now() });
    const node = document.querySelector(`[data-msg="${aiMsgId}"]`);
    if(node) node.outerHTML = renderMessage({ id: aiRef.id, role:'assistant', content: fullText, createdAt: new Date() });
    await updateDoc(doc(db,'ais',ai.id), { usageCount: (ai.usageCount||0)+1 });
  }catch(err){
    const node = document.querySelector(`[data-msg="${aiMsgId}"]`);
    if(node) node.querySelector('.body').innerHTML = `<span style="color:#ff8f85">${esc(err.message||'Gagal mendapatkan respons')}</span>`;
    if(err.name === 'AbortError') toast('Dihentikan','info');
    else toast(err.message||'AI error','err',5000);
  }finally{
    State._abort = null;
    if(stopBtn) stopBtn.classList.add('hidden');
    if(sendBtn) sendBtn.classList.remove('hidden');
  }
}

/* ============================================================
   ANALYTICS
   ============================================================ */
function renderAnalytics(){
  const convs = State.conversations;
  const ais = State.ais;
  const totalMsgs = convs.reduce((s,c)=>s+(c.messageCount||0),0);
  const totalUsage = ais.reduce((s,a)=>s+(a.usageCount||0),0);
  const days = 7;
  const buckets = Array(days).fill(0);
  convs.forEach(c=>{
    if(!c.createdAt) return;
    const d = c.createdAt.toDate ? c.createdAt.toDate() : new Date(c.createdAt);
    const diff = Math.floor((Date.now() - d.getTime())/86400000);
    if(diff >= 0 && diff < days) buckets[days-1-diff]++;
  });
  const maxV = Math.max(1,...buckets);
  return renderShell('analytics', 'Analytics', `
    <div class="stats">
      <div class="stat"><div class="k">${svg('chat','i sm')} Percakapan</div><div class="v">${convs.length}</div></div>
      <div class="stat"><div class="k">${svg('file','i sm')} Total Pesan</div><div class="v">${totalMsgs}</div></div>
      <div class="stat"><div class="k">${svg('ai','i sm')} Total AI</div><div class="v">${ais.length}</div></div>
      <div class="stat"><div class="k">${svg('chart','i sm')} Total Interaksi</div><div class="v">${totalUsage}</div></div>
    </div>
    <div class="card card-pad">
      <h3 class="card-title" style="margin-bottom:4px">Percakapan 7 Hari Terakhir</h3>
      <p class="card-sub" style="margin-bottom:18px">Data aktual dari akun Anda.</p>
      ${convs.length===0 ? `<div class="empty" style="padding:24px">${svg('chart')}<h3>Belum ada data</h3><p>Mulai chat untuk melihat analitik.</p></div>`
      : `<div style="display:flex;gap:8px;align-items:flex-end;height:180px">
          ${buckets.map((v,i)=>{
            const d = new Date(); d.setDate(d.getDate()-(days-1-i));
            const label = d.toLocaleDateString('id-ID',{weekday:'short'});
            const h = (v/maxV)*100;
            return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">
              <div style="font-size:11px;color:var(--txt-3)">${v}</div>
              <div style="width:100%;background:linear-gradient(180deg,var(--brand),var(--brand-2));border-radius:6px;height:${Math.max(h,3)}%;min-height:4px"></div>
              <div style="font-size:11px;color:var(--txt-3)">${label}</div>
            </div>`;
          }).join('')}
        </div>`}
    </div>
  `);
}

/* ============================================================

   ============================================================ */
function render(){
  const app = $('#app');
  if(!app) return;
  const route = State.route;

  if(!State.user){
    if(route==='login'){ app.innerHTML = renderLogin(); afterRender(); return; }
    if(route==='signup'){ app.innerHTML = renderSignup(); afterRender(); return; }
    if(route==='docs'){ app.innerHTML = renderDocs(); afterRender(); return; }
    if(route==='explore-public'){ app.innerHTML = renderExplorePublic(); afterRender(); loadPublicAIs($('#explore-grid')); return; }
    if(route==='ai-profile'){ renderAiProfile(State.params.slug).then(h=>{ app.innerHTML = h; afterRender(); }); return; }
    app.innerHTML = renderLanding(); afterRender(); return;
  }

  switch(route){
    case 'login':
    case 'signup':
      navigate('dashboard'); return;
    case 'dashboard': app.innerHTML = renderDashboard(); break;
    case 'my-ai': app.innerHTML = renderMyAI(); break;
    case 'create-ai': app.innerHTML = renderCreateAI(); break;
    case 'playground': app.innerHTML = renderPlayground(); break;
    case 'knowledge': app.innerHTML = renderKnowledge(); break;
    case 'conversations': app.innerHTML = renderConversations(); break;
    case 'explore': app.innerHTML = renderExplore(); break;
    case 'analytics': app.innerHTML = renderAnalytics(); break;
    case 'api': app.innerHTML = renderApiPage(); break;
    case 'settings': app.innerHTML = renderSettings(); break;
    case 'ai-profile':
      renderAiProfile(State.params.slug).then(h=>{ app.innerHTML = h; afterRender(); });
      return;
    default:
      app.innerHTML = renderDashboard();
  }
  afterRender();
}

/* ============================================================
   POST-RENDER BINDINGS
   ============================================================ */
function afterRender(){
  $$('[data-nav]').forEach(el=>{
    el.onclick = ()=>{
      const r = el.dataset.nav;
      if(r==='home' && State.user) navigate('dashboard');
      else navigate(r);
    };
  });
  $$('[data-scroll]').forEach(el=>{
    el.onclick = ()=>{ document.getElementById(el.dataset.scroll)?.scrollIntoView({behavior:'smooth'}); };
  });
  const openBtn = $('#sidebar-open');
  const closeBtn = $('#sidebar-close');
  const side = $('#sidebar');
  const scrim = $('#scrim');
  if(openBtn && side && scrim) openBtn.onclick = ()=>{ side.classList.add('open'); scrim.classList.add('on'); };
  if(closeBtn && side && scrim) closeBtn.onclick = ()=>{ side.classList.remove('open'); scrim.classList.remove('on'); };
  if(scrim && side) scrim.onclick = ()=>{ side.classList.remove('open'); scrim.classList.remove('on'); };
  const logoutBtn = $('#btn-logout');
  if(logoutBtn) logoutBtn.onclick = doLogout;
  const navT = $('#nav-toggle');
  if(navT) navT.onclick = ()=> $('#nav-links')?.classList.toggle('open');

/* ============================================================
   DELEGATED WIZARD EVENTS
   ============================================================ */
document.addEventListener('input', e=>{
  const el = e.target.closest('[data-wz]');
  if(!el) return;
  const key = el.dataset.wz;
  Draft.data[key] = el.value;
  if(key==='name' && !Draft.data._slugEdited){
    Draft.data.slug = slugify(el.value);
    const s = $('#wz-slug'); if(s) s.value = Draft.data.slug;
  }
  if(key==='slug') Draft.data._slugEdited = true;
  saveDraft();
});
document.addEventListener('change', e=>{
  const el = e.target.closest('[data-cap]');
  if(!el) return;
  Draft.data.capabilities[el.dataset.cap] = el.checked;
  saveDraft();
});
document.addEventListener('click', async e=>{
  // Preset personality
  const preset = e.target.closest('[data-preset]');
  if(preset){
    Draft.data.personality = preset.dataset.preset;
    saveDraft();
    const body = $('#wizard-body');
    if(body){ body.innerHTML = renderStep(Draft.step); }
    return;
  }
  // Step chip
  const stepChip = e.target.closest('.step-chip');
  if(stepChip && $('#wizard-body')){
    Draft.step = +stepChip.dataset.step; saveDraft(); render(); return;
  }
  if(e.target.closest('#wz-next')){
    if(!validateStep(Draft.step)) return;
    Draft.step = Math.min(Draft.step+1, WIZARD_STEPS.length-1); saveDraft(); render(); return;
  }
  if(e.target.closest('#wz-back')){ Draft.step = Math.max(Draft.step-1, 0); saveDraft(); render(); return; }
  if(e.target.closest('#wz-save-draft')){ saveDraft(); toast('Draft disimpan','ok'); return; }
  if(e.target.closest('#wz-publish')){ await publishAI(); return; }

  if(e.target.closest('#kn-text')){
    modal({ title:'Tambah Teks', body:`<div class="field"><label class="label">Nama</label><input class="input" id="kn-t-name" placeholder="Nama knowledge" /></div><div class="field"><label class="label">Isi</label><textarea class="textarea" id="kn-t-body" placeholder="Tulis pengetahuan..."></textarea></div>`,
      actions:[{ label:'Batal', className:'btn-ghost' }, { label:'Tambah', primary:true, onClick: ()=>{
        const n = $('#kn-t-name').value.trim(); const b = $('#kn-t-body').value.trim();
        if(!n || !b){ toast('Nama dan isi wajib','err'); return false; }
        Draft.data.knowledge.push({ id:uid(), name:n, type:'text', content:b, size:b.length, status:'ready', createdAt:Date.now() });
        saveDraft(); render();
      }}]});
    return;
  }
  if(e.target.closest('#kn-file')){
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.txt,.md,.json,.csv';
    inp.onchange = async ()=>{
      const f = inp.files[0]; if(!f) return;
      if(f.size > 512*1024){ toast('File terlalu besar (maks 512 KB)','err'); return; }
      const text = await f.text();
      Draft.data.knowledge.push({ id:uid(), name:f.name, type:'file', content:text, size:text.length, status:'ready', createdAt:Date.now() });
      saveDraft(); render(); toast('File ditambahkan','ok');
    };
    inp.click(); return;
  }
  if(e.target.closest('#kn-url')){
    modal({ title:'Tambah URL', body:`<div class="field"><label class="label">URL</label><input class="input" id="kn-u-url" placeholder="https://..." /></div><div class="field"><label class="label">Teks (opsional, disarankan)</label><textarea class="textarea" id="kn-u-body"></textarea></div>`,
      actions:[{ label:'Batal', className:'btn-ghost' }, { label:'Tambah', primary:true, onClick: ()=>{
        const u = $('#kn-u-url').value.trim(); const b = $('#kn-u-body').value.trim();
        if(!u){ toast('URL wajib','err'); return false; }
        Draft.data.knowledge.push({ id:uid(), name:u, type:'url', content:b, url:u, size:b.length, status: b?'ready':'pending', createdAt:Date.now() });
        saveDraft(); render();
      }}]});
    return;
  }
  const rmK = e.target.closest('[data-rm-knowledge]');
  if(rmK){ Draft.data.knowledge.splice(+rmK.dataset.rmKnowledge,1); saveDraft(); render(); return; }
  if(e.target.closest('#preview-send')){ await previewSend(); return; }
});

async function confirmDeleteAI(id){
  const ai = State.ais.find(a=>a.id===id);
  modal({ title:'Hapus AI', body:`Yakin ingin menghapus <b>${esc(ai?.name||'AI')}</b>?`,
    actions:[{ label:'Batal', className:'btn-ghost' }, { label:'Hapus', className:'btn-danger', onClick: async ()=>{
      await deleteDoc(doc(db,'ais',id)); toast('AI dihapus','ok'); navigate('my-ai');
    }}]});
}
async function confirmDeleteConversation(id){
  modal({ title:'Hapus Percakapan', body:'Semua pesan akan ikut terhapus.',
    actions:[{ label:'Batal', className:'btn-ghost' }, { label:'Hapus', className:'btn-danger', onClick: async ()=>{
      const msgsSnap = await getDocs(collection(db,'conversations',id,'messages'));
      const batch = writeBatch(db);
      msgsSnap.docs.forEach(d=> batch.delete(d.ref));
      batch.delete(doc(db,'conversations',id));
      await batch.commit();
      if(State.currentConversation?.id === id){ State.currentConversation = null; State.messages = []; }
      toast('Percakapan dihapus','ok'); navigate('conversations');
    }}]});
}
async function renameConversation(id){
  const c = State.conversations.find(x=>x.id===id);
  modal({ title:'Ubah Nama', body:`<div class="field"><label class="label">Judul</label><input class="input" id="rn-title" value="${esc(c?.title||'')}" /></div>`,
    actions:[{ label:'Batal', className:'btn-ghost' }, { label:'Simpan', primary:true, onClick: async ()=>{
      const t = $('#rn-title').value.trim();
      if(!t){ toast('Judul wajib','err'); return false; }
      await updateDoc(doc(db,'conversations',id), { title:t, updatedAt:serverTimestamp() });
      toast('Tersimpan','ok'); navigate('conversations');
    }}]});
}
async function openConversation(id){
  const convSnap = await getDoc(doc(db,'conversations',id));
  if(!convSnap.exists()){ toast('Percakapan tidak ditemukan','err'); return; }
  State.currentConversation = { id, ...convSnap.data() };
  const msgsSnap = await getDocs(query(collection(db,'conversations',id,'messages'), orderBy('createdAt','asc')));
  State.messages = msgsSnap.docs.map(d=>({ id:d.id, ...d.data(), createdAt: d.data().createdAt?.toDate?.() || new Date() }));
  navigate('playground', { aiId: State.currentConversation.aiId, convId:id });
}
async function exportConversation(id){
  const convSnap = await getDoc(doc(db,'conversations',id)); if(!convSnap.exists()) return;
  const msgsSnap = await getDocs(query(collection(db,'conversations',id,'messages'), orderBy('createdAt','asc')));
  downloadJSON({ conversation:{ id, ...convSnap.data() }, messages: msgsSnap.docs.map(d=>({ id:d.id, ...d.data() })) }, `conversation-${id}.json`);
}
async function exportAllConversations(){
  if(State.conversations.length===0){ toast('Belum ada percakapan','info'); return; }
  const all = [];
  for(const c of State.conversations){
    const msgsSnap = await getDocs(query(collection(db,'conversations',c.id,'messages'), orderBy('createdAt','asc')));
    all.push({ ...c, messages: msgsSnap.docs.map(d=>({ id:d.id, ...d.data() })) });
  }
  downloadJSON({ conversations: all }, 'aiforge-conversations.json');
}
function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

function bindPlayground(){
  const newChatBtn = $('#new-chat');
  if(newChatBtn) newChatBtn.onclick = ()=>{
    State.currentConversation = null; State.messages = [];
    const aiSel = $('#ai-select');
    if(aiSel && aiSel.value) State.params.aiId = aiSel.value;
    render();
  };
  const aiSel = $('#ai-select');
  if(aiSel) aiSel.onchange = ()=>{ State.params.aiId = aiSel.value; State.currentConversation = null; State.messages = []; render(); };
  const chatSend = $('#chat-send');
  const chatInput = $('#chat-input');
  if(chatSend) chatSend.onclick = sendMessage;
  if(chatInput){
    chatInput.onkeydown = (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); } };
    chatInput.oninput = ()=>{ chatInput.style.height = 'auto'; chatInput.style.height = Math.min(chatInput.scrollHeight, 170) + 'px'; };
  }
  const stopBtn = $('#chat-stop');
  if(stopBtn) stopBtn.onclick = ()=>{ State._abort?.abort(); };
  $$('[data-copy]').forEach(b=>{ b.onclick = ()=>{ const m = State.messages.find(x=>x.id===b.dataset.copy); if(m && navigator.clipboard) navigator.clipboard.writeText(m.content).then(()=>toast('Disalin','ok')); }; });
  $$('[data-regen]').forEach(b=>{ b.onclick = async ()=>{
    const idx = State.messages.findIndex(x=>x.id===b.dataset.regen); if(idx<0) return;
    const lastUser = [...State.messages.slice(0,idx)].reverse().find(x=>x.role==='user'); if(!lastUser){ toast('Tidak ada pesan user','err'); return; }
    try{ await deleteDoc(doc(db,'conversations',State.currentConversation.id,'messages',b.dataset.regen)); }catch(e){}
    State.messages = State.messages.slice(0, idx);
    render();
    const inp = $('#chat-input'); inp.value = lastUser.content;
    State.messages.pop();
    await sendMessage();
  }; });
  const convList = $('#conv-list');
  if(convList) convList.querySelectorAll('[data-conv]').forEach(el=>{ el.onclick = ()=> openConversation(el.dataset.conv); });
}

function authErr(code){
  const map = {
    'auth/invalid-email':'Email tidak valid.','auth/user-not-found':'Akun tidak ditemukan.','auth/wrong-password':'Password salah.',
    'auth/invalid-credential':'Email atau password salah.','auth/email-already-in-use':'Email sudah terdaftar.',

/* ============================================================
   USER DATA SUBSCRIPTIONS
   ============================================================ */
function subscribeUserData(uid){
  clearSubs();
  const aisQ = query(collection(db,'ais'), where('ownerId','==', uid));
  State.unsub.push(onSnapshot(aisQ, snap=>{
    State.ais = snap.docs.map(d=>({ id:d.id, ...d.data() })).sort((a,b)=>(b.updatedAt?.seconds||0)-(a.updatedAt?.seconds||0));
    if(State.user && State.route!=='login' && State.route!=='signup') render();
  }, err=> toast('Gagal memuat AI: '+err.message,'err', 6000)));
  const convQ = query(collection(db,'conversations'), where('ownerId','==', uid));
  State.unsub.push(onSnapshot(convQ, snap=>{
    State.conversations = snap.docs.map(d=>({ id:d.id, ...d.data() })).sort((a,b)=>(b.updatedAt?.seconds||0)-(a.updatedAt?.seconds||0));
    if(State.user && ['conversations','dashboard','playground'].includes(State.route)) render();
  }, err=> toast('Gagal memuat percakapan: '+err.message,'err', 6000)));
}

/* ============================================================
   AUTH STATE
   ============================================================ */
onAuthStateChanged(auth, async user=>{
  if(user){
    State.user = user;
    try{
      await loadProfile(user);
      subscribeUserData(user.uid);
      const hash = location.hash.replace(/^#\/?/, '');
      if(hash.startsWith('ai/')){
        State.route = 'ai-profile'; State.params = { slug: hash.slice(3) };
      } else if(hash){
        const [r] = hash.split('/');
        if(['dashboard','my-ai','create-ai','playground','knowledge','conversations','explore','analytics','api','settings'].includes(r)){
          State.route = r; State.params = {};
        } else if(!['dashboard','my-ai','create-ai','playground','knowledge','conversations','explore','analytics','api','settings','ai-profile'].includes(State.route)){
          State.route = 'dashboard';
        }
      } else if(!['dashboard','my-ai','create-ai','playground','knowledge','conversations','explore','analytics','api','settings','ai-profile'].includes(State.route)){
        State.route = 'dashboard';
      }
      render();
    }catch(e){
      console.error(e);
      toast('Gagal memuat profil: '+e.message,'err');
      render();
    }
  } else {
    State.user = null; State.profile = null;
    clearSubs();
    State.ais = []; State.conversations = [];
    State.currentConversation = null; State.messages = [];
    const hash = location.hash.replace(/^#\/?/, '');
    if(hash.startsWith('ai/')){ State.route = 'ai-profile'; State.params = { slug: hash.slice(3) }; }
    else if(hash === 'explore' || hash === 'explore-public'){ State.route = 'explore-public'; }
    else if(hash === 'docs'){ State.route = 'docs'; }
    else if(hash === 'login'){ State.route = 'login'; }
    else if(hash === 'signup'){ State.route = 'signup'; }
    else { State.route = 'home'; }
    render();
  }
});

/* ============================================================
   HASH ROUTING
   ============================================================ */
window.addEventListener('hashchange', ()=>{
  const hash = location.hash.replace(/^#\/?/, '');
  if(hash.startsWith('ai/')){ navigate('ai-profile', { slug: hash.slice(3) }); return; }
  if(!hash) return;
  const [r, ...rest] = hash.split('/');
  if(['home','login','signup','docs','explore-public'].includes(r)){ navigate(r); return; }
  if(State.user && ['dashboard','my-ai','create-ai','playground','knowledge','conversations','explore','analytics','api','settings'].includes(r)){
    navigate(r, rest[0]?{ aiId:rest[0] }:{});
  }
});

/* ============================================================
   ONLINE/OFFLINE
   ============================================================ */
window.addEventListener('online', ()=>{ const el = $('#net-banner'); if(el) el.hidden = true; });
window.addEventListener('offline', ()=>{ const el = $('#net-banner'); if(el) el.hidden = false; });
if(!navigator.onLine){ const el = $('#net-banner'); if(el) el.hidden = false; }

/* ============================================================
   PWA INSTALL PROMPT
   ============================================================ */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  deferredPrompt = e;
  const dismissed = localStorage.getItem('aiforge.installDismissed');
  if(!dismissed){ const el = $('#install-banner'); if(el) el.hidden = false; }
});
const installDismiss = $('#install-dismiss');
if(installDismiss) installDismiss.onclick = ()=>{ const el = $('#install-banner'); if(el) el.hidden = true; localStorage.setItem('aiforge.installDismissed','1'); };
const installAccept = $('#install-accept');
if(installAccept) installAccept.onclick = async ()=>{
  const el = $('#install-banner'); if(el) el.hidden = true;
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const res = await deferredPrompt.userChoice;
  if(res.outcome === 'accepted') toast('Aplikasi dipasang','ok');
  deferredPrompt = null;
};

/* ============================================================
   KEYBOARD
   ============================================================ */
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeModal(); });

/* ============================================================
   SERVICE WORKER (inline)
   ============================================================ */
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE = 'aiforge-v1';
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
    self.addEventListener('fetch', e => {
      if(e.request.method !== 'GET') return;
      const url = new URL(e.request.url);
      if(url.origin !== location.origin) return;
      e.respondWith(caches.open(CACHE).then(c => c.match(e.request).then(r => r || fetch(e.request).then(res => { if(res.ok) c.put(e.request, res.clone()); return res; }).catch(()=>c.match(e.request)))));
    });
  `;
  try{
    const blob = new Blob([swCode], { type:'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  }catch(e){}
}

/* ============================================================
   KICKOFF
   ============================================================ */
render();
</script>
</body>
