                    showToast('Semua data dihapus', 'success');
                });
            }

            // ===== REFRESH =====
            async function refreshAll() {
                await loadProfile();
                await loadChats();
                renderChatList();
                if (state.currentChatId) {
                    const chat = state.chats.find(c => c.id === state.currentChatId);
                    if (chat) {
                        await loadMessages(state.currentChatId);
                        renderMessages(state.currentChatId);
                        showChatView(chat);
                    } else {
                        state.currentChatId = null;
                        showChatView(null);
                    }
                } else {
                    showChatView(null);
                }
                const dark = localStorage.getItem('fashchat-dark') === 'true';
                state.darkMode = dark;
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                const qs = localStorage.getItem('fashchat-qrsize');
                if (qs) state.qrSize = parseInt(qs);
            }

            // ===== NEW CHAT MODAL =====
            function showNewChatModal() {
                const html = `
                    <h2><i class="fas fa-plus-circle" style="color:var(--primary);margin-right:8px;"></i> Chat Baru</h2>
                    <p>Masukkan nama untuk percakapan baru.</p>
                    <div class="form-group">
                        <input id="newChatNameInput" type="text" placeholder="Nama chat..." class="form-input" />
                    </div>
                    <div class="btn-group">
                        <button class="btn-primary" id="newChatConfirmBtn"><i class="fas fa-check"></i> Buat Chat</button>
                        <button class="btn-outline" id="newChatCancelBtn"><i class="fas fa-times"></i> Batal</button>
                    </div>
                `;
                openModal(html);
                const input = document.getElementById('newChatNameInput');
                input?.focus();
                document.getElementById('newChatConfirmBtn')?.addEventListener('click', async () => {
                    const name = input?.value.trim() || 'Chat ' + (state.chats.length + 1);
                    const chat = await createChat(name);
                    closeModal();
                    openChat(chat.id);
                    showToast('Chat dibuat!', 'success');
                });
                document.getElementById('newChatCancelBtn')?.addEventListener('click', closeModal);
                input?.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') document.getElementById('newChatConfirmBtn')?.click();
                });
            }

            // ===== RENAME MODAL =====
            function showRenameModal() {
                const chat = state.chats.find(c => c.id === state.currentChatId);
                if (!chat) return;
                const html = `
                    <h2><i class="fas fa-pen" style="color:var(--primary);margin-right:8px;"></i> Ubah Nama Chat</h2>
                    <p>Masukkan nama baru untuk chat ini.</p>
                    <div class="form-group">
                        <input id="renameChatInput" type="text" value="${escapeHtml(chat.name)}" class="form-input" />
                    </div>
                    <div class="btn-group">
                        <button class="btn-primary" id="renameConfirmBtn"><i class="fas fa-save"></i> Simpan</button>
                        <button class="btn-outline" id="renameCancelBtn"><i class="fas fa-times"></i> Batal</button>
                    </div>
                `;
                openModal(html);
                const input = document.getElementById('renameChatInput');
                input?.focus();
                input?.select();
                document.getElementById('renameConfirmBtn')?.addEventListener('click', async () => {
                    const name = input?.value.trim() || 'Chat';
                    await renameChat(chat.id, name);
                    closeModal();
                });
                document.getElementById('renameCancelBtn')?.addEventListener('click', closeModal);
                input?.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') document.getElementById('renameConfirmBtn')?.click();
                });
            }

            // ===== PROFILE =====
            function showProfile() {
                const p = state.profile;
                if (!p) return;
                const avatarChar = p.avatar ? '' : (p.username.charAt(0) || '?');
                const avatarHtml = p.avatar ? `<img src="${p.avatar}" alt="" />` : avatarChar;
                const html = `
                    <div style="display:flex;flex-direction:column;gap:16px;">
                        <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
                            <div class="big-avatar" style="width:80px;height:80px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:600;overflow:hidden;text-transform:uppercase;">${avatarHtml}</div>
                            <div>
                                <h2 style="font-size:1.4rem;font-weight:700;">${escapeHtml(p.username)}</h2>
                                <div style="font-size:0.8rem;color:var(--text-secondary);font-family:monospace;"><i class="fas fa-id-card"></i> ${escapeHtml(p.userId)}</div>
                            </div>
                        </div>
                        <div class="actions-grid">
                            <button id="profileEditBtn"><i class="fas fa-user-edit"></i> Edit Profil</button>
                            <button id="profileShareQrBtn"><i class="fas fa-share-alt"></i> Bagikan QR</button>
                        </div>
                        <div style="margin-top:8px;font-size:0.8rem;color:var(--text-secondary);text-align:center;">
                            <i class="fas fa-calendar-alt"></i> Bergabung: ${new Date(p.createdAt).toLocaleDateString('id-ID')}
                        </div>
                    </div>
                `;
                openModal(html);

                document.getElementById('profileEditBtn')?.addEventListener('click', () => {
                    closeModal();
                    showEditProfile();
                });
                document.getElementById('profileShareQrBtn')?.addEventListener('click', () => {
                    closeModal();
                    shareProfileQR();
                });
            }

            function showEditProfile() {
                const p = state.profile;
                const html = `
                    <h2><i class="fas fa-user-edit" style="color:var(--primary);margin-right:8px;"></i> Edit Profil</h2>
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input id="editUsername" type="text" value="${escapeHtml(p.username)}" class="form-input" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Avatar URL (opsional)</label>
                        <input id="editAvatar" type="text" value="${escapeHtml(p.avatar || '')}" placeholder="https://example.com/avatar.jpg" class="form-input" />
                    </div>
                    <div class="btn-group">
                        <button class="btn-primary" id="editProfileSaveBtn"><i class="fas fa-save"></i> Simpan</button>
                        <button class="btn-outline" id="editProfileCancelBtn"><i class="fas fa-times"></i> Batal</button>
                    </div>
                `;
                openModal(html);
                document.getElementById('editProfileSaveBtn')?.addEventListener('click', async () => {
                    const username = document.getElementById('editUsername').value.trim() || 'Pengguna';
                    const avatar = document.getElementById('editAvatar').value.trim();
                    await updateProfile({ username, avatar });
                    closeModal();
                    showToast('Profil diperbarui!', 'success');
                    renderChatList();
                });
                document.getElementById('editProfileCancelBtn')?.addEventListener('click', closeModal);
            }

            // ===== EVENTS =====
            dom.searchInput.addEventListener('input', () => {
                renderChatList(dom.searchInput.value);
            });

            dom.newChatBtn.addEventListener('click', showNewChatModal);
            dom.newChatFromEmpty.addEventListener('click', showNewChatModal);

            dom.scanFromSidebarBtn.addEventListener('click', startScan);
            dom.scanFromEmpty.addEventListener('click', startScan);
            dom.searchScanBtn.addEventListener('click', startScan);

            dom.profileBtn.addEventListener('click', showProfile);
            dom.settingsBtn.addEventListener('click', showSettings);

            dom.chatBackBtn.addEventListener('click', () => {
                state.currentChatId = null;
                showChatView(null);
                dom.sidebar.classList.add('open');
                dom.sidebarOverlay.classList.add('active');
            });

            dom.sendBtn.addEventListener('click', sendCurrentMessage);
            dom.msgInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendCurrentMessage();
                }
            });
            dom.msgInput.addEventListener('input', () => {
                dom.msgInput.style.height = 'auto';
                dom.msgInput.style.height = Math.min(dom.msgInput.scrollHeight, 100) + 'px';
            });

            async function sendCurrentMessage() {
                const text = dom.msgInput.value.trim();
                if (!text || !state.currentChatId) return;
                await sendMessage(state.currentChatId, text, true, false);
                dom.msgInput.value = '';
                dom.msgInput.style.height = 'auto';
                dom.msgInput.focus();
            }

            dom.msgQrBtn.addEventListener('click', async () => {
                const text = dom.msgInput.value.trim();
                if (!text) {
                    showToast('Tulis pesan terlebih dahulu', 'error');
                    return;
                }
                await createMessageQR(text);
            });

            dom.shareChatQrBtn.addEventListener('click', () => {
                if (state.currentChatId) shareChatQR(state.currentChatId);
            });

            dom.renameChatBtn.addEventListener('click', showRenameModal);

            dom.emojiBtn.addEventListener('click', () => {
                const emojis = ['😊', '😂', '❤️', '👍', '🔥', '✨', '👋', '🙏', '💪', '🎉', '🤔', '😍', '🥳', '😎', '🤗', '💬',
                    '📱', '🌟'
                ];
                const html = `
                    <h2><i class="far fa-smile" style="color:var(--primary);margin-right:8px;"></i> Emoji</h2>
                    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:8px 0;">
                        ${emojis.map(e => `<button style="font-size:1.8rem;padding:8px;border-radius:8px;background:var(--bg-input);transition:background 0.2s;" data-emoji="${e}">${e}</button>`).join('')}
                    </div>
                    <button class="btn-outline" id="emojiCloseBtn"><i class="fas fa-times"></i> Tutup</button>
                `;
                openModal(html);
                document.querySelectorAll('[data-emoji]').forEach(el => {
                    el.addEventListener('click', () => {
                        const emoji = el.dataset.emoji;
                        dom.msgInput.value += emoji;
                        dom.msgInput.dispatchEvent(new Event('input'));
                        closeModal();
                        dom.msgInput.focus();
                    });
                });
                document.getElementById('emojiCloseBtn')?.addEventListener('click', closeModal);
            });

            dom.sidebarOverlay.addEventListener('click', () => {
                dom.sidebar.classList.remove('open');
                dom.sidebarOverlay.classList.remove('active');
            });

            document.addEventListener('click', (e) => {
                const item = e.target.closest('.chat-item');
                if (item && window.innerWidth <= 768) {
                    dom.sidebar.classList.remove('open');
                    dom.sidebarOverlay.classList.remove('active');
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'k') {
                    e.preventDefault();
                    dom.searchInput.focus();
                }
                if (e.key === 'Escape') {
                    if (dom.modalOverlay.classList.contains('active')) closeModal();
                    if (dom.scanView.classList.contains('active')) stopScan();
                }
            });

            // ===== INIT =====
            async function init() {
                await refreshAll();
                if (state.chats.length === 0) {
                    showChatView(null);
                } else {
                    const first = state.chats[0];
                    if (first) await openChat(first.id);
                }
                const dark = localStorage.getItem('fashchat-dark') === 'true';
                state.darkMode = dark;
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                const qs = localStorage.getItem('fashchat-qrsize');
                if (qs) state.qrSize = parseInt(qs);
                console.log('🚀 FashChat siap!');
            }

            init().catch(err => {
                console.error('Init error:', err);
                showToast('Gagal memuat aplikasi: ' + err.message, 'error');
            });

        })();
    </script>

</body>
</html>
