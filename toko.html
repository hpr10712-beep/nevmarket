<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lihat Toko - NEV Market</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script type="importmap">
        {
            "imports": {
                "firebase-app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase-database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
            }
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-body: #0f3b0f;
            --bg-card: rgba(10, 46, 10, 0.90);
            --bg-card-hover: rgba(10, 46, 10, 0.95);
            --border-color: rgba(239, 178, 44, 0.20);
            --text-primary: #ffffff;
            --text-secondary: #b8d9b8;
            --text-muted: rgba(255, 255, 255, 0.45);
            --accent-gold: #efb22c;
            --accent-green: #10b981;
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --transition: all 0.25s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(0,0,0,0.0) 60%, rgba(0,0,0,0.3) 100%),
                linear-gradient(180deg, #0f3b0f 0%, #0a2a0a 100%);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ============================================================
           NAVBAR
           ============================================================ */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 12px 0;
            background: rgba(5, 20, 5, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
        }
        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-brand {
            font-size: 1.3rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            text-decoration: none;
        }
        .nav-brand i {
            color: var(--accent-gold);
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
            list-style: none;
        }
        .nav-links a {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.85rem;
            transition: var(--transition);
            text-decoration: none;
        }
        .nav-links a:hover {
            color: var(--text-primary);
        }
        .nav-hamburger {
            display: none;
            font-size: 1.3rem;
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px;
                left: 0;
                right: 0;
                background: rgba(5, 20, 5, 0.98);
                padding: 20px 24px;
                gap: 12px;
                border-bottom: 1px solid var(--border-color);
            }
            .nav-links.open { display: flex; }
            .nav-hamburger { display: block; }
        }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 20px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            font-family: inherit;
        }
        .btn-gold {
            background: var(--accent-gold);
            color: #0a2a0a;
            box-shadow: 0 4px 16px rgba(239, 178, 44, 0.25);
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(239, 178, 44, 0.35);
        }
        .btn-gold.following {
            background: rgba(255,255,255,0.08);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .btn-success {
            background: var(--accent-green);
            color: #fff;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.25);
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }
        .btn-back {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            padding: 6px 0 12px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }
        .btn-back:hover {
            color: var(--text-primary);
        }

        /* ============================================================
           SKELETON
           ============================================================ */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-sm);
            position: relative;
            overflow: hidden;
        }
        .skeleton::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255,255,255,0.04) 25%,
                    rgba(255,255,255,0.07) 50%,
                    rgba(255,255,255,0.04) 75%,
                    transparent 100%);
            background-size: 200% 100%;
            animation: shimmer 1.8s ease-in-out infinite;
        }
        .skeleton-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 30px;
            box-shadow: var(--shadow-lg);
        }
        .skeleton-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            margin: 0 auto 12px;
        }
        .skeleton-text {
            height: 14px;
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
            margin-bottom: 8px;
        }
        .skeleton-text.w-50 { width: 50%; }
        .skeleton-text.w-70 { width: 70%; }
        .skeleton-text.w-90 { width: 90%; }
        .skeleton-text.w-30 { width: 30%; }
        .skeleton-text.h-20 { height: 20px; }
        .skeleton-text.h-24 { height: 24px; }
        .skeleton-text.h-40 { height: 40px; }
        .skeleton-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        /* ============================================================
           STORE PAGE
           ============================================================ */
        .store-wrapper {
            margin-top: 80px;
        }

        .store-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            animation: fadeUp 0.5s ease;
        }
        .store-card.hidden { display: none; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* HEADER */
        .store-header {
            padding: 28px 30px 20px;
            display: flex;
            gap: 24px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border-color);
        }
        .store-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            color: #0a2a0a;
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid var(--border-color);
        }
        .store-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .store-info {
            flex: 1;
            min-width: 180px;
        }
        .store-info .name {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-primary);
        }
        .store-info .label {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            background: var(--accent-gold);
            color: #0a2a0a;
            padding: 1px 12px;
            border-radius: 40px;
            margin-top: 2px;
        }
        .store-info .desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
            line-height: 1.5;
        }
        .store-info .contact {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .store-info .contact a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
        }
        .store-info .contact a:hover {
            color: var(--accent-gold);
        }
        .store-info .contact i {
            color: var(--accent-gold);
            width: 16px;
        }

        .store-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-self: flex-start;
            margin-top: 2px;
        }

        /* STATS BAR */
        .store-stats {
            display: flex;
            gap: 28px;
            padding: 14px 30px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        .store-stats .stat {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .store-stats .stat .num {
            font-weight: 700;
            color: var(--text-primary);
        }
        .store-stats .stat .num.gold {
            color: var(--accent-gold);
        }
        .store-stats .stat i {
            color: var(--accent-gold);
            width: 16px;
            font-size: 0.8rem;
        }

        /* PRODUCTS */
        .store-products {
            padding: 20px 30px 30px;
        }
        .store-products .section-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .store-products .section-title i {
            color: var(--accent-gold);
        }
        .store-products .section-title .count {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 0.85rem;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 14px;
        }
        .product-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: var(--transition);
            text-decoration: none;
            color: var(--text-primary);
        }
        .product-item:hover {
            transform: translateY(-3px);
            border-color: var(--accent-gold);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            background: var(--bg-card-hover);
        }
        .product-item .img-wrap {
            aspect-ratio: 1;
            overflow: hidden;
            background: rgba(5,20,5,0.4);
        }
        .product-item .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-item .info {
            padding: 8px 12px 12px;
        }
        .product-item .info .name {
            font-weight: 600;
            font-size: 0.8rem;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-item .info .price {
            color: var(--accent-gold);
            font-weight: 700;
            font-size: 0.85rem;
            margin-top: 1px;
        }
        .product-item .info .meta {
            font-size: 0.6rem;
            color: var(--text-muted);
            display: flex;
            gap: 10px;
            margin-top: 3px;
            flex-wrap: wrap;
        }
        .product-item .info .meta i {
            color: var(--accent-gold);
        }
        .product-item .badge-type {
            font-size: 0.45rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 1px 8px;
            border-radius: 40px;
            background: var(--accent-green);
            color: #fff;
            display: inline-block;
        }

        .product-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 0;
            grid-column: 1 / -1;
        }
        .product-empty i {
            font-size: 2rem;
            opacity: 0.3;
            display: block;
            margin-bottom: 6px;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 8px 22px;
            border-radius: 40px;
            box-shadow: var(--shadow-lg);
            z-index: 99999;
            display: none;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(16px);
            opacity: 0;
            transition: all 0.35s ease;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-primary);
        }
        .toast.show {
            display: flex;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast i { font-size: 0.9rem; }
        .toast.success i { color: var(--accent-green); }
        .toast.error i { color: #ef4444; }
        .toast.info i { color: var(--accent-gold); }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .store-header {
                padding: 20px;
                flex-direction: column;
                text-align: center;
            }
            .store-avatar {
                width: 70px;
                height: 70px;
                font-size: 2rem;
            }
            .store-info .name { font-size: 1.3rem; }
            .store-info .desc { font-size: 0.82rem; }
            .store-actions { align-self: center; justify-content: center; }
            .store-stats {
                padding: 12px 20px;
                gap: 14px;
                justify-content: center;
            }
            .store-stats .stat { font-size: 0.75rem; }
            .store-products { padding: 16px 20px 24px; }
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .skeleton-card { padding: 20px; }
        }
        @media (max-width: 480px) {
            .product-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .store-stats { gap: 10px; }
            .store-stats .stat { font-size: 0.65rem; }
            .store-info .contact { font-size: 0.7rem; gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- ============ NAVBAR ============ -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand"><i class="fas fa-crown"></i> NEV Market</a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="produk.html">Produk</a></li>
                <li><a href="jasa.html">Jasa</a></li>
                <li><a href="index.html#tentang">Tentang</a></li>
            </ul>
            <button class="nav-hamburger" id="hamburger"><i class="fas fa-bars"></i></button>

    </nav>

    <!-- ============ TOAST ============ -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMsg">Berhasil!</span>
    </div>

    <!-- ============ MAIN ============ -->
    <div class="container store-wrapper">

        <!-- KEMBALI -->
        <button class="btn-back" id="btnBack">
            <i class="fas fa-arrow-left"></i> Kembali
        </button>

        <!-- SKELETON -->
        <div id="skeletonCard" class="skeleton-card">
            <div class="skeleton-grid">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-text w-70 h-20"></div>
                <div class="skeleton-text w-50 h-16"></div>
                <div class="skeleton-text w-90 h-40"></div>
                <div class="skeleton-text w-60 h-20"></div>
                <div style="display:flex;gap:10px;margin-top:4px;">
                    <div class="skeleton-text w-30 h-30" style="border-radius:40px;"></div>
                    <div class="skeleton-text w-30 h-30" style="border-radius:40px;"></div>
                </div>
            </div>
        </div>

        <!-- STORE CARD -->
        <div id="storeCard" class="store-card hidden">

            <!-- HEADER -->
            <div class="store-header">
                <div class="store-avatar" id="storeAvatar">
                    <i class="fas fa-store"></i>
                </div>
                <div class="store-info">
                    <div class="name" id="storeName">Nama Toko</div>
                    <span class="label" id="storeLabel">Default</span>
                    <div class="desc" id="storeDesc">Deskripsi toko.</div>
                    <div class="contact" id="storeContact">
                        <span><i class="fab fa-whatsapp"></i> <a href="#" id="storeWhatsapp">-</a></span>
                        <span><i class="fas fa-globe"></i> <a href="#" id="storeLink" target="_blank">-</a></span>
                        <span><i class="fas fa-calendar-alt"></i> <span id="storeJoined">-</span></span>
                    </div>
                </div>
                <div class="store-actions">
                    <button class="btn btn-gold" id="followBtn"><i class="fas fa-heart"></i> <span id="followText">Ikuti</span></button>
                    <a href="#" id="storeWhatsappBtn" class="btn btn-success" target="_blank"><i class="fab fa-whatsapp"></i> Chat</a>
                </div>
            </div>

            <!-- STATS -->
            <div class="store-stats" id="storeStats">
                <div class="stat"><i class="fas fa-users"></i> <span class="num" id="storeFollowers">0</span> pengikut</div>
                <div class="stat"><i class="fas fa-star"></i> <span class="num gold" id="storeRating">0.0</span> (<span id="storeTotalRatings">0</span> ulasan)</div>
                <div class="stat"><i class="fas fa-box"></i> <span class="num" id="storeTotalProducts">0</span> produk</div>
                <div class="stat"><i class="fas fa-shopping-cart"></i> <span class="num" id="storeTotalTerjual">0</span> terjual</div>
            </div>

            <!-- PRODUCTS -->
            <div class="store-products">
                <div class="section-title">
                    <i class="fas fa-box"></i> Produk Toko
                    <span class="count" id="productCount">(0)</span>
                </div>
                <div class="product-grid" id="productGrid">
                    <div class="product-empty"><i class="fas fa-box-open"></i> Belum ada produk.</div>
                </div>
            </div>
        </div>

    </div>

    <!-- ============ JAVASCRIPT ============ -->
    <script type="module">
        import { initializeApp } from "firebase-app";
        import { getDatabase, ref, get, set, onValue, update } from "firebase-database";

        const firebaseConfig = {
            apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8",
            authDomain: "mybro-9ba5f.firebaseapp.com",
            databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com/",
            projectId: "mybro-9ba5f"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function getDeviceId() {
            let id = localStorage.getItem('logoShop_deviceId');
            if (!id) {
                id = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
                localStorage.setItem('logoShop_deviceId', id);
            }
            return id;
        }
        const DEVICE_ID = getDeviceId();

        function showToast(msg, type = 'info') {
            const t = document.getElementById('toast');
            const m = document.getElementById('toastMsg');
            const icon = t.querySelector('i');
            icon.className = 'fas fa-' + (type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle');
            t.className = 'toast show ' + type;
            m.textContent = msg;
            clearTimeout(t._hide);
            t._hide = setTimeout(() => { t.classList.remove('show'); }, 4000);
        }

        // Hamburger
        document.getElementById('hamburger').addEventListener('click', () => {
            document.getElementById('navLinks').classList.toggle('open');
        });

        // Back
        document.getElementById('btnBack').addEventListener('click', () => window.history.back());

        // Get sellerId
        const params = new URLSearchParams(window.location.search);
        const sellerId = params.get('sellerId');

        if (!sellerId) {
            showToast('Toko tidak ditemukan.', 'error');
            document.getElementById('skeletonCard').innerHTML = `
                <div style="text-align:center;padding:30px;color:var(--text-secondary);">
                    <i class="fas fa-exclamation-triangle" style="font-size:2rem;display:block;margin-bottom:8px;"></i>
                    <h2>Toko tidak ditemukan</h2>
                    <button class="btn btn-gold" style="margin-top:10px;" onclick="history.back()">Kembali</button>
                </div>
            `;
            throw new Error('Seller ID missing');
        }

        let sellerData = null;
        let productsData = {};
        let ordersData = {};
        let isFollowing = false;
        let allProducts = [];

        async function loadData() {
            try {
                const sellerSnap = await get(ref(db, `logo-shop/sellers/${sellerId}`));
                if (!sellerSnap.exists()) {
                    showToast('Toko tidak ditemukan.', 'error');
                    document.getElementById('skeletonCard').innerHTML = `
                        <div style="text-align:center;padding:30px;color:var(--text-secondary);">
                            <i class="fas fa-store-slash" style="font-size:2rem;display:block;margin-bottom:8px;"></i>
                            <h2>Toko tidak ditemukan</h2>
                            <button class="btn btn-gold" style="margin-top:10px;" onclick="history.back()">Kembali</button>
                        </div>
                    `;
                    return;
                }
                sellerData = sellerSnap.val();
                sellerData.id = sellerId;

                const productsSnap = await get(ref(db, 'logo-shop/products'));
                productsData = productsSnap.val() || {};
                allProducts = Object.entries(productsData)
                    .filter(([k, v]) => v.sellerId === sellerId)
                    .map(([k, v]) => ({ key: k, ...v }));

                const ordersSnap = await get(ref(db, 'logo-shop/orders'));
                ordersData = ordersSnap.val() || {};

                document.getElementById('skeletonCard').style.display = 'none';
                document.getElementById('storeCard').classList.remove('hidden');

                renderStore();
                renderProducts();
                checkFollowStatus();

            } catch (err) {
                showToast('Gagal memuat data.', 'error');
                console.error(err);
            }
        }

        function renderStore() {
            const avatar = document.getElementById('storeAvatar');
            if (sellerData.image) {
                avatar.innerHTML = `<img src="${sellerData.image}" alt="${sellerData.storeName}" />`;
            } else {
                avatar.innerHTML = `<i class="fas fa-store"></i>`;
            }

            document.getElementById('storeName').textContent = sellerData.storeName || 'Toko';
            document.getElementById('storeLabel').textContent = sellerData.category || 'Default';
            document.getElementById('storeDesc').textContent = sellerData.description || 'Tidak ada deskripsi.';

            const wa = sellerData.whatsapp || '';
            const waEl = document.getElementById('storeWhatsapp');
            const waBtn = document.getElementById('storeWhatsappBtn');
            if (wa) {
                const num = wa.replace(/[^0-9]/g, '');
                waEl.textContent = wa;
                waEl.href = `https://wa.me/${num}`;
                waBtn.href = `https://wa.me/${num}`;
                waBtn.style.display = 'inline-flex';
            } else {
                waEl.textContent = '-';
                waEl.href = '#';
                waBtn.style.display = 'none';
            }

            const link = sellerData.link || '';
            const linkEl = document.getElementById('storeLink');
            if (link) {
                linkEl.textContent = link;
                linkEl.href = link;
                linkEl.style.display = 'inline';
            } else {
                linkEl.textContent = '-';
                linkEl.href = '#';
                linkEl.style.display = 'none';
            }

            document.getElementById('storeJoined').textContent = sellerData.createdAt ?
                new Date(sellerData.createdAt).toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' }) :
                '-';

            // Stats
            let totalTerjual = 0;
            for (const key in ordersData) {
                const o = ordersData[key];
                if (o.status === 'completed' && allProducts.find(p => p.key === o.productId)) {
                    totalTerjual++;
                }
            }

            document.getElementById('storeFollowers').textContent = sellerData.followers || 0;
            document.getElementById('storeRating').textContent = (sellerData.rating || 0).toFixed(1);
            document.getElementById('storeTotalRatings').textContent = sellerData.totalRatings || 0;
            document.getElementById('storeTotalProducts').textContent = allProducts.length;
            document.getElementById('storeTotalTerjual').textContent = totalTerjual;
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            document.getElementById('productCount').textContent = `(${allProducts.length})`;

            if (allProducts.length === 0) {
                grid.innerHTML = `<div class="product-empty"><i class="fas fa-box-open"></i> Toko ini belum memiliki produk.</div>`;
                return;
            }

            let html = '';
            allProducts.forEach(item => {
                const isJasa = item.isJasa === true;
                const price = `Rp ${new Intl.NumberFormat('id-ID').format(item.price || 0)}`;
                const img = item.image || 'https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=200&q=80';
                let terjual = 0;
                for (const key in ordersData) {
                    const o = ordersData[key];
                    if (o.productId === item.key && o.status === 'completed') terjual++;
                }
                html += `
                    <a href="detail.html?productId=${item.key}" class="product-item">
                        <div class="img-wrap"><img src="${img}" alt="${item.name}" loading="lazy" /></div>
                        <div class="info">
                            <div class="name">${item.name || 'Produk'}</div>
                            <div class="price">${price}</div>
                            <div class="meta">
                                <span><i class="fas fa-star"></i> ${(item.rating || 0).toFixed(1)} (${item.totalRatings || 0})</span>
                                <span><i class="fas fa-shopping-cart"></i> ${terjual}</span>
                                <span class="badge-type">${isJasa ? 'Jasa' : 'Digital'}</span>
                            </div>
                        </div>
                    </a>
                `;
            });
            grid.innerHTML = html;
        }

        async function checkFollowStatus() {
            const snap = await get(ref(db, `logo-shop/followers/${sellerId}/${DEVICE_ID}`));
            isFollowing = snap.exists();
            updateFollowBtn();
        }

        function updateFollowBtn() {
            const btn = document.getElementById('followBtn');
            const text = document.getElementById('followText');
            if (isFollowing) {
                btn.classList.add('following');
                text.textContent = 'Mengikuti';
                btn.querySelector('i').className = 'fas fa-heart';
            } else {
                btn.classList.remove('following');
                text.textContent = 'Ikuti';
                btn.querySelector('i').className = 'fas fa-heart';
            }
        }

        document.getElementById('followBtn').addEventListener('click', async function() {
            try {
                const refFollow = ref(db, `logo-shop/followers/${sellerId}/${DEVICE_ID}`);
                if (isFollowing) {
                    await set(refFollow, null);
                    await update(ref(db, `logo-shop/sellers/${sellerId}`), {
                        followers: Math.max(0, (sellerData.followers || 0) - 1)
                    });
                    isFollowing = false;
                    showToast('Berhenti mengikuti toko.', 'info');
                } else {
                    await set(refFollow, true);
                    await update(ref(db, `logo-shop/sellers/${sellerId}`), {
                        followers: (sellerData.followers || 0) + 1
                    });
                    isFollowing = true;
                    showToast('Berhasil mengikuti toko!', 'success');
                }
                const snap = await get(ref(db, `logo-shop/sellers/${sellerId}`));
                if (snap.exists()) {
                    sellerData = snap.val();
                    sellerData.id = sellerId;
                    renderStore();
                }
                updateFollowBtn();
            } catch (err) {
                showToast('Gagal: ' + err.message, 'error');
            }
        });

        // Real-time listeners
        function listenFollowers() {
            onValue(ref(db, `logo-shop/sellers/${sellerId}/followers`), (snap) => {
                const val = snap.val() || 0;
                document.getElementById('storeFollowers').textContent = val;
                if (sellerData) sellerData.followers = val;
            });
        }

        function listenProducts() {
            onValue(ref(db, 'logo-shop/products'), (snap) => {
                productsData = snap.val() || {};
                allProducts = Object.entries(productsData)
                    .filter(([k, v]) => v.sellerId === sellerId)
                    .map(([k, v]) => ({ key: k, ...v }));
                renderProducts();
                renderStore();
            });
        }

        function listenOrders() {
            onValue(ref(db, 'logo-shop/orders'), (snap) => {
                ordersData = snap.val() || {};
                renderProducts();
                renderStore();
            });
        }

        // Init
        await loadData();
        listenFollowers();
        listenProducts();
        listenOrders();
        console.log('🏪 Store page loaded. Seller ID:', sellerId);
    </script>
</body>
</html>
