<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3390ec">
<title>HaloKita</title>
<style>
:root{--bg:#fff;--bg2:#eaf1f8;--ln:rgba(15,23,34,.07);--tx:#0f1722;--sub:#6b7a8c;--pr:#2f7ff0;--ot:#fff;--sh:0 2px 8px rgba(30,60,110,.12);--ease:cubic-bezier(.22,.8,.24,1);--card:rgba(255,255,255,.95)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16202b;--bg2:#0d141c;--ln:rgba(255,255,255,.07);--tx:#eef3f8;--sub:#8497ab;--pr:#4a9bff;--ot:#212f3e;--sh:0 2px 8px rgba(0,0,0,.35);--card:rgba(22,32,43,.95)}}:root[data-theme=dark]{--bg:#16202b;--bg2:#0d141c;--ln:rgba(255,255,255,.07);--tx:#eef3f8;--sub:#8497ab;--pr:#4a9bff;--ot:#212f3e;--sh:0 2px 8px rgba(0,0,0,.35);--card:rgba(22,32,43,.95)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;transition:transform .18s var(--ease),opacity .25s,filter .2s}
button:active{transform:scale(.94)}
.i{width:26px;height:26px;flex:none;filter:drop-shadow(0 2px 2px rgba(20,40,90,.28));transition:transform .3s var(--ease)}
.i.big{width:110px;height:110px;filter:drop-shadow(0 8px 8px rgba(20,40,90,.3))}
#auth{height:100%;display:grid;place-items:center;padding:20px;overflow:auto;background:radial-gradient(circle at 15% 12%,#6cc3ff 0,transparent 45%),radial-gradient(circle at 88% 92%,#a07bff 0,transparent 50%),linear-gradient(160deg,#2f7ff0,#3f4fd8)}
.card{width:100%;max-width:350px;background:var(--card);color:var(--tx);border-radius:28px;padding:26px 22px 18px;display:flex;flex-direction:column;gap:10px;text-align:center;box-shadow:0 24px 60px rgba(10,20,80,.35);animation:rise .7s var(--ease) both}
.card .i.big{width:96px;height:96px;margin:-4px auto 0;animation:bob 4s ease-in-out infinite}
.card h1{font-size:26px;letter-spacing:-.3px}
.card p{color:var(--sub);margin-bottom:6px}
.fld{position:relative;display:block}
.fld .i{position:absolute;left:13px;top:50%;margin-top:-12px;width:24px;height:24px;filter:drop-shadow(0 1px 1px rgba(20,40,90,.3));pointer-events:none}
.fld input{width:100%;border:2px solid transparent;background:var(--bg2);border-radius:14px;padding:13px 14px 13px 48px;outline:none;transition:border-color .25s,background .25s,box-shadow .25s}
.fld input:focus{border-color:var(--pr);background:var(--bg);box-shadow:0 0 0 4px rgba(47,127,240,.15)}
.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.fold>div{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:10px;padding:4px;margin:-4px}
.fold.off{grid-template-rows:0fr;opacity:0;margin-bottom:-10px;pointer-events:none}
.btn{background:linear-gradient(180deg,#5db4ff,#2f7ff0);color:#fff;border-radius:14px;padding:13px;font-weight:600;box-shadow:0 6px 16px rgba(47,127,240,.4),inset 0 1px 0 rgba(255,255,255,.4)}
.btn:hover{filter:brightness(1.07)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:10px;font-weight:600;box-shadow:var(--sh)}
.lnk{color:var(--pr);padding:6px;font-weight:500}
#or{color:var(--sub);font-size:13px}
#err{color:#e5384a;font-size:13px;min-height:18px}
#app{position:relative;display:flex;height:100%}
#app:not([hidden]){animation:fade .5s var(--ease)}
#side{width:350px;flex:none;display:flex;flex-direction:column;background:var(--bg);border-right:1px solid var(--ln);z-index:1}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg2)}
.h{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;min-height:64px;background:var(--bg);box-shadow:0 1px 0 var(--ln),0 4px 14px rgba(20,40,90,.05);z-index:2}
#side .h{background:linear-gradient(135deg,#3b8cf5,#5a56e0);color:#fff;box-shadow:0 6px 18px rgba(47,90,220,.3)}
.h h2{flex:1;font-size:20px;letter-spacing:-.2px}
.h .av{width:40px;height:40px;font-size:17px}
.srch{margin:10px 12px}
.srch input{border-radius:22px;padding:11px 14px 11px 48px}
#list{flex:1;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.lb{padding:28px 18px;color:var(--sub);font-size:13px;text-align:center}
.lb .i.big{margin-bottom:8px;animation:bob 4s ease-in-out infinite}
.row{display:flex;gap:12px;padding:10px 14px;align-items:center;cursor:pointer;transition:background .2s,transform .18s var(--ease)}
.row:hover{background:var(--bg2)}
.row:active{transform:scale(.98)}
.av{width:52px;height:52px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:21px;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.3);box-shadow:inset 0 2px 3px rgba(255,255,255,.5),inset 0 -4px 6px rgba(0,0,0,.18),0 3px 8px rgba(20,40,90,.25)}
.mid{flex:1;min-width:0}
.mid b,.mid small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
small{color:var(--sub);font-size:13px}
.rt{text-align:right;font-size:12px;color:var(--sub)}
.bd{background:linear-gradient(180deg,#5db4ff,#2f7ff0);color:#fff;border-radius:11px;padding:1px 7px;min-width:22px;display:inline-block;margin-top:4px;font-weight:600;box-shadow:0 2px 5px rgba(47,127,240,.4);animation:pop .3s var(--ease)}
#ph{flex:1;display:grid;place-content:center;justify-items:center;gap:6px;color:var(--sub);text-align:center}
#ph b{color:var(--tx);font-size:18px}
#cv{flex:1;display:flex;flex-direction:column;min-height:0}
#cv.in{animation:fade .35s var(--ease)}
.ic{display:grid;place-items:center;padding:6px;border-radius:50%}
#bk{display:none}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:5px;background:radial-gradient(rgba(47,127,240,.12) 1.3px,transparent 1.5px) 0 0/24px 24px,var(--bg2)}
.m{max-width:80%;padding:7px 11px 5px;border-radius:18px;white-space:pre-wrap;word-break:break-word;box-shadow:var(--sh)}
.m i{font-size:11px;opacity:.6;float:right;margin:8px 0 0 10px;font-style:normal}
.me{align-self:flex-end;background:linear-gradient(135deg,#4eaaff,#2f7ff0);color:#fff;border-bottom-right-radius:5px}
.ot{align-self:flex-start;background:var(--ot);border-bottom-left-radius:5px}
.new.me{animation:inR .35s var(--ease)}
.new.ot{animation:inL .35s var(--ease)}
.cp{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);align-items:center;box-shadow:0 -4px 14px rgba(20,40,90,.05)}
.cp input{flex:1;border:2px solid transparent;background:var(--bg2);border-radius:22px;padding:11px 16px;outline:none;transition:border-color .25s,background .25s}
.cp input:focus{border-color:var(--pr);background:var(--bg)}
#sd .i{width:40px;height:40px}
.cp input:placeholder-shown+#sd{opacity:.4;transform:scale(.85)}
#pgs{flex:1;position:relative;overflow:hidden}
.pg{position:absolute;inset:0;overflow-y:auto;background:var(--bg);opacity:0;transform:translateY(10px);pointer-events:none;visibility:hidden;transition:opacity .3s,transform .4s var(--ease),visibility 0s .4s}
.pg.on{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition-delay:0s}
#pg2,#pg3{background:var(--bg2)}
.arow{display:flex;gap:4px;align-items:center;margin:10px 12px}
.arow .fld{flex:1}
#ca .i{width:40px;height:40px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);position:relative;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--bg);box-shadow:0 -6px 20px rgba(20,40,90,.08);z-index:3}
.tabs::before{content:"";position:absolute;top:6px;bottom:calc(6px + env(safe-area-inset-bottom,0px));width:calc((100% - 16px)/4);left:calc(8px + var(--t) * (100% - 16px) / 4);border-radius:16px;background:rgba(47,127,240,.13);transition:left .45s var(--ease)}
.tabs button{position:relative;display:grid;justify-items:center;gap:1px;padding:6px 0;font-size:11px;color:var(--sub);font-weight:500;transition:color .3s,transform .18s var(--ease)}
.tabs .i{width:28px;height:28px;transition:transform .45s var(--ease)}
.tabs .on{color:var(--pr);font-weight:600}
.tabs .on .i{transform:translateY(-2px) scale(1.15)}
#ub{position:absolute;top:0;left:calc(50% + 6px);margin:0;font-style:normal;font-size:11px}
.pf{display:grid;justify-items:center;gap:3px;padding:26px 16px 22px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#3b8cf5,#5a56e0);border-radius:0 0 28px 28px;box-shadow:0 8px 22px rgba(47,90,220,.3)}
.pf .av{width:92px;height:92px;font-size:38px;border:3px solid rgba(255,255,255,.75);margin-bottom:6px}
.pf b{font-size:20px}
.pf small{color:rgba(255,255,255,.85)}
.grp{margin:0 12px 14px;background:var(--bg);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.sr{display:flex;align-items:center;gap:12px;padding:12px 14px}
.sr+.sr{border-top:1px solid var(--ln)}
.sr .fld,.sr .seg{flex:1}
.w{width:calc(100% - 24px);margin:0 12px}
.lo{width:100%;text-align:left;color:#e5384a;font-weight:600}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px}
.seg button{flex:1;padding:7px 4px;border-radius:10px;font-size:13px;color:var(--sub);transition:background .3s,color .3s,box-shadow .3s}
.seg .on{background:var(--bg);box-shadow:var(--sh);color:var(--pr);font-weight:600}
.sw{position:relative;width:50px;height:30px;border-radius:15px;background:var(--bg2);flex:none;transition:background .3s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .35s var(--ease)}
.sw.on{background:var(--pr)}
.sw.on::after{transform:translateX(20px)}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:rgba(20,30,45,.92);color:#fff;padding:10px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .3s,transform .4s var(--ease);z-index:9;max-width:80%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#splash{position:fixed;inset:0;z-index:20;display:grid;place-content:center;justify-items:center;gap:14px;color:#fff;background:radial-gradient(circle at 15% 12%,#6cc3ff 0,transparent 45%),radial-gradient(circle at 88% 92%,#a07bff 0,transparent 50%),linear-gradient(160deg,#2f7ff0,#3f4fd8);transition:opacity .6s var(--ease),transform .6s var(--ease),visibility 0s .6s}
#splash.off{opacity:0;visibility:hidden;transform:scale(1.06);pointer-events:none}
#splash b{font-size:26px;letter-spacing:-.3px}
.ldr{position:relative;width:150px;height:150px;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin 1s linear infinite}
.ldr .i{width:92px;height:92px;filter:drop-shadow(0 10px 10px rgba(10,20,80,.4));animation:bob 2.4s ease-in-out infinite}
.dts circle{transform-box:fill-box;transform-origin:center;animation:dot 1.2s ease-in-out infinite}
.dts circle:nth-child(2){animation-delay:.15s}
.dts circle:nth-child(3){animation-delay:.3s}
.dots{display:flex;gap:7px}
.dots i{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
.ld{pointer-events:none;position:relative}
.ld>*{opacity:0}
.ld::after{content:"";position:absolute;inset:0;margin:auto;width:22px;height:22px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.gbtn.ld::after{border-color:rgba(47,127,240,.25);border-top-color:var(--pr)}
.btn.ld{color:transparent}
.sk{display:flex;gap:12px;padding:10px 14px;align-items:center}
.sk div{flex:1;display:grid;gap:8px}
.sk u{display:block;height:12px;border-radius:6px;width:70%}
.sk u+u{width:45%}
.sk .av,.sk u,.sb{background:linear-gradient(90deg,var(--bg2) 25%,rgba(127,145,170,.25) 50%,var(--bg2) 75%) 0 0/200% 100%;animation:shim 1.3s linear infinite;box-shadow:none}
.sb{height:38px;width:55%;border-radius:18px}
.sb.l{align-self:flex-start}
.sb.r{align-self:flex-end;width:45%}
.sb.s{width:30%}
.card>*{animation:slide .6s var(--ease) both}
.card>:nth-child(n+2){animation-delay:.12s}
.card>:nth-child(n+5){animation-delay:.22s}
.card>:nth-child(n+7){animation-delay:.32s}
#cav .av,#pv .av{animation:pop .5s var(--ease)}
.tabs .on .i{animation:tap .6s var(--ease)}
.tabs button:active .i{transform:scale(.85)}
#sd.fly .i{animation:fly .5s var(--ease)}
@media(hover:hover){.ic:hover .i{transform:translateY(-2px) rotate(-6deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes slide{from{opacity:0;transform:translateX(-16px)}}
@keyframes dot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-3px)}}
@keyframes pulse{0%,80%,100%{opacity:.35;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
@keyframes tap{0%{transform:scale(.75)}45%{transform:translateY(-7px) scale(1.28) rotate(-6deg)}100%{transform:translateY(-2px) scale(1.15)}}
@keyframes fly{40%{transform:translate(10px,-10px) rotate(-14deg) scale(1.15)}60%{opacity:0}61%{transform:translate(-10px,10px)}100%{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:scale(.5)}}
@keyframes inR{from{opacity:0;transform:translateX(24px) scale(.9)}}
@keyframes inL{from{opacity:0;transform:translateX(-24px) scale(.9)}}
@media(max-width:700px){#side,#main{position:absolute;inset:0;width:100%;transition:transform .42s var(--ease)}#main{transform:translateX(100%)}#app.chat #main{transform:none}#app.chat #side{transform:translateX(-28%)}#bk{display:grid}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

      </section>

        <div class="pf"><div id="pv"></div><b id="pnn"></b><small id="pun"></small><small id="pem"></small></div>

          <div class="sr"><label class="fld"><svg class="i"><use href="#i-user"/></svg><input id="pnm" placeholder="Nama" maxlength="30"></label></div>

          <div class="sr"><svg class="i"><use href="#i-bell"/></svg><span class="mid"><b>Suara pesan</b><small>Bunyi saat ada pesan baru</small></span><button id="sn" class="sw" aria-label="Suara pesan"></button></div>
          <div class="sr"><svg class="i"><use href="#i-at"/></svg><span class="mid"><b>Status online</b><small>Tampilkan ke teman</small></span><button id="sh" class="sw" aria-label="Status online"></button></div>
        </div>
        <div class="grp"><div class="sr"><svg class="i"><use href="#i-info"/></svg><span class="mid"><b>Tentang HaloKita</b><small>Versi 1.0, dibuat dengan Firebase</small></span></div></div>

      <div class="h">
        <button id="bk" class="ic" aria-label="Kembali"><svg class="i"><use href="#i-back"/></svg></button>

      </div>

        <input id="mi" placeholder="Tulis pesan" autocomplete="off">

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,GoogleAuthProvider,signInWithPopup,signInWithRedirect,signInWithCredential} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,get,update,push,onValue,query,limitToLast,serverTimestamp,onDisconnect,increment,remove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBEPzUM9EresZ-yvphzDusVs7AUqdLuCNQ",
  authDomain: "mygame-68b24.firebaseapp.com",
  databaseURL: "https://mygame-68b24-default-rtdb.firebaseio.com",
  projectId: "mygame-68b24",
  storageBucket: "mygame-68b24.firebasestorage.app",
  messagingSenderId: "1003182873390",
  appId: "1:1003182873390:web:aabf3248f759cbc9d678bf"
};
const fb = initializeApp(firebaseConfig), auth = getAuth(fb), db = getDatabase(fb);
const $ = s => document.querySelector(s);
let me, cur, chats = {}, unM, unS, mode = 'login', reg = false;

const cid = (a, b) => [a, b].sort().join('_');
const col = s => { const h = Math.abs([...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 7)) % 360; return `linear-gradient(145deg,hsl(${h} 75% 66%),hsl(${h} 65% 44%))`; };
const tm = t => t ? new Date(t).toLocaleTimeString('id-ID', {hour: '2-digit', minute: '2-digit'}) : '';
const norm = s => s.trim().toLowerCase().replace(/^@/, '');
function av(name, uid) {
  const d = document.createElement('div');
  d.className = 'av'; d.textContent = (name || '?')[0].toUpperCase(); d.style.background = col(uid);
  return d;
}
function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt;
  return e;
}

/* ---------- Auth ---------- */
$('#tg').onclick = () => {
  if (mode == 'setup') { signOut(auth).then(() => location.reload()); return; }
  mode = mode == 'login' ? 'reg' : 'login';
  $('#rg').classList.toggle('off', mode == 'login');
  $('#go').textContent = mode == 'login' ? 'Masuk' : 'Daftar';
  $('#tg').textContent = mode == 'login' ? 'Belum punya akun? Daftar' : 'Sudah punya akun? Masuk';
  $('#err').textContent = '';
};
const pesan = x => ({
  'auth/invalid-credential': 'Email atau kata sandi salah',
  'auth/email-already-in-use': 'Email sudah terdaftar',
  'auth/weak-password': 'Kata sandi minimal 6 karakter',
  'auth/invalid-email': 'Format email tidak valid',
  'auth/operation-not-allowed': 'Metode login ini belum diaktifkan di Firebase',
  'auth/unauthorized-domain': 'Domain belum diizinkan di Firebase (Authentication → Settings → Authorized domains)',
  'auth/network-request-failed': 'Tidak ada koneksi internet'
}[x.code] || x.message || 'Terjadi kesalahan');

const ggRun = async () => {
  $('#err').textContent = '';
  const pv = new GoogleAuthProvider();
  try {
    const nat = window.Capacitor?.Plugins?.FirebaseAuthentication;
    if (window.Capacitor?.isNativePlatform?.() && nat) {
      const r = await nat.signInWithGoogle({skipNativeAuth: true});
      await signInWithCredential(auth, GoogleAuthProvider.credential(r.credential.idToken));
    } else await signInWithPopup(auth, pv);
  } catch (x) {
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(x.code)) signInWithRedirect(auth, pv);
    else if (!['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(x.code)) $('#err').textContent = pesan(x);
  }
};

$('#gg').onclick = async () => { const b = $('#gg'); b.classList.add('ld'); try { await ggRun(); } finally { b.classList.remove('ld'); } };

// Pengguna baru (Google atau email tanpa profil): pilih nama & username dulu
function setup() {
  const u = auth.currentUser;
  mode = 'setup';
  $('.card p').textContent = 'Pilih username untuk mulai';
  $('#cr').classList.add('off'); $('#gg').hidden = $('#or').hidden = true;
  $('#rg').classList.remove('off');
  $('#go').textContent = 'Lanjutkan';
  $('#tg').textContent = 'Batal';
  $('#nm').value = u.displayName || '';
  $('#un').value = (u.email || '').split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 20);
  $('#err').textContent = '';
  $('#auth').hidden = false; $('#app').hidden = true;
}

const goRun = async () => {
  const e = $('#em').value.trim(), p = $('#pw').value, u = norm($('#un').value), n = $('#nm').value.trim();
  $('#err').textContent = '';
  try {
    if (mode == 'setup') {
      if (!/^[a-z0-9_]{4,20}$/.test(u)) throw {message: 'Username 4–20 karakter: huruf, angka, atau _'};
      if ((await get(ref(db, 'usernames/' + u))).exists()) throw {message: 'Username sudah dipakai, pilih yang lain'};
      const uid = auth.currentUser.uid;
      await update(ref(db), {['usernames/' + u]: uid, ['users/' + uid]: {name: n || u, username: u, online: true}});
      start(uid); return;
    }
    if (mode == 'login') { await signInWithEmailAndPassword(auth, e, p); return; }
    if (!/^[a-z0-9_]{4,20}$/.test(u)) throw {message: 'Username 4–20 karakter: huruf, angka, atau _'};
    reg = true;
    const cr = await createUserWithEmailAndPassword(auth, e, p);
    if ((await get(ref(db, 'usernames/' + u))).exists()) {
      await cr.user.delete();
      throw {message: 'Username sudah dipakai, pilih yang lain'};
    }
    const uid = cr.user.uid;
    await update(ref(db), {['usernames/' + u]: uid, ['users/' + uid]: {name: n || u, username: u, online: true}});
    reg = false; start(uid);
  } catch (x) { reg = false; $('#err').textContent = pesan(x); }
};
$('#go').onclick = async () => { const b = $('#go'); b.classList.add('ld'); try { await goRun(); } finally { b.classList.remove('ld'); } };
function hideSplash() { const e = $('#splash'); e.classList.add('off'); setTimeout(() => e.hidden = true, 800); }
setTimeout(hideSplash, 7000);
onAuthStateChanged(auth, u => { if (!reg && u) start(u.uid).finally(hideSplash); else hideSplash(); });

$('#out').onclick = async () => {
  await update(ref(db, 'users/' + me.uid), {online: false, lastSeen: serverTimestamp()});
  await signOut(auth); location.reload();
};

/* ---------- Mulai ---------- */
async function start(uid) {
  const s = await get(ref(db, 'users/' + uid));
  if (!s.exists()) { setup(); return; }
  me = {uid, ...s.val()};
  $('#auth').hidden = true; $('#app').hidden = false;
  $('#meav').replaceChildren(av(me.name, uid));
  onValue(ref(db, '.info/connected'), c => {
    if (!c.val()) return;
    const r = ref(db, 'users/' + uid);
    onDisconnect(r).update({online: false, lastSeen: serverTimestamp()}).then(() => update(r, {online: !S.hide}));
  });
  onValue(ref(db, 'userChats/' + uid), s => {
    const nw = s.val() || {};
    if (sum(nw) > sum(chats) && S.snd !== false) beep();
    chats = nw; list(); clr();
  });
  onValue(ref(db, 'contacts/' + uid), s => { kon = s.val() || {}; klist(); });
  $('#list').innerHTML = SK; fillProf(); ui();
}

/* ---------- Daftar obrolan & pencarian ---------- */
function row(u, sub, ts, unread) {
  const r = el('div', 'row');
  const mid = el('div', 'mid'); mid.append(el('b', '', u.name), el('small', '', sub || ''));
  const rt = el('div', 'rt', tm(ts));
  if (unread) rt.append(document.createElement('br'), el('span', 'bd', unread));
  r.append(av(u.name, u.uid), mid, rt);
  r.onclick = () => open({uid: u.uid, name: u.name, username: u.username});
  return r;
}
function list(res) {
  const q = norm($('#q').value), box = $('#list');
  const un = sum(chats); $('#ub').textContent = un; $('#ub').hidden = !un;
  box.replaceChildren();
  if (res) box.append(el('div', 'lb', 'Hasil pencarian'), row(res, '@' + res.username));
  Object.values(chats)
    .filter(c => c.with && (!q || (c.name + c.username).toLowerCase().includes(q)))
    .sort((a, b) => (b.ts || 0) - (a.ts || 0))
    .forEach(c => box.append(row({uid: c.with, name: c.name, username: c.username}, c.last, c.ts, c.unread)));
  if (!box.children.length) { const e = el('div', 'lb'); e.innerHTML = '<svg class="i big"><use href="#i-chat"/></svg><br>Belum ada obrolan.<br>Cari @username teman di atas.'; box.append(e); }
  else if (!list.d && !res) { list.d = 1; stag(box); }
}
let tmr;
$('#q').oninput = () => {
  clearTimeout(tmr);
  tmr = setTimeout(async () => {
    const q = norm($('#q').value); let res;
    if (q.length >= 4 && q != me.username) {
      try {
        const s = await get(ref(db, 'usernames/' + q));
        if (s.exists()) { const u = await get(ref(db, 'users/' + s.val())); res = {uid: s.val(), ...u.val()}; }
      } catch {}
    }
    list(res);
  }, 300);
};

/* ---------- Menu utama, kontak, profil, pengaturan ---------- */
let S = {}, kon = {};
const SK = '<div class="sk"><i class="av"></i><div><u></u><u></u></div></div>'.repeat(6);
const stag = b => [...b.children].forEach((r, k) => r.style.animation = `slide .45s var(--ease) ${Math.min(k, 8) * 45}ms both`);
try { S = JSON.parse(localStorage.getItem('hk') || '{}'); } catch {}
const saveS = () => { try { localStorage.setItem('hk', JSON.stringify(S)); } catch {} };
const sum = o => Object.values(o).reduce((a, c) => a + (c.unread || 0), 0);
const NAMA = ['Chat', 'Kontak', 'Profil', 'Pengaturan'];
let tt;
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), 2200); }
function beep() {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880;
    g.gain.setValueAtTime(.15, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .25);
    o.start(); o.stop(c.currentTime + .25);
  } catch {}
}
function go(i) {
  document.querySelectorAll('.pg').forEach((p, k) => p.classList.toggle('on', k == i));
  document.querySelectorAll('.tabs button').forEach((b, k) => b.classList.toggle('on', k == i));
  $('.tabs').style.setProperty('--t', i); $('#side .h h2').textContent = NAMA[i];
}
document.querySelectorAll('.tabs button').forEach((b, k) => b.onclick = () => go(k));
$('#meav').onclick = () => go(2);
function ui() {
  document.documentElement.dataset.theme = S.theme || 'auto';
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.t == (S.theme || 'auto')));
  $('#sn').classList.toggle('on', S.snd !== false); $('#sh').classList.toggle('on', !S.hide);
}
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => { S.theme = b.dataset.t; saveS(); ui(); });
$('#sn').onclick = () => { S.snd = S.snd === false; saveS(); ui(); };
$('#sh').onclick = () => { S.hide = !S.hide; saveS(); ui(); update(ref(db, 'users/' + me.uid), {online: !S.hide}); };
ui();

function fillProf() {
  $('#pv').replaceChildren(av(me.name, me.uid)); $('#pnn').textContent = me.name;
  $('#pun').textContent = '@' + me.username; $('#pem').textContent = auth.currentUser?.email || '';
  $('#pnm').value = me.name; $('#bio').value = me.bio || '';
  $('#meav').replaceChildren(av(me.name, me.uid));
}
$('#sv').onclick = async () => {
  const n = $('#pnm').value.trim() || me.username, b = $('#bio').value.trim().slice(0, 120);
  try { await update(ref(db, 'users/' + me.uid), {name: n, bio: b}); me.name = n; me.bio = b; fillProf(); toast('Profil disimpan'); }
  catch { toast('Gagal menyimpan profil'); }
};

function klist() {
  const b = $('#clist'); b.replaceChildren();
  const a = Object.entries(kon).sort((x, y) => x[1].name.localeCompare(y[1].name));
  a.forEach(([id, c]) => {
    const r = row({uid: id, name: c.name, username: c.username}, '@' + c.username);
    const x = el('button', 'ic'); x.title = 'Hapus kontak'; x.innerHTML = '<svg class="i"><use href="#i-x"/></svg>';
    x.onclick = e => { e.stopPropagation(); remove(ref(db, `contacts/${me.uid}/${id}`)); toast('Kontak dihapus'); };
    r.append(x); b.append(r);
  });
  if (!a.length) { const e = el('div', 'lb'); e.innerHTML = '<svg class="i big"><use href="#i-kon"/></svg><br>Belum ada kontak.<br>Tambahkan teman lewat @username.'; b.append(e); }
  else if (!klist.d) { klist.d = 1; stag(b); }
}
async function tambah() {
  const q = norm($('#ci').value);
  if (q.length < 4) return toast('Masukkan username teman');
  try {
    const s = await get(ref(db, 'usernames/' + q));
    if (!s.exists()) return toast('Username tidak ditemukan');
    if (s.val() == me.uid) return toast('Itu akun kamu sendiri');
    const u = (await get(ref(db, 'users/' + s.val()))).val();
    await update(ref(db, `contacts/${me.uid}/${s.val()}`), {name: u.name, username: u.username});
    $('#ci').value = ''; toast('Kontak ditambahkan');
  } catch { toast('Gagal menambah kontak'); }
}
$('#ca').onclick = tambah;
$('#ci').onkeydown = e => { if (e.key == 'Enter') tambah(); };

/* ---------- Obrolan ---------- */
function clr() {
  if (!cur) return;
  const k = cid(me.uid, cur.uid);
  if (chats[k]?.unread) update(ref(db, `userChats/${me.uid}/${k}`), {unread: 0});
}
function open(u) {
  unM && unM(); unS && unS();
  cur = u;
  $('#app').classList.add('chat'); $('#ph').hidden = true; $('#cv').hidden = false;
  $('#cv').classList.remove('in'); void $('#cv').offsetWidth; $('#cv').classList.add('in');
  $('#cn').textContent = u.name; $('#cav').replaceChildren(av(u.name, u.uid)); $('#msgs').innerHTML = '<div class="sb l"></div><div class="sb r"></div><div class="sb l s"></div>';
  unS = onValue(ref(db, 'users/' + u.uid), s => {
    const v = s.val() || {};
    $('#cs').textContent = v.online ? 'online' : v.lastSeen ? 'terakhir dilihat ' + tm(v.lastSeen) : '@' + u.username;
  });
  const seen = new Set(); let first = true;
  unM = onValue(query(ref(db, `chats/${cid(me.uid, u.uid)}/messages`), limitToLast(150)), s => {
    const b = $('#msgs'); if (first) b.replaceChildren();
    s.forEach(m => {
      if (seen.has(m.key)) return; seen.add(m.key);
      const v = m.val(), d = el('div', 'm ' + (v.from == me.uid ? 'me' : 'ot') + (first ? '' : ' new'));
      d.append(v.text, el('i', '', tm(v.ts))); b.append(d);
    });
    b.scrollTo({top: b.scrollHeight, behavior: first ? 'auto' : 'smooth'}); first = false; clr();
  });
}
$('#bk').onclick = () => {
  unM && unM(); unS && unS(); cur = null;
  $('#app').classList.remove('chat');
};
async function kirim() {
  const t = $('#mi').value.trim();
  if (!t || !cur) return;
  $('#mi').value = '';
  $('#sd').classList.remove('fly'); void $('#sd').offsetWidth; $('#sd').classList.add('fly');
  const id = cid(me.uid, cur.uid), k = push(ref(db, `chats/${id}/messages`)).key, ts = serverTimestamp();
  const a = `userChats/${me.uid}/${id}/`, b = `userChats/${cur.uid}/${id}/`;
  await update(ref(db), {
    [`chats/${id}/messages/${k}`]: {from: me.uid, text: t, ts},
    [a + 'with']: cur.uid, [a + 'name']: cur.name, [a + 'username']: cur.username, [a + 'last']: t, [a + 'ts']: ts, [a + 'unread']: 0,
    [b + 'with']: me.uid, [b + 'name']: me.name, [b + 'username']: me.username, [b + 'last']: t, [b + 'ts']: ts, [b + 'unread']: increment(1)
  });
}
$('#sd').onclick = kirim;
$('#mi').onkeydown = e => { if (e.key == 'Enter') kirim(); };
</script>
<div id="toast"></div>
</body>
