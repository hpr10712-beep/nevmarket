<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cazo Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=Unbounded:wght@400..900&display=swap">
<style>
:root{--bg:#F3F8F7;--surface:#FFF;--surface-2:#E6F1EF;--fg:#0C2A2E;--muted:#496569;--line:#D3E3E0;--brand:#087F62;--gold:#FFC72C;--gold-deep:#C98200;--tint-gold:#FFF1C2;--balance-bg:#0C2A2E;--pos:#087F62;--bad:#B3261E;--bezel:#0C2A2E;--fd:'Unbounded','Arial Rounded MT Bold',system-ui,sans-serif;--fb:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#081C1F;--surface:#0F2A2E;--surface-2:#143338;--fg:#E8F5F2;--muted:#9FBFBA;--line:#1F4448;--brand:#3DDBAA;--tint-gold:#3A3010;--balance-bg:#0E4A44;--pos:#3DDBAA;--bad:#FF8F85;--bezel:#02100F;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:400 1rem/1.6 var(--fb);-webkit-font-smoothing:antialiased}
h1,h3,p,ul{margin:0}ul{padding:0;list-style:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:8px}
.ic{display:block;width:var(--s,64px);height:var(--s,64px);flex:none;overflow:visible}
.screen{position:relative;max-width:440px;height:100%;height:100dvh;margin:auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);isolation:isolate}
@media(min-width:600px){body{display:grid;place-items:center;height:100dvh}.screen{width:390px;height:min(calc(100dvh - 40px),780px);border:10px solid var(--bezel);border-radius:48px;box-shadow:0 36px 60px -28px rgba(12,42,46,.55)}}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.scroll>*{flex:none}
.app-top{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:50%;border:0;background:var(--tint-gold);display:grid;place-items:center;font:700 1rem/1 var(--fd);flex:none;cursor:pointer}
.hi{flex:1;min-width:0}.hi small{display:block;color:var(--muted);font-size:.75rem}.hi b{font-size:.98rem}
.bellbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}.bellbtn .ic{--s:30px}
.bal{position:relative;overflow:hidden;border-radius:24px;padding:18px;background:var(--balance-bg);color:#fff}
.bal .rg,.hero .rg{position:absolute;right:-34px;top:-34px;width:170px;height:170px;fill:none;stroke:rgba(255,255,255,.16);stroke-width:1}
.bal small{display:block;color:#BFE3DB;font-size:.78rem;font-weight:600}
.bal .amt{position:relative;font:650 1.75rem/1.2 var(--fd);letter-spacing:-.03em;margin:6px 0 12px;font-variant-numeric:tabular-nums}
.bal .tag{position:relative;display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.16);font-size:.7rem;font-weight:700;letter-spacing:.04em}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px;padding:10px 2px 8px;border-radius:18px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.72rem}
.acts .act{border:0;background:linear-gradient(160deg,var(--t1),var(--t2));box-shadow:0 8px 16px -10px var(--t3),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .15s}
.acts .act:hover{filter:brightness(.97)}.acts .act:active{transform:scale(.95)}
.acts .act:nth-child(1){--t1:#E3F4FF;--t2:#C3E3F9;--t3:#1B78D4}
.acts .act:nth-child(2){--t1:#DDF8EE;--t2:#B6EDD9;--t3:#0A8467}
.acts .act:nth-child(3){--t1:#FFF3CC;--t2:#FFE394;--t3:#C98200}
.acts .act:nth-child(4){--t1:#FFE7ED;--t2:#FFCBD8;--t3:#C93A62}
@media(prefers-color-scheme:dark){.acts .act:nth-child(1){--t1:#16405A;--t2:#0F2E44}.acts .act:nth-child(2){--t1:#11524A;--t2:#0B3A36}.acts .act:nth-child(3){--t1:#4A3D12;--t2:#2E2608}.acts .act:nth-child(4){--t1:#55243A;--t2:#3A1824}.acts .act{box-shadow:0 8px 16px -10px var(--t3),inset 0 1px 0 rgba(255,255,255,.12)}}.act .ic{--s:40px}
.goal{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;background:var(--surface)}.goal .ic{--s:50px}
.goal{width:100%;border:0;text-align:left;cursor:pointer;transition:transform .15s}.goal:active{transform:scale(.98)}
.gl{display:flex;flex-direction:column;gap:8px}
.edt{flex:none;padding:6px 12px;border-radius:999px;background:var(--surface-2);color:var(--brand);font-size:.75rem;font-weight:700}
.gt{flex:1;min-width:0}.gt b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--gold);transition:width .5s ease}
.gt small{color:var(--muted);font-size:.74rem;font-variant-numeric:tabular-nums}
.tx-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:.9rem;min-height:36px}
.lnk{background:none;border:0;color:var(--brand);font-weight:700;font-size:.78rem;cursor:pointer;padding:8px 0}
.tx li{border-bottom:1px solid var(--line)}
.tx li:last-child{border-bottom:0}.tx .ic{--s:42px}
.tt{flex:1;min-width:0}.tt b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tt small{color:var(--muted);font-size:.74rem}
.am{font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap}.am.in{color:var(--pos)}
.hint{color:var(--muted);font-size:.85rem;text-align:center}
/* loading */
.load{margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.coinw{position:relative;display:grid;place-items:center;width:150px;height:150px}
.coinw::before,.coinw::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--brand);opacity:0;animation:ping 2.2s ease-out infinite}
.coinw::after{animation-delay:1.1s}
.coinw .ic{--s:92px;animation:bob 1.8s ease-in-out infinite}
.dots{display:flex;gap:7px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--gold);animation:dot 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes ping{from{transform:scale(.5);opacity:.5}to{transform:scale(1.1);opacity:0}}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.45}40%{transform:scale(1);opacity:1}}
/* masuk / daftar */
.auth{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.brandrow{display:flex;align-items:center;gap:10px;font:700 1.3rem/1 var(--fd);letter-spacing:-.03em}.brandrow .ic{--s:42px}.brandrow i{font-style:normal;font-weight:400;color:var(--muted)}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px;min-height:200px;background:linear-gradient(150deg,#0F6354,var(--balance-bg) 72%);color:#fff}
.hero .brandrow{position:relative;font-size:1.05rem}.hero .brandrow .ic{--s:34px}.hero .brandrow i{color:#BFE3DB}
.hero h1{position:relative;font:650 1.2rem/1.25 var(--fd);letter-spacing:-.03em;margin-top:22px;max-width:64%}
.hero p{position:relative;color:#BFE3DB;font-size:.8rem;margin-top:8px;max-width:62%}
.hero .pig{--s:112px;position:absolute;right:4px;bottom:4px;animation:bob 3.2s ease-in-out infinite}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:var(--surface-2)}
.seg button{min-height:44px;border:0;border-radius:999px;background:none;font-weight:700;cursor:pointer;color:var(--muted);transition:background .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 2px 8px -2px rgba(12,42,46,.25)}
.perks{display:flex;flex-wrap:wrap;gap:6px}.perks span{padding:5px 10px;border-radius:999px;background:var(--tint-gold);font-size:.72rem;font-weight:700}
.auth .fld,.auth .msg{margin:0}.auth .btn{margin-top:0}.auth .sum{margin:0}
.pw{position:relative}.pw input{padding-right:52px}
.eye{position:absolute;right:2px;top:2px;width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.eye[aria-pressed="true"]{color:var(--brand)}
.sheet{position:absolute;inset:0;display:flex;align-items:flex-end;background:rgba(4,22,20,.55);z-index:5}
.panel{position:relative;width:100%;max-height:94%;overflow-y:auto;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;background:var(--surface);animation:rise .28s ease-out}
.panel h3{font:650 1.1rem/1.25 var(--fd);letter-spacing:-.02em;min-height:44px;display:flex;align-items:center;padding-right:58px}
.panel .bar{height:10px;margin:14px 0 8px}
.x{position:absolute;right:14px;top:20px;width:44px;height:44px;padding:0;border-radius:50%;border:0;background:var(--surface-2);color:var(--fg);cursor:pointer;display:grid;place-items:center}.x svg{width:18px;height:18px}
.fld{margin-top:16px}
.fld>b,.fld>label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:8px}
.fld input{width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.fld .opts{margin-top:0}
.opt{min-height:44px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;font-size:.88rem;display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--surface-2)}
.opt span{color:var(--muted);font-weight:600}
.msg{min-height:1.4em;margin:12px 0 10px;font-size:.85rem;font-weight:600;color:var(--bad)}
.hero-ic{display:grid;place-items:center;margin-top:10px}.hero-ic .ic{--s:88px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:8px;border-radius:999px;border:2px solid transparent;font-weight:700;cursor:pointer;text-decoration:none}
.btn-gold{background:var(--gold);color:#0C2A2E;box-shadow:0 4px 0 var(--gold-deep)}
.btn-gold:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep)}
.btn-line{background:transparent;border-color:var(--fg)}
.btn-line.red{color:var(--bad);border-color:var(--bad)}
.btn-bad{background:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.55}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.bgrid .btn{margin:0}
.ab{font-size:.88rem;margin-top:12px}
.fl{margin-top:4px}.fl li{position:relative;padding:9px 0 9px 22px;border-bottom:1px solid var(--line);font-size:.85rem}
.fl li::before{content:"";position:absolute;left:2px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--gold)}
.toast{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;padding:12px 14px;border-radius:14px;background:#0C2A2E;color:#fff;border:1px solid var(--line);font-weight:600;font-size:.85rem;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none}
.toast.on{opacity:1;transform:none}
@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.nav{display:grid;grid-template-columns:repeat(4,1fr);flex:none;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:62px;padding:4px 0;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer}
.nav .pill{display:grid;place-items:center;width:60px;height:38px;border-radius:999px;transition:background .2s}
.fi{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--fg);font-weight:700}
.nav button[aria-current="page"] .pill{background:var(--surface-2)}
.nav-on .scroll{padding-bottom:20px}.nav-on .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.pg{font:650 1.3rem/1.2 var(--fd);letter-spacing:-.03em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:var(--surface);border-radius:18px;padding:12px 14px}
.stats small{display:block;color:var(--muted);font-size:.74rem}
.stats b{font-size:.95rem;font-variant-numeric:tabular-nums}.stats .in{color:var(--pos)}.stats .out{color:var(--bad)}
.prof{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:6px 0 4px}
.prof b{font-size:1.05rem}.prof small{color:var(--muted);font-size:.8rem}
.av.big{width:76px;height:76px;font-size:1.8rem;margin-bottom:8px;cursor:default}
.list{background:var(--surface);border-radius:20px;padding:2px 14px}
.mi{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;font-weight:600;text-align:left;cursor:pointer;text-decoration:none}
a.mi{color:var(--fg)}
.mi:last-child{border-bottom:0}
.mi .ti{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.mi.red{color:var(--bad)}
.nav .ic,.mi .ic{--s:30px}.nav button:not([aria-current="page"]) .ic{opacity:.6;filter:saturate(.55)}
.opt .ic{--s:28px}.provs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.provs .opt{justify-content:flex-start;padding:0 10px}
.trow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;background:none;border:0;text-align:left;cursor:pointer}
.am.wait{color:var(--muted)}.am.no{color:var(--bad);text-decoration:line-through}
.sum{font-size:.8rem;color:var(--muted);margin-top:10px}.sum b{color:var(--fg)}
.qris{display:block;width:min(100%,240px);margin:14px auto 0;border-radius:16px;background:#fff;padding:8px}
.big{font:650 1.6rem/1.2 var(--fd);letter-spacing:-.03em;text-align:center;margin-top:10px}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.74rem;font-weight:700;background:var(--surface-2)}
.dl{margin:14px 0 0}.dl div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.88rem}.dl dt{color:var(--muted)}.dl dd{margin:0;font-weight:600;text-align:right;word-break:break-word}
.req{padding:12px 0;border-bottom:1px solid var(--line);font-size:.85rem}.req .btn{min-height:40px;margin:0;flex:1}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<linearGradient id="g-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7BF5D0"/><stop offset=".5" stop-color="#18C195"/><stop offset="1" stop-color="#0A8467"/></linearGradient>
<linearGradient id="g-teal-s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A7A62"/><stop offset="1" stop-color="#054A41"/></linearGradient>

<linearGradient id="g-gold-s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C98200"/><stop offset="1" stop-color="#8A5200"/></linearGradient>

<linearGradient id="g-white" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#E9F6F3"/><stop offset="1" stop-color="#C9E3DD"/></linearGradient>
<linearGradient id="g-white-s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A8CBC4"/><stop offset="1" stop-color="#7FA7A0"/></linearGradient>
<linearGradient id="g-pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD0DA"/><stop offset=".5" stop-color="#FF86A3"/><stop offset="1" stop-color="#E24A74"/></linearGradient>
<linearGradient id="g-pink-s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C93A62"/><stop offset="1" stop-color="#8A1F40"/></linearGradient>
<linearGradient id="g-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE3C8"/><stop offset=".6" stop-color="#FFC08F"/><stop offset="1" stop-color="#EE9A63"/></linearGradient>
<filter id="f-soft" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="3.5"/></filter>
</defs>

<path d="M77 46 A17 20 0 1 0 77 78" fill="none" stroke="#FFF6C8" stroke-width="3" stroke-linecap="round" opacity=".9"/>
<path d="M30 40 Q38 22 58 18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55"/>
</symbol>
<symbol id="i-plane" viewBox="0 0 128 128">

</symbol>
<symbol id="i-qr" viewBox="0 0 128 128">
<ellipse cx="64" cy="119" rx="38" ry="5.5" fill="#06231F" opacity=".28" filter="url(#f-soft)"/>
<rect x="24" y="27" width="80" height="80" rx="14" fill="url(#g-white-s)"/>

const amtOf = t => t.type == 'tf' ? t.total : t.amount;
const ico = t => t.type == 'tf' && PROV[t.provider] ? lg(t.provider) : sv(IC[t.type] || 'coin');
const title = t => t.type == 'topup' ? 'Isi saldo' : t.type == 'tf' ? 'Transfer ke ' + (PROV[t.provider]?.n || '') : t.type == 'in' ? 'Dari ' + t.peer : t.type == 'out' ? 'Kirim ke ' + t.peer : t.type == 'save' ? 'Tabungan ' + t.peer : t.type == 'wd' ? 'Tarik dari ' + t.peer : t.peer;
const row = t => {
  const p = plus(t.type), w = t.status == 'pending', x = t.status == 'rejected';
  return `<li><button class="trow" data-a="tx" data-id="${t.id}">${ico(t)}<div class="tt"><b>${esc(title(t))}</b><small>${fd(t.ts)}${w || x ? ' · ' + ST(t) : ''}${t.note ? ' · ' + esc(t.note) : ''}</small></div><span class="am${p && !w && !x ? ' in' : ''}${w ? ' wait' : ''}${x ? ' no' : ''}">${p ? '+' : '−'}${rp(amtOf(t))}</span></button></li>`;
};
const upd = () => { const e = $('#sum'); if (!e) return; const a = Math.floor(+$('#a').value) || 0; e.innerHTML = a >= 10000 ? `Biaya admin <b>${rp(fee(a))}</b> · Total dipotong <b>${rp(a + fee(a))}</b>` : 'Biaya admin dihitung dari nominal'; };
function request(rec) {
  const id = push(ref(db, 'requests')).key, r = { ...rec, status: 'pending', ts: serverTimestamp() };
  return update(ref(db), { ['requests/' + id]: { ...r, uid: me, uname: user.name }, ['transactions/' + me + '/' + id]: r });
}
const none = t => `<li class="hint" style="display:block;padding:24px 0">${t}</li>`;

// Tabungan (banyak tujuan): users/{hp}/goals/{id} = {name, target, saved, createdAt}
const gl = () => Object.entries(user.goals || {}).map(([id, v]) => ({ id, ...v })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
const gobj = () => gl().find(g => g.id == gid);
const gp = g => Math.min(100, Math.round((g.saved || 0) / g.target * 100) || 0);
const gcard = g => `<button class="goal" data-a="gdetail" data-id="${g.id}" aria-label="Tabungan ${esc(g.name)}">${sv('piggy')}<div class="gt"><b>${esc(g.name)}</b><div class="bar" role="progressbar" aria-label="Progres ${esc(g.name)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${gp(g)}"><i style="width:${gp(g)}%"></i></div><small>${rp(g.saved)} dari ${rp(g.target)}</small></div><span class="edt">${gp(g) >= 100 ? 'Tercapai' : gp(g) + '%'}</span></button>`;
const dupName = n => gl().some(g => g.id != gid && g.name.toLowerCase() == n.toLowerCase());

const histHTML = () => {
  const n = new Date(), mo = txs.filter(t => { const d = new Date(t.ts); return d.getMonth() == n.getMonth() && d.getFullYear() == n.getFullYear(); });
  const ok = t => !t.status || t.status == 'success' || (t.type == 'tf' && t.status == 'pending'), s = p => mo.filter(t => ok(t) && plus(t.type) == p).reduce((a, t) => a + amtOf(t), 0);
  const f = txs.filter(t => flt == 'all' || (flt == 'in') == plus(t.type));
  return `<h1 class="pg">Riwayat</h1>
    <div class="stats"><div><small>Masuk bulan ini</small><b class="in">+${rp(s(true))}</b></div><div><small>Keluar bulan ini</small><b class="out">−${rp(s(false))}</b></div></div>
    <div class="opts" style="margin:0">${[['all', 'Semua'], ['in', 'Masuk'], ['out', 'Keluar']].map(([v, l]) => `<button class="opt" data-a="flt" data-v="${v}" aria-pressed="${flt == v}">${l}</button>`).join('')}</div>
    <ul class="tx">${f.length ? f.map(row).join('') : none('Belum ada transaksi.')}</ul>`;
};
const savHTML = () => {
  const gs = gl(), tot = gs.reduce((a, g) => a + (g.saved || 0), 0);
  return `<h1 class="pg">Tabungan</h1>
    <div class="bal">${RG}<small>Total tabungan</small><div class="amt">${rp(tot)}</div><span class="tag">${gs.length} tujuan</span></div>
    <button class="btn btn-gold" style="margin:0" data-a="gadd">+ Tambah tabungan</button>
    <div class="gl">${gs.length ? gs.map(gcard).join('') : `<div class="hero-ic">${sv('piggy')}</div><p class="hint">Belum ada tabungan. Buat tujuan pertamamu, misalnya liburan atau dana darurat.</p>`}</div>`;
};
const profHTML = () => {
  const M = ([a, i, l, c = '']) => `<button class="mi ${c}" data-a="${a}"><span class="ti">${sv(i)}</span>${l}</button>`;
  return `<h1 class="pg">Profil</h1>
  <div class="prof"><span class="av big">${esc((user.name.trim()[0] || 'C').toUpperCase())}</span><b>${esc(user.name)}</b><small>${esc(me)}</small>${user.createdAt ? `<small>Anggota sejak ${new Date(user.createdAt).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' })}</small>` : ''}</div>
  <div class="list">${[...(ADMINS.includes(me) ? [['admin', 'qr', 'Panel admin' + (reqs.length ? ' (' + reqs.length + ')' : '')]] : []), ['copy', 'copy', 'Salin nomor HP'], ['chpin', 'lock', 'Ganti PIN']].map(M).join('')}</div>
  <div class="list"><a class="mi" href="${CS_URL}"><span class="ti">${sv('help')}</span>Bantuan / Customer service</a>${M(['about', 'info', 'Tentang Cazo Wallet'])}</div>
  <div class="list">${M(['logout', 'exit', 'Keluar', 'red'])}</div>`;
};

function start() {
  unsub.forEach(f => f()); unsub = []; user = null; txs = [];
  if (me) unsub = [
    onValue(ref(db, 'config/qris'), s => { qris = s.val() || QRIS_URL; }),
    ...(ADMINS.includes(me) ? [onValue(ref(db, 'requests'), s => { reqs = Object.entries(s.val() || {}).map(([id, v]) => ({ id, ...v })).filter(r => r.status == 'pending').sort((a, b) => a.ts - b.ts); if (adminOpen) acts.admin(); else render(); })] : []),
    onValue(ref(db, 'users/' + me), s => {
      user = s.val(); if (!user) return logout();
      // migrasi tabungan lama (satu tujuan) ke format baru (banyak tujuan)
      if (user.goal && !user.goals) {
        const id = push(ref(db, 'users/' + me + '/goals')).key;
        update(ref(db, 'users/' + me), { ['goals/' + id]: { name: user.goal.name, target: user.goal.target, saved: user.saved || 0, createdAt: Date.now() }, goal: null, saved: null });
      }
      render();
    }),
    onValue(ref(db, 'transactions/' + me), s => { txs = Object.entries(s.val() || {}).map(([id, v]) => ({ id, ...v })).sort((a, b) => b.ts - a.ts).slice(0, 60); render(); })
  ];
  render();
}
function logout() { LS.d('cazo_me'); me = null; tab = 'home'; mode = 'login'; av = { n: '', p: '' }; close(); start(); }

// ---------- Tampilan ----------
function render() {
  const m = $('#main');
  $('#nav').hidden = !me; $('.screen').classList.toggle('nav-on', !!me);
  $$('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.t == tab ? 'page' : 'false'));
  if (!me) {
    const r = mode == 'reg';
    m.innerHTML = `<div class="auth">
      <div class="hero">${RG}<div class="brandrow">${sv('coin')}<span>Cazo <i>Wallet</i></span></div>
        <h1>${r ? 'Buka dompet digitalmu' : 'Semua urusan duit, satu dompet.'}</h1>
        <p>${r ? 'Daftar gratis dan langsung siap dipakai.' : 'Masuk untuk kirim uang, isi saldo, dan menabung.'}</p>
        <span class="pig">${sv('piggy')}</span></div>
      <div class="seg" role="group" aria-label="Pilih Masuk atau Daftar">${[['login', 'Masuk'], ['reg', 'Daftar']].map(([v, l]) => `<button data-a="mode" data-v="${v}" aria-pressed="${mode == v}">${l}</button>`).join('')}</div>
      ${r ? '<div class="perks"><span>Kirim gratis sesama Cazo</span><span>Isi saldo via QRIS</span><span>Tabungan bertarget</span></div>' : ''}
      ${r ? fld('n', 'Nama lengkap', 'autocomplete="name" placeholder="Nama kamu" value="' + esc(av.n) + '"') : ''}
      ${fld('p', 'Nomor HP', 'type="tel" inputmode="numeric" placeholder="08123456789" autocomplete="tel" value="' + esc(av.p) + '"')}
      ${pwF('k', r ? 'Buat PIN (6 angka)' : 'PIN (6 angka)')}
      ${r ? pwF('k2', 'Ulangi PIN') + '<p class="sum">PIN dipakai di setiap transaksi. Jangan bagikan ke siapa pun, termasuk admin.</p>' : ''}
      <p class="msg" role="status"></p>
      <button class="btn btn-gold" data-a="auth">${r ? 'Buat akun Cazo' : 'Masuk'}</button>
      <button class="lnk" style="align-self:center" data-a="mode" data-v="${r ? 'login' : 'reg'}">${r ? 'Sudah punya akun? Masuk' : 'Belum punya akun? Daftar'}</button></div>`;
    return;
  }
  if (!user) { m.innerHTML = loader('Memuat dompetmu…'); return; }
  const hr = new Date().getHours(), gs = gl();
  const unread = txs.some(t => t.type == 'in' && t.ts > (+LS.g('cazo_seen_' + me) || 0));
  const home = `<div class="app-top"><button class="av" data-a="go" data-t="prof" aria-label="Profil saya">${esc((user.name.trim()[0] || 'C').toUpperCase())}</button>
      <div class="hi"><small>Selamat ${hr < 11 ? 'pagi' : hr < 15 ? 'siang' : hr < 18 ? 'sore' : 'malam'}</small><b>${esc(user.name)}</b></div>
      <button class="bellbtn" data-a="bell" aria-label="Notifikasi${unread ? ', ada yang baru' : ''}">${sv(unread ? 'bell' : 'bell0')}</button></div>
    <div class="bal">${RG}<small>Saldo Cazo</small><div class="amt">${rp(user.balance)}</div><span class="tag">Dompet aktif</span></div>
    <div class="acts">${[['send', 'plane', 'Kirim'], ['topup', 'plus', 'Isi saldo'], ['tf', 'bank', 'Transfer'], ['go', 'piggy', 'Tabung']].map(([a, i, l]) => `<button class="act" data-a="${a}"${a == 'go' ? ' data-t="save"' : ''}>${sv(i)}${l}</button>`).join('')}</div>
    <div><div class="tx-head"><span>Tabungan</span>${gs.length ? '<button class="lnk" data-a="go" data-t="save">Kelola</button>' : ''}</div>
      <div class="gl">${gs.length ? gs.slice(0, 2).map(gcard).join('') : `<button class="goal" data-a="gadd">${sv('piggy')}<div class="gt"><b>Belum ada tabungan</b><small>Ketuk untuk membuat tujuan tabungan</small></div><span class="edt">Buat</span></button>`}</div></div>
    <div><div class="tx-head"><span>Riwayat</span>${txs.length > 5 ? '<button class="lnk" data-a="go" data-t="hist">Lihat semua</button>' : ''}</div>
      <ul class="tx">${txs.length ? txs.slice(0, 5).map(row).join('') : none('Belum ada transaksi. Isi saldo untuk memulai.')}</ul></div>`;
  m.innerHTML = tab == 'hist' ? histHTML() : tab == 'prof' ? profHTML() : tab == 'save' ? savHTML() : home;
}

// ---------- Logika ----------
async function pinOk(p) { if (await hash(p) !== user.pin) throw 'PIN salah'; }
async function debit(amt) {
  const r = await runTransaction(ref(db, 'users/' + me + '/balance'), v => v === null ? 0 : (v >= amt ? v - amt : undefined));
  if (!r.committed) throw 'Saldo tidak cukup';
}
const log = (uid, o) => push(ref(db, 'transactions/' + uid), { ...o, ts: serverTimestamp() });
async function run(b, fn) {
  b.disabled = true;
  try { const m = await fn(); close(); say(m); }
  catch (e) { msg(typeof e == 'string' ? e : 'Gagal. Periksa koneksi lalu coba lagi.'); b.disabled = false; }
}

const acts = {
  mode: b => { av = { n: $('#n')?.value ?? av.n, p: $('#p').value }; mode = b.dataset.v; render(); },
  go: b => { tab = b.dataset.t; render(); $('#main').scrollTop = 0; },
  flt: b => { flt = b.dataset.v; render(); },
  close,
  eye: b => { const i = b.previousElementSibling, h = i.type == 'password'; i.type = h ? 'text' : 'password'; b.setAttribute('aria-pressed', h); b.setAttribute('aria-label', h ? 'Sembunyikan PIN' : 'Tampilkan PIN'); },
  amt: b => { $('#a').value = b.dataset.v; $$('[data-a=amt]').forEach(x => x.setAttribute('aria-pressed', x === b)); upd(); },
  pick: b => { $('#' + (b.dataset.to || 't')).value = b.dataset.v; },
  prov: b => { prov = b.dataset.v; $$('[data-a=prov]').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#dl').textContent = PROV[prov].lbl; },
  copy: () => navigator.clipboard.writeText(me).then(() => say('Nomor HP disalin')).catch(() => say('Nomor kamu: ' + me)),

  send: () => {
    const rec = [...new Map(txs.filter(t => t.type == 'out' && t.phone).map(t => [t.phone, t.peer])).entries()].slice(0, 3);
    sheet('Kirim uang', `${fld('t', 'Nomor HP penerima', 'type="tel" inputmode="numeric" placeholder="08123456789"')}
      ${rec.length ? `<div class="fld"><b>Terakhir dikirim</b><div class="opts">${rec.map(([p, n]) => `<button class="opt" data-a="pick" data-v="${esc(p)}">${esc(n)}</button>`).join('')}</div></div>` : ''}
      ${amtF([25000, 50000, 100000, 250000])}${fld('c', 'Catatan (opsional)', 'maxlength="40"')}${pinF()}
      <p class="msg" role="status"></p><button class="btn btn-gold" data-a="dosend">Kirim sekarang</button>`, 'plane');
  },
  topup: () => sheet('Isi saldo', `<p class="hint">Bayar lewat QRIS admin sesuai nominal. Minimal Rp 5.000.</p>${amtF([10000, 50000, 100000, 250000])}
      <p class="msg" role="status"></p><button class="btn btn-gold" data-a="tonext">Lanjut</button>`, 'plus'),
  tonext: () => {
    const a = Math.floor(+$('#a').value);
    if (!(a >= 5000)) return msg('Minimal isi saldo Rp 5.000');
    tp = { amt: a, code: Math.floor(Math.random() * 100) + 1 };
    sheet('Bayar lewat QRIS', `<p class="hint">Transfer <b>tepat</b> sesuai total ini, termasuk kode unik ${tp.code}, supaya mudah diverifikasi.</p>
      <div class="big">${rp(tp.amt + tp.code)}</div>
      ${qris ? `<img class="qris" src="${qris}" alt="QRIS admin">` : `<div class="hero-ic">${sv('qr')}</div><p class="hint">QRIS admin belum diunggah.</p>`}
      <dl class="dl"><div><dt>Saldo masuk</dt><dd>${rp(tp.amt)}</dd></div><div><dt>Kode unik</dt><dd>${rp(tp.code)}</dd></div></dl>
      <p class="msg" role="status"></p><button class="btn btn-gold" data-a="dotopup">Saya sudah transfer</button>`);
  },
  tf: () => {
    prov = null;
    const pc = ([k, v]) => `<button class="opt" data-a="prov" data-v="${k}" aria-pressed="false">${lg(k)}${v.n}</button>`, grp = k => Object.entries(PROV).filter(([, v]) => v.k == k).map(pc).join('');
    sheet('Transfer ke e-wallet & bank', `<p class="hint">Minimal Rp 10.000. Biaya admin mengikuti nominal.</p>
      <div class="fld"><b>E-wallet</b><div class="provs">${grp('ew')}</div></div><div class="fld"><b>Bank</b><div class="provs">${grp('bank')}</div></div>
      <div class="fld"><label for="d" id="dl">Nomor tujuan</label><input id="d" type="tel" inputmode="numeric"></div>${fld('nm', 'Nama penerima', 'maxlength="30"')}
      ${amtF([50000, 100000, 250000, 500000])}<p class="sum" id="sum"></p>${pinF()}
      <p class="msg" role="status"></p><button class="btn btn-gold" data-a="dotf">Transfer sekarang</button>`, 'bank');
    upd();
  },
  bell: () => {
    const n = txs.filter(t => plus(t.type) && (!t.status || t.status == 'success')).slice(0, 6); LS.s('cazo_seen_' + me, Date.now());
    sheet('Notifikasi', `<ul class="tx">${n.length ? n.map(row).join('') : none('Belum ada uang masuk.')}</ul>`, 'bell0'); render();
  },
  chpin: () => sheet('Ganti PIN', `${pinF('o', 'PIN lama')}${pinF('n', 'PIN baru (6 angka)')}
      <p class="msg" role="status"></p><button class="btn btn-gold" data-a="dopin">Simpan PIN baru</button>`),

  // ----- Tabungan -----
  gadd: () => {
    if (gl().length >= MAX_GOALS) return say('Maksimal ' + MAX_GOALS + ' tabungan');
    gid = null;
    sheet('Tambah tabungan', `${fld('gn', 'Nama tujuan', 'maxlength="24" placeholder="Contoh: Liburan Bali"')}
      <div class="opts">${['Liburan', 'Gadget', 'Dana darurat', 'Pendidikan'].map(v => `<button class="opt" data-a="pick" data-to="gn" data-v="${v}">${v}</button>`).join('')}</div>
      ${fld('gt', 'Target (Rp)', 'type="number" inputmode="numeric" placeholder="5000000"')}
      <div class="opts">${[1e6, 5e6, 10e6].map(v => `<button class="opt" data-a="pick" data-to="gt" data-v="${v}">${rp(v)}</button>`).join('')}</div>
      <p class="msg" role="status"></p><button class="btn btn-gold" data-a="dogadd">Buat tabungan</button>`, 'piggy');
  },
  gdetail: b => {
    gid = b.dataset.id; const g = gobj(); if (!g) return;
    const p = gp(g), sisa = Math.max(0, g.target - (g.saved || 0));
    sheet(esc(g.name), `<div class="hero-ic">${sv('piggy')}</div><div class="big">${rp(g.saved)}</div>
      <div class="bar" role="progressbar" aria-label="Progres ${esc(g.name)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><i style="width:${p}%"></i></div>
      <p class="hint">${p >= 100 ? 'Target tercapai!' : 'Sisa ' + rp(sisa) + ' lagi · ' + p + '%'} dari ${rp(g.target)}</p>
      <div class="bgrid"><button class="btn btn-gold" data-a="gdep">Nabung</button><button class="btn btn-line" data-a="gwd"${g.saved ? '' : ' disabled'}>Tarik</button><button class="btn btn-line" data-a="gedit">Ubah</button><button class="btn btn-line red" data-a="gdel">Hapus</button></div>`);
  },
  gedit: () => {
    const g = gobj(); if (!g) return;
    sheet('Ubah tabungan', `${fld('gn', 'Nama tujuan', 'maxlength="24" value="' + esc(g.name) + '"')}${fld('gt', 'Target (Rp)', 'type="number" inputmode="numeric" value="' + g.target + '"')}
      <p class="sum">Terkumpul <b>${rp(g.saved)}</b></p>
      <p class="msg" role="status"></p><button class="btn btn-gold" data-a="dogedit">Simpan perubahan</button>`, 'piggy');
  },
  gdep: () => {
    const g = gobj(); if (!g) return;
    sheet('Nabung: ' + esc(g.name), `<p class="hint">Saldo Cazo: <b>${rp(user.balance)}</b></p>${amtF([10000, 25000, 50000, 100000])}${pinF()}
      <p class="msg" role="status"></p><button class="btn btn-gold" data-a="dogdep">Nabung sekarang</button>`, 'piggy');
  },
  gwd: () => {
    const g = gobj(); if (!g || !g.saved) return;
    sheet('Tarik: ' + esc(g.name), `<p class="hint">Dana tabungan: <b>${rp(g.saved)}</b>. Penarikan masuk ke saldo Cazo.</p>${amtF([10000, 50000, 100000].filter(v => v < g.saved).concat(g.saved))}${pinF()}
      <p class="msg" role="status"></p><button class="btn btn-gold" data-a="dogwd">Tarik ke saldo</button>`, 'piggy');
  },
  gdel: () => {
    const g = gobj(); if (!g) return; const s = g.saved || 0;
    sheet('Hapus tabungan?', `<p class="ab" style="text-align:center">Tabungan <b>${esc(g.name)}</b> akan dihapus.${s ? ' Dana <b>' + rp(s) + '</b> dikembalikan ke saldo Cazo.' : ''}</p>${s ? pinF() : ''}
      <p class="msg" role="status"></p><button class="btn btn-bad" data-a="dogdel">Ya, hapus</button><button class="btn btn-line" data-a="close">Batal</button>`, 'piggy');
  },
  dogadd: b => run(b, async () => {
    const name = $('#gn').value.trim(), target = Math.floor(+$('#gt').value) || 0;
    if (!name) throw 'Isi nama tujuan';
    if (target < 10000) throw 'Target minimal Rp 10.000';
    if (dupName(name)) throw 'Nama tabungan sudah dipakai';
    if (gl().length >= MAX_GOALS) throw 'Maksimal ' + MAX_GOALS + ' tabungan';
    await set(push(ref(db, 'users/' + me + '/goals')), { name, target, saved: 0, createdAt: serverTimestamp() });
    return 'Tabungan "' + name + '" dibuat';
  }),
  dogedit: b => run(b, async () => {
    const name = $('#gn').value.trim(), target = Math.floor(+$('#gt').value) || 0;
    if (!gobj()) throw 'Tabungan tidak ditemukan';
    if (!name) throw 'Isi nama tujuan';
    if (target < 10000) throw 'Target minimal Rp 10.000';
    if (dupName(name)) throw 'Nama tabungan sudah dipakai';
    await update(ref(db, 'users/' + me + '/goals/' + gid), { name, target });
    return 'Tabungan diperbarui';
  }),
  dogdep: b => run(b, async () => {
    const g = gobj(), a = Math.floor(+$('#a').value) || 0;
    if (!g) throw 'Tabungan tidak ditemukan';
    if (a < 1000) throw 'Minimal menabung Rp 1.000';
    await pinOk($('#k').value);
    const r = await runTransaction(ref(db, 'users/' + me), u => {
      if (!u) return u;
      const x = u.goals && u.goals[gid];
      if (!x || (u.balance || 0) < a) return;
      u.balance -= a; x.saved = (x.saved || 0) + a; return u;
    });
    if (!r.committed) throw 'Saldo tidak cukup';
    await log(me, { type: 'save', amount: a, peer: g.name });
    return rp(a) + ' masuk ke tabungan ' + g.name;
  }),
  dogwd: b => run(b, async () => {
    const g = gobj(), a = Math.floor(+$('#a').value) || 0;
    if (!g) throw 'Tabungan tidak ditemukan';
    if (a < 1) throw 'Isi nominal penarikan';
    await pinOk($('#k').value);
    const r = await runTransaction(ref(db, 'users/' + me), u => {
      if (!u) return u;
      const x = u.goals && u.goals[gid];
      if (!x || (x.saved || 0) < a) return;
      x.saved -= a; u.balance = (u.balance || 0) + a; return u;
    });
    if (!r.committed) throw 'Dana tabungan tidak cukup';
    await log(me, { type: 'wd', amount: a, peer: g.name });
    return rp(a) + ' kembali ke saldo Cazo';
  }),
  dogdel: b => run(b, async () => {
    const g = gobj(); let back = 0;
    if (!g) throw 'Tabungan tidak ditemukan';
    if (g.saved) await pinOk($('#k').value);
    const r = await runTransaction(ref(db, 'users/' + me), u => {
      if (!u) return u;
      const x = u.goals && u.goals[gid];
      if (!x) return;
      back = x.saved || 0; u.balance = (u.balance || 0) + back; delete u.goals[gid]; return u;
    });
    if (!r.committed) throw 'Gagal menghapus. Coba lagi';
    if (back) await log(me, { type: 'wd', amount: back, peer: g.name, note: 'Tabungan dihapus' });
    return 'Tabungan dihapus' + (back ? ', ' + rp(back) + ' kembali ke saldo' : '');
  }),

  // ----- Profil -----
  about: () => sheet('Tentang Cazo Wallet', `<div class="hero-ic">${sv('coin')}</div>
    <p class="ab">Cazo Wallet adalah dompet digital berbasis web untuk menyimpan saldo, mengirim uang, transfer ke e-wallet dan bank, serta menabung untuk tujuan tertentu, semuanya dalam satu aplikasi.</p>
    <div class="fld"><b>Yang bisa kamu lakukan</b></div>
    <ul class="fl">
      <li><b>Isi saldo</b> lewat QRIS admin. Saldo masuk setelah admin memverifikasi pembayaranmu.</li>
      <li><b>Kirim uang</b> ke sesama pengguna Cazo memakai nomor HP. Gratis dan langsung masuk.</li>
      <li><b>Transfer</b> ke DANA, GoPay, ShopeePay, dan SeaBank. Diproses admin dengan biaya admin sesuai nominal.</li>
      <li><b>Tabungan</b>: buat beberapa tujuan, atur target, lalu nabung atau tarik kapan saja.</li>
    </ul>
    <dl class="dl"><div><dt>Cara masuk</dt><dd>Nomor HP + PIN 6 angka</dd></div><div><dt>Biaya transfer</dt><dd>Mulai Rp 500</dd></div><div><dt>Versi</dt><dd>2.0</dd></div></dl>
    <p class="hint" style="margin-top:14px">PIN disimpan sebagai kode hash, bukan teks asli. Jangan bagikan PIN ke siapa pun, termasuk admin dan customer service.</p>
    <a class="btn btn-gold" style="margin-top:14px" href="${CS_URL}">Butuh bantuan? Hubungi kami</a>`),
  logout: () => sheet('Keluar dari akun?', `<p class="ab" style="text-align:center">Kamu perlu masuk lagi dengan nomor HP dan PIN. Saldo dan tabunganmu tetap aman di akun ini.</p>
    <button class="btn btn-gold" style="margin-top:18px" data-a="close">Tetap di sini</button><button class="btn btn-bad" data-a="dologout">Ya, keluar</button>`, 'exit'),
  dologout: () => logout(),

  tx: b => {
    const t = txs.find(x => x.id == b.dataset.id); if (!t) return;
    const P = PROV[t.provider], p = plus(t.type), w = t.status == 'pending', x = t.status == 'rejected';
    const D = ({ topup: [['Saldo masuk', rp(t.amount)], ['Kode unik', rp(t.code)], ['Total transfer', rp(t.total)]], tf: [['Tujuan', P?.n], ['Nomor tujuan', t.dest], ['Nama penerima', t.name], ['Nominal', rp(t.amount)], ['Biaya admin', rp(t.fee)], ['Total dipotong', rp(t.total)]], out: [['Penerima', t.peer], ['Nomor HP', t.phone]], in: [['Pengirim', t.peer], ['Nomor HP', t.phone]], save: [['Tujuan tabungan', t.peer]], wd: [['Dari tabungan', t.peer]], pay: [['Toko', t.peer]] }[t.type] || []);
    if (t.note) D.push(['Catatan', t.note]);
    const rs = [['Status', ST(t)], ['Waktu', new Date(t.ts).toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' })], ...D, ['ID transaksi', 'CZ-' + t.id.slice(-8).toUpperCase()]];
    sheet('Detail transaksi', `<div class="hero-ic">${ico(t)}</div><div class="big" style="color:${p && !w && !x ? 'var(--pos)' : 'inherit'}">${p ? '+' : '−'}${rp(amtOf(t))}</div>
      <p class="hint"><span class="chip">${ST(t)}</span></p>${w && t.type == 'topup' ? `<p class="hint">Transfer tepat ${rp(t.total)} ke QRIS admin. Saldo masuk setelah diverifikasi.</p>` : ''}
      <dl class="dl">${rs.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`);
  },
  admin: () => {
    adminOpen = true;
    sheet('Panel admin', `<div class="fld"><label for="qf">QRIS admin${qris ? ' (sudah diunggah)' : ''}</label><input id="qf" type="file" accept="image/*"></div>
      <div class="fld"><b>Menunggu verifikasi (${reqs.length})</b>${reqs.length ? reqs.map(r => `<div class="req"><b>${r.type == 'topup' ? 'Isi saldo' : 'Transfer ke ' + (PROV[r.provider]?.n || '')}</b> · ${esc(r.uname)} (${esc(r.uid)})<br>${r.type == 'topup' ? 'Cek dana masuk ' + rp(r.total) + ' (saldo ' + rp(r.amount) + ')' : esc(r.dest) + ' a.n. ' + esc(r.name) + ' · kirim ' + rp(r.amount) + ' (biaya ' + rp(r.fee) + ')'}<div class="opts"><button class="btn btn-gold" data-a="decide" data-id="${r.id}" data-ok="1">Setujui</button><button class="btn btn-line" data-a="decide" data-id="${r.id}" data-ok="0">Tolak</button></div></div>`).join('') : '<p class="hint" style="padding:16px 0">Tidak ada permintaan.</p>'}</div>`);
  },
  async decide(b) {
    const r = reqs.find(x => x.id == b.dataset.id), ok = b.dataset.ok == '1', st = ok ? 'success' : 'rejected';
    if (!r || !ADMINS.includes(me)) return;
    b.disabled = true;
    try {
      const l = await runTransaction(ref(db, 'requests/' + r.id + '/status'), v => v == 'pending' ? st : undefined);
      if (!l.committed) throw 'Sudah diproses';
      const back = r.type == 'topup' ? (ok ? r.amount : 0) : (ok ? 0 : r.total);
      if (back) await runTransaction(ref(db, 'users/' + r.uid + '/balance'), v => (v || 0) + back);
      await update(ref(db), { ['transactions/' + r.uid + '/' + r.id + '/status']: st });
      say(ok ? 'Disetujui' : 'Ditolak');
    } catch (e) { say(typeof e == 'string' ? e : 'Gagal. Coba lagi'); b.disabled = false; }
  },
  async qrisup(i) {
    const f = i.files[0]; if (!f) return;
    try {
      const im = await createImageBitmap(f), k = Math.min(1, 640 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      await set(ref(db, 'config/qris'), c.toDataURL('image/jpeg', .9)); say('QRIS admin disimpan');
    } catch { say('Gagal mengunggah gambar'); }
  },
  async auth(b) {
    const phone = norm($('#p').value), pin = $('#k').value, reg = mode == 'reg';
    if (reg && !$('#n').value.trim()) return msg('Nama wajib diisi');
    if (phone.length < 9) return msg('Nomor HP tidak valid');
    if (!/^\d{6}$/.test(pin)) return msg('PIN harus 6 angka');
    if (reg) {
      if (/^(\d)\1{5}$/.test(pin) || '0123456789'.includes(pin) || '9876543210'.includes(pin)) return msg('PIN terlalu mudah ditebak. Pakai angka lain');
      if (pin !== $('#k2').value) return msg('Ulangi PIN tidak sama');
    }
    const label = b.textContent; b.disabled = true; b.textContent = 'Memproses…'; msg('');
    try {
      const snap = await get(ref(db, 'users/' + phone)), h = await hash(pin);
      if (reg) {
        if (snap.exists()) throw 'Nomor sudah terdaftar. Silakan masuk';
        await set(ref(db, 'users/' + phone), { name: $('#n').value.trim(), pin: h, balance: 0, createdAt: serverTimestamp() });
      } else if (!snap.exists() || snap.val().pin !== h) throw 'Nomor HP atau PIN salah';
      me = phone; LS.s('cazo_me', me); start();
      if (reg) say('Akun dibuat. Selamat datang di Cazo!');
    } catch (e) { msg(typeof e == 'string' ? e : 'Gagal terhubung. Coba lagi.'); b.disabled = false; b.textContent = label; }
  },
  dotopup: b => run(b, async () => {
    await request({ type: 'topup', amount: tp.amt, code: tp.code, total: tp.amt + tp.code });
    return 'Permintaan isi saldo terkirim. Menunggu verifikasi admin';
  }),
  dosend: b => run(b, async () => {
    const to = norm($('#t').value), amt = Math.floor(+$('#a').value), note = $('#c').value.trim();
    if (!to || to == me) throw 'Nomor tujuan tidak valid';
    if (!(amt >= 1000)) throw 'Minimal kirim Rp 1.000';
    await pinOk($('#k').value);
    const rs = await get(ref(db, 'users/' + to));
    if (!rs.exists()) throw 'Nomor tujuan belum terdaftar di Cazo';
    await debit(amt);
    await runTransaction(ref(db, 'users/' + to + '/balance'), v => (v || 0) + amt);
    await Promise.all([log(me, { type: 'out', amount: amt, peer: rs.val().name, phone: to, note }), log(to, { type: 'in', amount: amt, peer: user.name, phone: me, note })]);
    return 'Terkirim ke ' + rs.val().name + ': ' + rp(amt);
  }),
  dotf: b => run(b, async () => {
    const P = PROV[prov], dest = $('#d').value.replace(/\D/g, ''), nm = $('#nm').value.trim(), amt = Math.floor(+$('#a').value), f = fee(amt);
    if (!P) throw 'Pilih tujuan transfer';
    if (dest.length < 8) throw 'Nomor tujuan tidak valid';
    if (!nm) throw 'Isi nama penerima';
    if (!(amt >= 10000)) throw 'Minimal transfer Rp 10.000';
    await pinOk($('#k').value); await debit(amt + f);
    try { await request({ type: 'tf', provider: prov, dest, name: nm, amount: amt, fee: f, total: amt + f }); }
    catch (e) { await runTransaction(ref(db, 'users/' + me + '/balance'), v => (v || 0) + amt + f); throw e; }
    return 'Transfer ke ' + P.n + ' diproses: ' + rp(amt);
  }),
  dopin: b => run(b, async () => {
    const nw = $('#n').value;
    if (!/^\d{6}$/.test(nw)) throw 'PIN baru harus 6 angka';
    await pinOk($('#o').value);
    await set(ref(db, 'users/' + me + '/pin'), await hash(nw));
    return 'PIN berhasil diganti';
  })
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (b) acts[b.dataset.a]?.(b);
  else if (e.target.id == 'sheet') close();
});
document.addEventListener('keydown', e => {
  if (e.key == 'Escape') close();
  else if (e.key == 'Enter' && e.target.tagName == 'INPUT' && e.target.closest('.auth')) $('[data-a=auth]').click();
});
document.addEventListener('input', e => { if (e.target.id == 'a') upd(); });
document.addEventListener('change', e => { if (e.target.id == 'qf') acts.qrisup(e.target); });
start();
</script>
</body>
</html>
