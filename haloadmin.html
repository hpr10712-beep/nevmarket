<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HaloKita · Panel Admin</title>
<style>
:root{--bg:#06120c;--s1:#0d2118;--s2:#142e22;--s3:#1f4232;--ln:#1d3a2c;--tx:#eaf6ef;--sub:#88ad9b;--acc:#c8f542;--on:#0a2016;--dg:#ff6b6b;--wr:#ffb454;--r:18px;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);min-height:100vh;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;background:var(--s1);border:1.5px solid var(--ln);border-radius:14px;padding:11px 14px;outline:none;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(200,245,66,.15)}
textarea{resize:vertical;min-height:90px}
[hidden]{display:none!important}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:24px;padding:26px;width:min(440px,100%);display:grid;gap:14px}
.card h1{font-size:24px;letter-spacing:-.03em}.card p{color:var(--sub);line-height:1.5;font-size:14px}
.logo{width:52px;height:52px;border-radius:18px;background:var(--acc);color:var(--on);display:grid;place-items:center;font-weight:900;font-size:24px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:14px;background:var(--acc);color:var(--on);font-weight:800;white-space:nowrap;transition:transform .15s,opacity .2s}
.b:active{transform:scale(.96)}.b:disabled{opacity:.5}
.b.g{background:var(--s2);color:var(--tx)}.b.d{background:rgba(255,107,107,.15);color:var(--dg)}.b.s{padding:8px 13px;font-size:13.5px;border-radius:12px}
.err{color:var(--dg);font-size:13.5px;min-height:18px}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--s1);border-right:1px solid var(--ln);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;padding:4px 8px 16px}.brand .logo{width:36px;height:36px;border-radius:12px;font-size:17px}.brand small{display:block;color:var(--sub);font-weight:600;font-size:12px}
#nav{display:grid;gap:4px}
#nav button{text-align:left;padding:11px 14px;border-radius:14px;color:var(--sub);font-weight:700;display:flex;justify-content:space-between;align-items:center}
#nav button.on{background:var(--acc);color:var(--on)}#nav button:not(.on):hover{background:var(--s2);color:var(--tx)}
#nav em{font-style:normal;font-size:11.5px;background:var(--dg);color:#fff;border-radius:99px;padding:1px 7px}
.sp{flex:1}
main{padding:26px clamp(16px,3vw,36px) 60px;min-width:0}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
header h1{font-size:26px;letter-spacing:-.04em}header span{color:var(--sub);font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.st{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:16px;display:grid;gap:4px}.st b{font-size:28px;letter-spacing:-.04em}.st small{color:var(--sub);font-weight:600}
.list{display:grid;gap:10px}
.row{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.rh{display:flex;align-items:center;gap:12px;min-width:0}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#06120c;flex:none;background-size:cover;background-position:center}
.av.sq{border-radius:30%}
.rt{flex:1;min-width:0;display:grid;gap:1px}.rt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rt small{color:var(--sub);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:var(--s3);color:var(--sub);white-space:nowrap}
.chip.ok{background:rgba(200,245,66,.16);color:var(--acc)}.chip.bad{background:rgba(255,107,107,.16);color:var(--dg)}.chip.wr{background:rgba(255,180,84,.16);color:var(--wr)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.tx{line-height:1.5;word-break:break-word;color:#cfe5da}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.bar input{flex:1;min-width:180px}
.emp{padding:40px 16px;text-align:center;color:var(--sub);font-weight:600}
pre{background:#030b07;border:1px solid var(--ln);border-radius:14px;padding:14px;overflow:auto;max-height:340px;font-size:12.5px;line-height:1.5}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.keys button{padding:6px 11px;border-radius:99px;background:var(--s2);font-size:13px;font-weight:700}
#md{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:16px;z-index:20;backdrop-filter:blur(4px)}
#md>div{background:var(--s1);border:1px solid var(--ln);border-radius:24px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:22px;display:grid;gap:14px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px}.mh h2{font-size:20px;letter-spacing:-.03em}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--acc);color:var(--on);font-weight:800;padding:12px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:all .3s;z-index:30}
#toast.on{opacity:1;transform:translateX(-50%)}
.sec{font-weight:800;color:var(--acc);font-size:13.5px;margin:6px 2px 0}
@media(max-width:820px){
 #app{grid-template-columns:1fr}
 aside{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--ln);gap:8px}
 .brand{padding:0 6px 0 4px}.brand small,.sp{display:none}
 #nav{display:flex;gap:6px}#nav button{white-space:nowrap;padding:9px 14px;border-radius:99px;background:var(--s2)}
 #out{flex:none}
}
</style>
</head>
<body>
<div id="gate" class="center" hidden><div class="card"><div class="logo">🛡</div><h1>Kode admin</h1><p id="gw">Masukkan kode admin untuk membuka panel dengan kendali penuh.</p>
 <input id="ac" type="password" placeholder="Kode admin" autocomplete="off" spellcheck="false"><div id="ge" class="err"></div>
 <button id="ab" class="b">Buka panel</button></div></div>
<div id="app" hidden>
 <aside><div class="brand"><div class="logo">H</div><div>HaloKita<small>Panel admin</small></div></div><div id="nav"></div><div class="sp"></div><button id="out" class="b g s">Keluar</button></aside>
 <main><header><h1 id="ttl"></h1><span id="who"></span></header><section id="view"></section></main>
</div>
<div id="md" hidden><div id="mb"></div></div>
<div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,get,update,push,query,limitToLast,serverTimestamp,increment,remove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBEPzUM9EresZ-yvphzDusVs7AUqdLuCNQ",
  authDomain: "mygame-68b24.firebaseapp.com",
  databaseURL: "https://mygame-68b24-default-rtdb.firebaseio.com",
  projectId: "mygame-68b24",
  storageBucket: "mygame-68b24.firebasestorage.app",
  messagingSenderId: "1003182873390",
  appId: "1:1003182873390:web:aabf3248f759cbc9d678bf"
};
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getDatabase(app);
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const fmt = t => t ? new Date(t).toLocaleString('id-ID', {day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'}) : '-';
const val = async p => (await get(ref(db, p))).val();
const PAL = ['#7dd3fc', '#c4b5fd', '#fda4af', '#fcd34d', '#6ee7b7', '#f9a8d4', '#a5b4fc', '#fdba74'];
const col = s => PAL[Math.abs([...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 7)) % PAL.length];
const okImg = u => typeof u == 'string' && /^https:\/\//.test(u);
let me = null, tab = 'home';
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2400); };
const avatar = (nm, id, photo, sq) => { const a = el('div', 'av' + (sq ? ' sq' : ''), photo ? '' : String(nm || '?')[0].toUpperCase()); a.style.background = photo ? `center/cover url("${photo}")` : col(id); return a; };
const btn = (t, cls, fn) => { const b = el('button', 'b s ' + (cls || ''), t); b.onclick = async () => { b.disabled = true; try { await fn(); } catch (e) { console.error(e); toast('Gagal: ' + (e.code || e.message || 'coba lagi')); } b.disabled = false; }; return b; };
function modal(title, node) { const m = $('#mb'); m.replaceChildren(); const h = el('div', 'mh'), x = btn('Tutup', 'g', async () => { $('#md').hidden = true; }); h.append(el('h2', '', title), x); m.append(h, node); $('#md').hidden = false; }
$('#md').onclick = e => { if (e.target.id == 'md') $('#md').hidden = true; };

/* ---- login & kode admin ---- */
async function verify(code) {
  if (!code) return false;
  let sec; try { sec = await val('config/adminCode'); } catch { sec = undefined; }
  if (sec === null) return 'unset';
  if (sec !== undefined && sec !== code) return false;
  try { await update(ref(db, 'admins/' + me.uid), {code, ts: serverTimestamp()}); return true; } catch { return false; }
}
const leave = async () => { try { if (me) await remove(ref(db, 'admins/' + me.uid)); } catch {} try { await signOut(auth); } catch {} };
$('#out').onclick = leave;
let tries = 0, lock = 0;
$('#ab').onclick = async () => {
  const e = $('#ge'); e.textContent = '';
  if (Date.now() < lock) { e.textContent = 'Terlalu banyak percobaan. Tunggu ' + Math.ceil((lock - Date.now()) / 1000) + ' detik.'; return; }
  const r = await verify($('#ac').value.trim());
  if (r === true) { tries = 0; enter(); return; }
  if (r === 'unset') { e.textContent = 'config/adminCode belum diatur di Firebase.'; return; }
  if (++tries >= 5) { lock = Date.now() + 60000; tries = 0; }
  e.textContent = 'Kode salah.';
};

/* ==== DIUBAH: langsung masuk panel tanpa kode admin ==== */
onAuthStateChanged(auth, async u => {
  me = u; $('#gate').hidden = true; $('#app').hidden = true;
  if (!u) {
    try { await signInAnonymously(auth); }
    catch (e) {
      console.error(e);
      $('#gate').hidden = false;
      $('#ge').textContent = 'Anonymous auth gagal — aktifkan di Firebase Console → Authentication → Sign-in method.';
    }
    return;
  }
  enter();
});
/* ==== akhir bagian yang diubah ==== */

const TABS = [['home', 'Ringkasan'], ['usr', 'Pengguna'], ['rep', 'Laporan'], ['apl', 'Banding'], ['grp', 'Grup & Saluran'], ['news', 'Berita'], ['db', 'Database']];
function enter() {
  $('#gate').hidden = true; $('#app').hidden = false; $('#who').textContent = me.email || 'Admin';
  const n = $('#nav'); n.replaceChildren();
  TABS.forEach(([k, t]) => { const b = el('button', '', t); b.dataset.k = k; b.onclick = () => go(k); n.append(b); });
  go(tab);
}
async function go(k) {
  tab = k; document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.k == k));
  $('#ttl').textContent = TABS.find(t => t[0] == k)[1]; const v = $('#view'); v.replaceChildren(el('div', 'emp', 'Memuat…'));
  try { await ({home: tHome, usr: tUsr, rep: tRep, apl: tApl, grp: tGrp, news: tNews, db: tDb})[k](v); }
  catch (e) { console.error(e); v.replaceChildren(el('div', 'emp', 'Gagal memuat. Pastikan aturan Firebase mengizinkan akun admin. (' + (e.code || e.message) + ')')); }
}

/* ---- ringkasan ---- */
async function tHome(v) {
  const [us, gr, rp, ap, bn, vf, nw] = await Promise.all(['users', 'groups', 'reports', 'appeals', 'bans', 'verified', 'news'].map(p => val(p).catch(() => null)));
  const n = o => o ? Object.keys(o).length : 0, gl = Object.values(gr || {}), open = Object.values(rp || {}).filter(r => r.st == 'open').length;
  const st = [['Pengguna', n(us)], ['Online', Object.values(us || {}).filter(u => u.online).length], ['Grup', gl.filter(g => g.type != 'saluran').length], ['Saluran', gl.filter(g => g.type == 'saluran').length], ['Laporan terbuka', open], ['Banding menunggu', n(ap)], ['Diblokir', n(bn)], ['Terverifikasi', n(vf)], ['Berita', n(nw)]];
  const g = el('div', 'stats'); st.forEach(([t, x]) => { const c = el('div', 'st'); c.append(el('b', '', String(x)), el('small', '', t)); g.append(c); });
  v.replaceChildren(g);
  const nb = document.querySelector('#nav [data-k=rep] em'); if (nb) nb.remove(); if (open) { const e = el('em', '', String(open)); document.querySelector('#nav [data-k=rep]').append(e); }
}

/* ---- pengguna ---- */
async function tUsr(v) {
  const [us, bn, vf] = await Promise.all([val('users'), val('bans'), val('verified')]), all = Object.entries(us || {}).sort((a, b) => String(a[1].name).localeCompare(String(b[1].name))), bans = bn || {}, ver = vf || {};
  const q = el('input'), bar = el('div', 'bar'), list = el('div', 'list'); q.placeholder = 'Cari nama, @username, atau UID'; bar.append(q); v.replaceChildren(bar, el('div', 'sec', all.length + ' pengguna'), list);
  const paint = () => {
    const s = q.value.trim().toLowerCase().replace(/^@/, ''), l = all.filter(([id, u]) => !s || String(u.name).toLowerCase().includes(s) || String(u.username).toLowerCase().includes(s) || id == q.value.trim()).slice(0, 60); list.replaceChildren();
    if (!l.length) { list.append(el('div', 'emp', 'Tidak ada pengguna.')); return; }
    l.forEach(([id, u]) => {
      const r = el('div', 'row'), h = el('div', 'rh'), t = el('div', 'rt'), a = el('div', 'acts'); t.append(el('b', '', u.name || '-'), el('small', '', '@' + (u.username || '-') + ' · ' + id));
      h.append(avatar(u.name, id, u.photo), t); if (u.online) h.append(el('span', 'chip ok', 'Online')); if (ver[id]) h.append(el('span', 'chip ok', 'Centang')); if (bans[id]) h.append(el('span', 'chip bad', 'Diblokir'));
      if (bans[id]) a.append(btn('Buka blokir', '', async () => { await update(ref(db), {[`bans/${id}`]: null, [`appeals/${id}`]: null}); toast('Blokir dibuka'); go('usr'); }));
      else a.append(btn('Blokir', 'd', async () => { const rs = prompt('Alasan blokir:', 'Melanggar ketentuan penggunaan HaloKita.'); if (rs === null) return; await update(ref(db, 'bans/' + id), {reason: rs.trim() || 'Melanggar ketentuan penggunaan HaloKita.', ts: serverTimestamp(), by: me.uid}); toast('Diblokir'); go('usr'); }));
      a.append(btn(ver[id] ? 'Cabut centang' : 'Beri centang', 'g', async () => { await (ver[id] ? remove(ref(db, 'verified/' + id)) : update(ref(db, 'verified'), {[id]: true})); go('usr'); }),
        btn('Detail', 'g', async () => { const p = el('pre'); p.textContent = JSON.stringify({users: u, ban: bans[id] || null}, (k, x) => typeof x == 'string' && x.length > 120 ? x.slice(0, 120) + '…' : x, 2); modal(u.name || id, p); }));
      r.append(h, a); list.append(r);
    });
  };
  q.oninput = paint; paint();
}

/* ---- laporan & banding ---- */
async function tRep(v) {
  const l = Object.entries(await val('reports') || {}).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0)); v.replaceChildren();
  if (!l.length) { v.append(el('div', 'emp', 'Belum ada laporan.')); return; }
  const list = el('div', 'list'); v.append(list);
  l.forEach(([id, r]) => {
    const row = el('div', 'row'), h = el('div', 'rh'), t = el('div', 'rt'), a = el('div', 'acts'), open = r.st == 'open';
    t.append(el('b', '', '@' + (r.targetUser || '?') + ' dilaporkan'), el('small', '', 'oleh @' + (r.byUser || '?') + ' · ' + fmt(r.ts))); h.append(avatar(r.targetName || r.targetUser, r.target || id), t, el('span', 'chip ' + (open ? 'wr' : ''), open ? 'Baru' : 'Selesai'));
    a.append(btn('Blokir target', 'd', async () => { await update(ref(db), {[`bans/${r.target}`]: {reason: 'Laporan: ' + (r.reason || '').slice(0, 160), ts: serverTimestamp(), by: me.uid}, [`reports/${id}/st`]: 'done'}); toast('Diblokir'); go('rep'); }));
    if (open) a.append(btn('Selesai', 'g', async () => { await update(ref(db, 'reports/' + id), {st: 'done'}); go('rep'); }));
    a.append(btn('Hapus', 'g', async () => { await remove(ref(db, 'reports/' + id)); go('rep'); }));
    row.append(h, el('div', 'tx', r.reason || ''), a); list.append(row);
  });
}
async function tApl(v) {
  const l = Object.entries(await val('appeals') || {}).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0)); v.replaceChildren();
  if (!l.length) { v.append(el('div', 'emp', 'Tidak ada banding yang menunggu.')); return; }
  const list = el('div', 'list'); v.append(list);
  for (const [uid, p] of l) {
    const bn = await val('bans/' + uid), row = el('div', 'row'), h = el('div', 'rh'), t = el('div', 'rt'), a = el('div', 'acts'), nt = el('input'); nt.placeholder = 'Catatan penolakan (opsional)';
    t.append(el('b', '', '@' + (p.user || '?') + ' mengajukan banding'), el('small', '', fmt(p.ts))); h.append(avatar(p.name || p.user, uid), t);
    a.append(btn('Terima', '', async () => { await update(ref(db), {[`bans/${uid}`]: null, [`appeals/${uid}`]: null}); toast('Banding diterima'); go('apl'); }), btn('Tolak', 'd', async () => { await update(ref(db), {[`bans/${uid}/rej`]: {note: nt.value.trim(), ts: serverTimestamp()}, [`appeals/${uid}`]: null}); toast('Banding ditolak'); go('apl'); }));
    row.append(h); if (bn?.reason) row.append(el('div', 'chip', 'Alasan blokir: ' + bn.reason)); row.append(el('div', 'tx', p.text || ''), nt, a); list.append(row);
  }
}

/* ---- grup & saluran ---- */
async function wipe(id, g) {
  const ms = await val('gm/' + id) || {}, up = {}; Object.keys(ms).forEach(u => { up[`userGroups/${u}/${id}`] = null; });
  Object.assign(up, {[`gm/${id}`]: null, [`gmsg/${id}`]: null, [`grx/${id}`]: null, [`gans/${id}`]: null, [`groups/${id}`]: null}); if (g.code) up[`gcodes/${g.code}`] = null; await update(ref(db), up);
}
async function tGrp(v) {
  const all = Object.entries(await val('groups') || {}).sort((a, b) => (b[1].lts || b[1].ts || 0) - (a[1].lts || a[1].ts || 0)), q = el('input'), bar = el('div', 'bar'), list = el('div', 'list');
  q.placeholder = 'Cari nama atau kode'; bar.append(q); v.replaceChildren(bar, el('div', 'sec', all.length + ' grup & saluran'), list);
  const paint = () => {
    const s = q.value.trim().toLowerCase(), l = all.filter(([, g]) => !s || String(g.name).toLowerCase().includes(s) || String(g.code).toLowerCase() == s); list.replaceChildren();
    if (!l.length) { list.append(el('div', 'emp', 'Tidak ada data.')); return; }
    l.forEach(([id, g]) => {
      const r = el('div', 'row'), h = el('div', 'rh'), t = el('div', 'rt'), a = el('div', 'acts'), ch = g.type == 'saluran';
      t.append(el('b', '', g.name || '-'), el('small', '', (ch ? 'Saluran · ' + (g.mc || 0) + ' pengikut' : 'Grup · ' + (g.mc || 0) + ' anggota') + ' · kode ' + (g.code || '-'))); h.append(avatar(g.name, id, g.ph, ch), t, el('span', 'chip ' + (ch ? 'ok' : ''), ch ? 'Saluran' : 'Grup'));
      a.append(btn('Kelola', '', () => manage(id)), btn('Hapus', 'd', async () => { if (!confirm('Hapus "' + g.name + '" beserta seluruh isinya untuk semua orang?')) return; await wipe(id, g); toast('Dihapus'); go('grp'); }));
      r.append(h, a); list.append(r);
    });
  };
  q.oninput = paint; paint();
}
async function manage(id) {
  const g = await val('groups/' + id); if (!g) { toast('Tidak ditemukan'); return; }
  const [ms, msg] = await Promise.all([val('gm/' + id), get(query(ref(db, 'gmsg/' + id), limitToLast(100))).then(s => s.val())]), box = el('div'); box.style.cssText = 'display:grid;gap:12px';
  const info = el('div', 'row'); info.append(el('div', 'rt')); info.firstChild.append(el('b', '', g.name), el('small', '', 'Pemilik: ' + (ms?.[g.owner]?.name || g.owner) + ' · kode ' + g.code + ' · dibuat ' + fmt(g.ts)));
  const ia = el('div', 'acts');
  ia.append(btn('Ubah nama', 'g', async () => { const n = prompt('Nama baru:', g.name); if (n && n.trim().length > 1) { await update(ref(db, 'groups/' + id), {name: n.trim().slice(0, 40)}); toast('Disimpan'); manage(id); } }),
    btn('Ubah deskripsi', 'g', async () => { const n = prompt('Deskripsi baru:', g.desc || ''); if (n !== null) { await update(ref(db, 'groups/' + id), {desc: n.trim().slice(0, 120)}); toast('Disimpan'); manage(id); } }),
    btn('Lepas sematan', 'g', async () => { await update(ref(db, 'groups/' + id), {pin: null}); toast('Sematan dilepas'); }));
  info.append(ia);
  const ml = el('div', 'list'), me2 = Object.entries(ms || {}).sort((a, b) => ({owner: 0, admin: 1}[a[1].role] ?? 2) - ({owner: 0, admin: 1}[b[1].role] ?? 2)).slice(0, 300);
  me2.forEach(([u, m]) => {
    const r = el('div', 'row'), h = el('div', 'rh'), t = el('div', 'rt'), a = el('div', 'acts'); t.append(el('b', '', m.name || u), el('small', '', '@' + (m.username || '-')));
    h.append(avatar(m.name, u), t, el('span', 'chip ' + (m.role == 'owner' ? 'ok' : m.role == 'admin' ? 'wr' : ''), m.role || 'anggota'));
    if (u != g.owner) {
      a.append(btn(m.role == 'admin' ? 'Cabut admin' : 'Jadikan admin', 'g', async () => { await update(ref(db, `gm/${id}/${u}`), {role: m.role == 'admin' ? (g.type == 'saluran' ? 'follower' : 'member') : 'admin'}); manage(id); }),
        btn('Jadikan pemilik', 'g', async () => { if (!confirm('Pindahkan kepemilikan ke ' + (m.name || u) + '?')) return; await update(ref(db), {[`groups/${id}/owner`]: u, [`gm/${id}/${u}/role`]: 'owner', [`gm/${id}/${g.owner}/role`]: 'admin'}); manage(id); }),
        btn('Keluarkan', 'd', async () => { if (!confirm('Keluarkan ' + (m.name || u) + '?')) return; await update(ref(db), {[`gm/${id}/${u}`]: null, [`userGroups/${u}/${id}`]: null, [`groups/${id}/mc`]: increment(-1)}); manage(id); }));
    }
    r.append(h, a); ml.append(r);
  });
  const gl = el('div', 'list'), ks = Object.entries(msg || {}).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0));
  if (!ks.length) gl.append(el('div', 'emp', 'Belum ada pesan.'));
  ks.forEach(([k, m]) => {
    const r = el('div', 'row'), a = el('div', 'acts'); r.append(el('div', 'rt')); r.firstChild.append(el('b', '', (m.name || m.from) + (m.q ? ' · pertanyaan' : '')), el('small', '', fmt(m.ts)));
    r.append(el('div', 'tx', m.del !== undefined ? '(pesan sudah dihapus)' : (m.text || '')));
    if (m.del === undefined) { a.append(btn('Hapus pesan', 'd', async () => { await update(ref(db), {[`gmsg/${id}/${k}/text`]: null, [`gmsg/${id}/${k}/q`]: null, [`gmsg/${id}/${k}/del`]: 'HaloKita', [`gmsg/${id}/${k}/dr`]: 'admin'}); manage(id); })); r.append(a); }
    gl.append(r);
  });
  box.append(info, el('div', 'sec', 'Anggota (' + me2.length + ')'), ml, el('div', 'sec', 'Pesan terbaru'), gl); modal(g.name, box);
}

/* ---- berita ---- */
async function tNews(v) {
  const tx = el('textarea'), im = el('input'), box = el('div', 'row'); tx.placeholder = 'Isi berita (maks. 500 huruf)'; tx.maxLength = 500; im.placeholder = 'Link gambar https (opsional)';
  box.append(tx, im, btn('Terbitkan berita', '', async () => {
    const t = tx.value.trim(), u = im.value.trim(); if (t.length < 3) { toast('Tulis isi berita'); return; } if (u && !okImg(u)) { toast('Link gambar harus https'); return; }
    const id = push(ref(db, 'news')).key; await update(ref(db), {[`news/${id}`]: {text: t, ...(u ? {img: u} : {}), ts: serverTimestamp(), by: me.uid}}); toast('Berita terbit'); go('news');
  }));
  const l = Object.entries(await val('news') || {}).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0)), list = el('div', 'list'); v.replaceChildren(box, el('div', 'sec', 'Berita terbit'), list);
  if (!l.length) list.append(el('div', 'emp', 'Belum ada berita.'));
  l.forEach(([id, n]) => { const r = el('div', 'row'); r.append(el('div', 'tx', n.text || ''), el('small', 'chip', fmt(n.ts)), btn('Hapus', 'd', async () => { await remove(ref(db, 'news/' + id)); go('news'); })); list.append(r); });
}

/* ---- database (akses penuh) ---- */
async function tDb(v) {
  const p = el('input'), ta = el('textarea'), keys = el('div', 'keys'), bar = el('div', 'bar'), acts = el('div', 'acts'); p.placeholder = 'Path, contoh: users/UID  (kosong = akar)'; ta.style.minHeight = '300px'; ta.style.fontFamily = 'ui-monospace,Menlo,monospace'; ta.style.fontSize = '12.5px'; ta.spellcheck = false;
  const load = async () => {
    const path = p.value.trim().replace(/^\/+|\/+$/g, ''), x = await val(path);
    ta.value = x == null ? 'null' : JSON.stringify(x, null, 2); keys.replaceChildren();
    if (x && typeof x == 'object') Object.keys(x).slice(0, 120).forEach(k => { const b = el('button', '', k); b.onclick = () => { p.value = (path ? path + '/' : '') + k; load(); }; keys.append(b); });
    if (ta.value.length > 400000) toast('Data besar, hati-hati saat mengedit');
  };
  bar.append(p, btn('Muat', '', load)); 
  acts.append(btn('Simpan perubahan', '', async () => {
    const path = p.value.trim().replace(/^\/+|\/+$/g, ''); let x; try { x = JSON.parse(ta.value); } catch { toast('JSON tidak valid'); return; }
    if (!confirm('Timpa data di "/' + path + '" dengan isi ini?')) return;
    if (!path) { if (x && typeof x == 'object') await update(ref(db), x); else { toast('Akar harus berupa objek'); return; } } else { const a = path.split('/'), k = a.pop(); await update(ref(db, a.join('/')), {[k]: x}); }
    toast('Tersimpan'); load();
  }), btn('Hapus node', 'd', async () => { const path = p.value.trim().replace(/^\/+|\/+$/g, ''); if (!path) { toast('Tidak bisa menghapus akar'); return; } if (!confirm('HAPUS permanen "/' + path + '"?')) return; await remove(ref(db, path)); toast('Dihapus'); load(); }));
  v.replaceChildren(bar, keys, ta, acts); acts.style.marginTop = '12px'; p.onkeydown = e => { if (e.key == 'Enter') load(); }; await load();
}
