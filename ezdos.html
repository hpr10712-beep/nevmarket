<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Detection · Gender & Expression</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a12;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #f0f0ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6ec7, #7b4bff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub {
            color: #8888aa;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .container {
            background: #14141e;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a2a3a;
            max-width: 800px;
            width: 100%;
        }
        video {
            width: 100%;
            border-radius: 16px;
            background: #000;
            display: block;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }
        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }
        .info-item {
            background: #1e1e2e;
            padding: 12px 10px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid #2a2a3e;
        }
        .info-item .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            color: #7777aa;
            letter-spacing: 1px;
        }
        .info-item .value {
            font-size: 1.3rem;
            font-weight: 600;
            margin-top: 4px;
        }
        .info-item .value.gender-male { color: #4fc3f7; }
        .info-item .value.gender-female { color: #f06292; }
        .info-item .value.high { color: #ff6b6b; }
        .info-item .value.medium { color: #ffd93d; }
        .info-item .value.low { color: #6bcb77; }
        .status {
            margin-top: 12px;
            text-align: center;
            color: #8888bb;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .status .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4fc3f7;
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .btn {
            background: #2a2a42;
            border: none;
            color: #f0f0ff;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #3a3a5a;
        }
        .btn:hover {
            background: #3a3a5a;
        }
        .footer {
            margin-top: 20px;
            color: #555577;
            font-size: 0.7rem;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <h1>🎭 Face Detector</h1>
    <div class="sub">Gender · Ekspresi · Arousal (simulasi)</div>

    <div class="container">
        <div class="video-wrapper">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="overlay"></canvas>
        </div>

        <div class="info-panel" id="infoPanel">
            <div class="info-item">
                <div class="label">Jenis Kelamin</div>
                <div class="value" id="genderValue">—</div>
            </div>
            <div class="info-item">
                <div class="label">Ekspresi</div>
                <div class="value" id="expressionValue">—</div>
            </div>
            <div class="info-item">
                <div class="label">Usia</div>
                <div class="value" id="ageValue">—</div>
            </div>
            <div class="info-item">
                <div class="label">Arousal (gairah)</div>
                <div class="value" id="arousalValue">—</div>
            </div>
        </div>

        <div class="status">
            <span class="dot"></span>
            <span id="statusText">Memulai kamera...</span>
        </div>

        <div style="display:flex; justify-content:center; gap:12px; margin-top:12px;">
            <button class="btn" id="toggleCam">⏸ Jeda</button>
            <button class="btn" id="resetBtn">↺ Reset</button>
        </div>
    </div>

    <div class="footer">
        ⚡ Deteksi wajah menggunakan face-api.js · Hanya untuk demonstrasi teknis
    </div>

    <!-- Load face-api.js -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js">
    </script>

    <script>
        (function() {
            'use strict';

            // ─── DOM ────────────────────────────────────────────────
            const video = document.getElementById('video');
            const canvas = document.getElementById('overlay');
            const ctx = canvas.getContext('2d');

            const genderEl = document.getElementById('genderValue');
            const expressionEl = document.getElementById('expressionValue');
            const ageEl = document.getElementById('ageValue');
            const arousalEl = document.getElementById('arousalValue');
            const statusText = document.getElementById('statusText');
            const toggleBtn = document.getElementById('toggleCam');
            const resetBtn = document.getElementById('resetBtn');

            let isStreaming = true;
            let stream = null;
            let detectionInterval = null;

            // ─── Model loading ──────────────────────────────────────
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/models';

            async function loadModels() {
                statusText.textContent = '⏳ Memuat model AI...';
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                await faceapi.nets.ageGenderNet.loadFromUri(MODEL_URL);
                await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
                statusText.textContent = '✅ Model siap, menunggu kamera...';
                return true;
            }

            // ─── Kamera ─────────────────────────────────────────────
            async function startCamera() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'user',
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        },
                        audio: false
                    });
                    video.srcObject = stream;
                    await video.play();
                    statusText.textContent = '📷 Kamera aktif, mendeteksi...';
                    // set canvas size
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    startDetection();
                } catch (err) {
                    statusText.textContent = '❌ Gagal akses kamera: ' + err.message;
                    console.error(err);
                }
            }

            // ─── Deteksi ────────────────────────────────────────────
            function startDetection() {
                if (detectionInterval) clearInterval(detectionInterval);
                detectionInterval = setInterval(async () => {
                    if (!isStreaming) return;
                    if (video.paused || video.ended) return;

                    const detections = await faceapi.detectAllFaces(video,
                            new faceapi.TinyFaceDetectorOptions({
                                inputSize: 224,
                                scoreThreshold: 0.5
                            }))
                        .withFaceLandmarks()
                        .withFaceExpressions()
                        .withAgeAndGender();

                    // draw overlay
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if (detections.length > 0) {
                        // ambil wajah pertama (terbesar)
                        const det = detections[0];
                        const box = det.detection.box;
                        const gender = det.gender;
                        const genderProb = det.genderProbability;
                        const age = det.age;
                        const expressions = det.expressions;
                        // cari ekspresi dominan
                        let maxExpr = 'neutral';
                        let maxScore = 0;
                        for (const [expr, score] of Object.entries(expressions)) {
                            if (score > maxScore) {
                                maxScore = score;
                                maxExpr = expr;
                            }
                        }
                        const exprLabel = maxExpr.charAt(0).toUpperCase() + maxExpr.slice(1);

                        // Update UI
                        genderEl.textContent = gender;
                        genderEl.className = 'value ' + (gender === 'male' ? 'gender-male' : 'gender-female');
                        expressionEl.textContent = exprLabel + ' (' + (maxScore * 100).toFixed(0) + '%)';
                        ageEl.textContent = Math.round(age) + ' th';

                        // Arousal simulation based on expression + gender? (just for fun)
                        // Kita gunakan kombinasi ekspresi: happy, surprised, angry -> high arousal
                        // neutral, sad -> low
                        let arousal = 0.3; // default
                        if (maxExpr === 'happy') arousal = 0.75;
                        else if (maxExpr === 'surprised') arousal = 0.85;
                        else if (maxExpr === 'angry') arousal = 0.7;
                        else if (maxExpr === 'fearful') arousal = 0.6;
                        else if (maxExpr === 'disgusted') arousal = 0.5;
                        else if (maxExpr === 'sad') arousal = 0.2;
                        else if (maxExpr === 'neutral') arousal = 0.3;

                        // tambah variasi dari gender prob (hanya efek)
                        if (genderProb > 0.9) arousal += 0.05;

                        // clamp
                        arousal = Math.min(1, Math.max(0, arousal));

                        let arousalText = (arousal * 100).toFixed(0) + '%';
                        let arousalClass = 'low';
                        if (arousal > 0.7) arousalClass = 'high';
                        else if (arousal > 0.4) arousalClass = 'medium';
                        arousalEl.textContent = arousalText;
                        arousalEl.className = 'value ' + arousalClass;

                        // Draw bounding box
                        ctx.strokeStyle = '#00ffcc';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(box.x, box.y, box.width, box.height);

                        // Label gender + age
                        ctx.fillStyle = '#00ffcc';
                        ctx.font = '16px sans-serif';
                        ctx.fillText(`${gender} (${(genderProb*100).toFixed(0)}%)  ${Math.round(age)}th`, box.x, box.y - 8);

                        // draw landmarks (opsional)
                        const landmarks = det.landmarks.positions;
                        ctx.fillStyle = '#ff66aa';
                        for (const pt of landmarks) {
                            ctx.beginPath();
                            ctx.arc(pt.x, pt.y, 2, 0, 2 * Math.PI);
                            ctx.fill();
                        }

                        statusText.textContent = `👤 Terdeteksi 1 wajah`;

                    } else {
                        // tidak ada wajah
                        genderEl.textContent = '—';
                        genderEl.className = 'value';
                        expressionEl.textContent = '—';
                        ageEl.textContent = '—';
                        arousalEl.textContent = '—';
                        arousalEl.className = 'value';
                        statusText.textContent = '😶 Tidak ada wajah terdeteksi';
                    }
                }, 200);
            }

            // ─── Toggle kamera ──────────────────────────────────────
            function toggleCamera() {
                isStreaming = !isStreaming;
                if (isStreaming) {
                    toggleBtn.textContent = '⏸ Jeda';
                    statusText.textContent = '▶️ Deteksi dilanjutkan';
                    if (stream) {
                        // jika stream paused, resume
                        video.play().catch(() => {});
                    }
                } else {
                    toggleBtn.textContent = '▶️ Lanjut';
                    statusText.textContent = '⏸ Deteksi dijeda';
                    video.pause();
                }
            }

            // ─── Reset ──────────────────────────────────────────────
            function resetDetection() {
                // reload halaman (cara cepat)
                location.reload();
            }

            // ─── Init ───────────────────────────────────────────────
            async function init() {
                await loadModels();
                await startCamera();
                toggleBtn.addEventListener('click', toggleCamera);
                resetBtn.addEventListener('click', resetDetection);

                // handle resize
                window.addEventListener('resize', () => {
                    // canvas size diatur setiap frame deteksi
                });
            }

            // handle jika video size berubah
            video.addEventListener('loadedmetadata', () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            });

            init().catch(err => {
                console.error(err);
                statusText.textContent = '❌ Error: ' + err.message;
            });

        })();
    </script>

</body>
</html>
