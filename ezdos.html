<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Detection · Gender & Expression</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a12;
            font-family: 'Segoe UI', sans-serif;
            color: #f0f0ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ff6ec7, #7b4bff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .sub {
            color: #8888aa;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }
        .container {
            background: #14141e;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a2a3a;
            max-width: 720px;
            width: 100%;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
        }
        video {
            width: 100%;
            display: block;
            border-radius: 14px;
            background: #111;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 14px;
        }
        .info-item {
            background: #1e1e2e;
            padding: 10px 8px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #2a2a3e;
        }
        .info-item .label {
            font-size: 0.55rem;
            text-transform: uppercase;
            color: #7777aa;
            letter-spacing: 0.8px;
        }
        .info-item .value {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 3px;
        }
        .value.male {
            color: #4fc3f7;
        }
        .value.female {
            color: #f06292;
        }
        .value.high {
            color: #ff6b6b;
        }
        .value.medium {
            color: #ffd93d;
        }
        .value.low {
            color: #6bcb77;
        }
        .status {
            margin-top: 12px;
            text-align: center;
            color: #8888bb;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4fc3f7;
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .btn {
            background: #2a2a42;
            border: none;
            color: #f0f0ff;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #3a3a5a;
            font-size: 0.8rem;
        }
        .btn:hover {
            background: #3a3a5a;
        }
        .btn-danger {
            background: #5a2a2a;
            border-color: #7a3a3a;
        }
        .btn-danger:hover {
            background: #7a3a3a;
        }
        .footer {
            margin-top: 16px;
            color: #555577;
            font-size: 0.65rem;
            text-align: center;
        }
        .error-box {
            background: #2a1a1a;
            border: 1px solid #6a3a3a;
            border-radius: 12px;
            padding: 12px;
            color: #ff8a8a;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }
        .error-box.show {
            display: block;
        }
        .loading-text {
            color: #aaaadd;
            font-size: 0.9rem;
            text-align: center;
            padding: 20px 0;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <h1>🎭 Face Detector</h1>
    <div class="sub">Gender · Ekspresi · Arousal (simulasi)</div>

    <div class="container">
        <div class="video-wrapper">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="overlay"></canvas>
        </div>

        <div class="info-grid" id="infoGrid">
            <div class="info-item">
                <div class="label">Jenis Kelamin</div>
                <div class="value" id="genderVal">—</div>
            </div>
            <div class="info-item">
                <div class="label">Ekspresi</div>
                <div class="value" id="exprVal">—</div>
            </div>
            <div class="info-item">
                <div class="label">Usia</div>
                <div class="value" id="ageVal">—</div>
            </div>
            <div class="info-item">
                <div class="label">Arousal</div>
                <div class="value" id="arousalVal">—</div>
            </div>
        </div>

        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Memulai...</span>
        </div>

        <div class="error-box" id="errorBox">
            <strong>⚠️ Error:</strong> <span id="errorMsg"></span>
        </div>

        <div class="btn-group">
            <button class="btn" id="toggleBtn">⏸ Jeda</button>
            <button class="btn btn-danger" id="resetBtn">↺ Reset</button>
        </div>
    </div>

    <div class="footer">
        ⚡ face-api.js · Semua pemrosesan di sisi klien · Data tidak dikirim ke server
    </div>

    <!-- Load face-api.js dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js">
    </script>

    <script>
        (function() {
            'use strict';

            // ─── DOM ────────────────────────────────────────────────
            const video = document.getElementById('video');
            const canvas = document.getElementById('overlay');
            const ctx = canvas.getContext('2d');

            const genderVal = document.getElementById('genderVal');
            const exprVal = document.getElementById('exprVal');
            const ageVal = document.getElementById('ageVal');
            const arousalVal = document.getElementById('arousalVal');
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');
            const errorBox = document.getElementById('errorBox');
            const errorMsg = document.getElementById('errorMsg');
            const toggleBtn = document.getElementById('toggleBtn');
            const resetBtn = document.getElementById('resetBtn');

            let isStreaming = true;
            let stream = null;
            let detectionInterval = null;
            let modelsLoaded = false;

            // ─── Tampilkan error ────────────────────────────────────
            function showError(msg) {
                errorBox.classList.add('show');
                errorMsg.textContent = msg;
                statusText.textContent = '❌ Error';
                statusDot.style.animation = 'none';
                statusDot.style.background = '#ff6b6b';
            }

            function hideError() {
                errorBox.classList.remove('show');
            }

            // ─── Model loading ──────────────────────────────────────
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/models';

            async function loadModels() {
                try {
                    statusText.textContent = '⏳ Memuat model AI (5-15 detik)...';
                    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                    await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                    await faceapi.nets.ageGenderNet.loadFromUri(MODEL_URL);
                    await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
                    modelsLoaded = true;
                    statusText.textContent = '✅ Model siap, menunggu kamera...';
                    hideError();
                    return true;
                } catch (err) {
                    showError('Gagal memuat model: ' + err.message + '. Periksa koneksi internet.');
                    console.error(err);
                    return false;
                }
            }

            // ─── Kamera ─────────────────────────────────────────────
            async function startCamera() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 360 } },
                        audio: false
                    });
                    video.srcObject = stream;
                    await video.play();
                    // set canvas ukuran video
                    const w = video.videoWidth || 480;
                    const h = video.videoHeight || 360;
                    canvas.width = w;
                    canvas.height = h;
                    statusText.textContent = '📷 Kamera aktif, mendeteksi...';
                    hideError();
                    startDetection();
                } catch (err) {
                    showError('Gagal akses kamera: ' + err.message + '. Izinkan akses kamera di browser.');
                    console.error(err);
                }
            }

            // ─── Deteksi ────────────────────────────────────────────
            function startDetection() {
                if (detectionInterval) clearInterval(detectionInterval);
                detectionInterval = setInterval(async () => {
                    if (!isStreaming || !modelsLoaded) return;
                    if (video.paused || video.ended) return;

                    try {
                        const detections = await faceapi.detectAllFaces(video,
                                new faceapi.TinyFaceDetectorOptions({
                                    inputSize: 224,
                                    scoreThreshold: 0.5
                                }))
                            .withFaceLandmarks()
                            .withFaceExpressions()
                            .withAgeAndGender();

                        ctx.clearRect(0, 0, canvas.width, canvas.height);

                        if (detections.length === 0) {
                            genderVal.textContent = '—';
                            genderVal.className = 'value';
                            exprVal.textContent = '—';
                            ageVal.textContent = '—';
                            arousalVal.textContent = '—';
                            arousalVal.className = 'value';
                            statusText.textContent = '😶 Tidak ada wajah';
                            return;
                        }

                        // ambil wajah pertama
                        const det = detections[0];
                        const box = det.detection.box;
                        const gender = det.gender;
                        const genderProb = det.genderProbability;
                        const age = det.age;
                        const expressions = det.expressions;

                        // ekspresi dominan
                        let maxExpr = 'neutral';
                        let maxScore = 0;
                        for (const [expr, score] of Object.entries(expressions)) {
                            if (score > maxScore) { maxScore = score;
                                maxExpr = expr; }
                        }
                        const exprLabel = maxExpr.charAt(0).toUpperCase() + maxExpr.slice(1);

                        // Update UI
                        genderVal.textContent = gender.charAt(0).toUpperCase() + gender.slice(1);
                        genderVal.className = 'value ' + gender;

                        exprVal.textContent = exprLabel + ' (' + (maxScore * 100).toFixed(0) + '%)';
                        ageVal.textContent = Math.round(age) + ' th';

                        // Arousal simulasi dari ekspresi
                        let arousal = 0.3;
                        if (maxExpr === 'happy') arousal = 0.75;
                        else if (maxExpr === 'surprised') arousal = 0.85;
                        else if (maxExpr === 'angry') arousal = 0.7;
                        else if (maxExpr === 'fearful') arousal = 0.6;
                        else if (maxExpr === 'disgusted') arousal = 0.5;
                        else if (maxExpr === 'sad') arousal = 0.2;
                        else if (maxExpr === 'neutral') arousal = 0.3;
                        arousal = Math.min(1, Math.max(0, arousal));

                        let arousalText = (arousal * 100).toFixed(0) + '%';
                        let arousalClass = 'low';
                        if (arousal > 0.7) arousalClass = 'high';
                        else if (arousal > 0.4) arousalClass = 'medium';
                        arousalVal.textContent = arousalText;
                        arousalVal.className = 'value ' + arousalClass;

                        // Gambar bounding box
                        ctx.strokeStyle = '#00ffcc';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(box.x, box.y, box.width, box.height);

                        ctx.fillStyle = '#00ffcc';
                        ctx.font = '14px sans-serif';
                        ctx.fillText(`${gender} (${(genderProb*100).toFixed(0)}%)  ${Math.round(age)}th`, box.x, box.y - 8);

                        // landmark
                        ctx.fillStyle = '#ff66aa';
                        for (const pt of det.landmarks.positions) {
                            ctx.beginPath();
                            ctx.arc(pt.x, pt.y, 2, 0, 2 * Math.PI);
                            ctx.fill();
                        }

                        statusText.textContent = '👤 Deteksi aktif';
                        hideError();

                    } catch (err) {
                        console.warn('Detection error:', err);
                        // jangan tampilkan error ke user, hanya log
                    }
                }, 180);
            }

            // ─── Toggle ─────────────────────────────────────────────
            function toggleCamera() {
                isStreaming = !isStreaming;
                if (isStreaming) {
                    toggleBtn.textContent = '⏸ Jeda';
                    statusText.textContent = '▶️ Deteksi dilanjutkan';
                    video.play().catch(() => {});
                } else {
                    toggleBtn.textContent = '▶️ Lanjut';
                    statusText.textContent = '⏸ Deteksi dijeda';
                    video.pause();
                }
            }

            // ─── Reset ──────────────────────────────────────────────
            function resetAll() {
                if (detectionInterval) clearInterval(detectionInterval);
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                }
                video.srcObject = null;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                genderVal.textContent = '—';
                genderVal.className = 'value';
                exprVal.textContent = '—';
                ageVal.textContent = '—';
                arousalVal.textContent = '—';
                arousalVal.className = 'value';
                statusText.textContent = '↺ Mereset...';
                setTimeout(() => {
                    location.reload();
                }, 500);
            }

            // ─── Init ───────────────────────────────────────────────
            async function init() {
                const loaded = await loadModels();
                if (!loaded) {
                    // coba sekali lagi dengan delay
                    setTimeout(async () => {
                        await loadModels();
                        if (modelsLoaded) startCamera();
                    }, 3000);
                    return;
                }
                await startCamera();
                toggleBtn.addEventListener('click', toggleCamera);
                resetBtn.addEventListener('click', resetAll);

                // resize canvas saat video berubah
                video.addEventListener('loadedmetadata', () => {
                    canvas.width = video.videoWidth || 480;
                    canvas.height = video.videoHeight || 360;
                });
            }

            init().catch(err => {
                showError('Init error: ' + err.message);
                console.error(err);
            });

        })();
    </script>

</body>
</html>
