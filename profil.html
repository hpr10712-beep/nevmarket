<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Saya - NEV Market</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script type="importmap">
        {
            "imports": {
                "firebase-app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase-database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
            }
        }
    </script>

    <style>
        /* ============================================================
           RESET
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a2e0a;
            --bg-secondary: #051405;
            --bg-card: rgba(10, 46, 10, 0.88);
            --border-color: rgba(239, 178, 44, 0.18);
            --text-primary: #ffffff;
            --text-secondary: #b8d9b8;
            --text-muted: rgba(255, 255, 255, 0.4);
            --accent-gold: #efb22c;
            --accent-emerald: #00b894;
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.5);
            --radius-lg: 20px;
            --radius-md: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f3b0f;
            background-image:
                repeating-linear-gradient(90deg,
                    rgba(34, 120, 34, 0.45) 0px,
                    rgba(34, 120, 34, 0.45) 55px,
                    rgba(20, 80, 20, 0.45) 55px,
                    rgba(20, 80, 20, 0.45) 110px),
                radial-gradient(ellipse at 50% 0%, rgba(0, 0, 0, 0.0) 60%, rgba(0, 0, 0, 0.35) 100%),
                linear-gradient(180deg, #0f3b0f 0%, #0a2a0a 100%);
            background-size: 100% 100%, 100% 100%, 100% 100%;
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        /* Dekorasi lapangan */
        body::before {
            content: '';
            position: fixed;
            top: 5%;
            left: 5%;
            right: 5%;
            bottom: 5%;
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
           NAVBAR
           ============================================================ */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 12px 0;
            background: rgba(5, 20, 5, 0.88);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
        }
        .navbar .container-nav {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-brand {
            font-size: 1.4rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            text-decoration: none;
        }
        .nav-brand i {
            color: var(--accent-gold);
        }
        .brand-name {
            background: linear-gradient(135deg, #ffffff, #f7d875, #efb22c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
            list-style: none;
        }
        .nav-links a {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
            transition: var(--transition);
            position: relative;
            text-decoration: none;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-gold);
            transition: var(--transition);
        }
        .nav-links a:hover {
            color: var(--text-primary);
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        .nav-hamburger {
            display: none;
            font-size: 1.4rem;
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 64px;
                left: 0;
                right: 0;
                background: rgba(5, 20, 5, 0.98);
                padding: 20px 24px;
                gap: 14px;
                border-bottom: 1px solid var(--border-color);
            }
            .nav-links.open {
                display: flex;
            }
            .nav-hamburger {
                display: block;
            }
        }

        /* ============================================================
           PROFIL HEADER
           ============================================================ */
        .profile-header {
            margin-top: 80px;
            padding: 24px 0 16px;
            text-align: center;
        }

        /* ===== AVATAR DENGAN EFEK PULSE GLOW ===== */
        .profile-avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-gold), #f7d875);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 800;
            color: #0a2a0a;
            box-shadow: 0 0 0 4px rgba(239, 178, 44, 0.15), 0 8px 28px rgba(239, 178, 44, 0.15);
            margin-bottom: 6px;
            transition: var(--transition);
            animation: pulseGlow 2.5s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 0 4px rgba(239, 178, 44, 0.15), 0 8px 28px rgba(239, 178, 44, 0.15);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(239, 178, 44, 0.30), 0 8px 40px rgba(239, 178, 44, 0.30);
            }
            100% {
                box-shadow: 0 0 0 4px rgba(239, 178, 44, 0.15), 0 8px 28px rgba(239, 178, 44, 0.15);
            }
        }

        .profile-avatar i {
            font-size: 2.6rem;
            color: #0a2a0a;
        }

        .profile-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.3px;
        }

        .profile-id {
            font-size: 0.7rem;
            font-family: 'Courier New', monospace;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 16px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .profile-id i {
            margin-right: 6px;
            color: var(--accent-gold);
        }

        /* ===== TYPING SAPAAN ===== */
        .typing-greeting {
            font-size: 1.05rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-top: 6px;
            min-height: 2rem;
            letter-spacing: 0.2px;
        }
        .typing-greeting .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1rem;
            background: var(--accent-gold);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.8s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ============================================================
           KARTU FORM
           ============================================================ */
        .form-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 32px 34px 28px;
            box-shadow: var(--shadow-lg);
            margin: 8px 0 28px;
        }

        .form-card .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 14px;
            margin-bottom: 24px;
        }
        .form-card .card-head .title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-card .card-head .title i {
            font-size: 1rem;
        }
        .form-card .card-head .status {
            font-size: 0.7rem;
            font-weight: 500;
            padding: 4px 14px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-card .card-head .status i {
            font-size: 0.5rem;
        }
        .form-card .card-head .status.complete {
            color: #6dd5b8;
        }
        .form-card .card-head .status.incomplete {
            color: #ff6b6b;
        }

        /* ===== FORM — TANPA ICON & TANPA ASTERISK MERAH ===== */
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.85rem;
            margin-bottom: 4px;
        }
        .form-group label .optional {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 0.7rem;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 11px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            transition: var(--transition);
            outline: none;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--accent-gold);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(239, 178, 44, 0.06);
        }
        .form-group textarea {
            min-height: 72px;
            resize: vertical;
        }

        /* Grid 2 kolom untuk WA & Email */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* ===== TOMBOL SIMPAN ===== */
        .btn-save {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--accent-gold), #f7d875);
            color: #0a2a0a;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.3px;
        }
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(239, 178, 44, 0.35);
        }
        .btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-save i {
            font-size: 0.95rem;
        }

        /* ===== TOMBOL KEMBALI — DIPERBESAR ===== */
        .back-row {
            text-align: center;
            margin-bottom: 32px;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 32px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: var(--transition);
        }
        .btn-back:hover {
            border-color: var(--accent-gold);
            color: #fff;
            background: rgba(239, 178, 44, 0.08);
            transform: translateX(-4px);
        }
        .btn-back i {
            color: var(--accent-gold);
            font-size: 1rem;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 10px 26px;
            border-radius: 60px;
            box-shadow: var(--shadow-lg);
            z-index: 99999;
            display: none;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(16px);
            opacity: 0;
            transition: all 0.35s ease;
            font-weight: 500;
            font-size: 0.9rem;
            color: #fff;
        }
        .toast.show {
            display: flex;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast i {
            font-size: 1rem;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 600px) {
            .form-card {
                padding: 22px 18px 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .profile-avatar {
                width: 72px;
                height: 72px;
                font-size: 1.8rem;
            }
            .profile-avatar i {
                font-size: 2rem;
            }
            .profile-name {
                font-size: 1.4rem;
            }
            .form-card .card-head {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .btn-back {
                padding: 10px 24px;
                font-size: 0.9rem;
            }
            .typing-greeting {
                font-size: 0.9rem;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 0 14px;
            }
            .form-card {
                padding: 18px 14px 16px;
            }
            .btn-back {
                padding: 8px 18px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    NAVBAR — URUTAN: Berita, Produk, Profil, Jasa, Tentang
    ============================================================ -->
    <nav class="navbar">
        <div class="container-nav">
            <a href="index.html" class="nav-brand">
                <i class="fas fa-crown"></i>
                <span class="brand-name">NEV Market</span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html#berita">Berita</a></li>
                <li><a href="produk.html">Produk</a></li>
                <li><a href="profil-user.html" style="color:var(--accent-gold);">Profil</a></li>
                <li><a href="jasa.html">Jasa</a></li>
                <li><a href="tentang.html">Tentang</a></li>
            </ul>
            <button class="nav-hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
        </div>
    </nav>

    <!-- ============================================================
    PROFIL HEADER
    ============================================================ -->
    <div class="profile-header">
        <div class="container">
            <div class="profile-avatar" id="avatarDisplay">
                <i class="fas fa-user"></i>
            </div>
            <div class="profile-name" id="displayName">Pengguna</div>
            <!-- TYPING GREETING -->
            <div class="typing-greeting" id="typingGreeting"></div>
            <div class="profile-id" id="deviceIdDisplay">
                <i class="fas fa-microchip"></i> ID: memuat...
            </div>
        </div>
    </div>

    <!-- ============================================================
    FORM
    ============================================================ -->
    <div class="container">
        <div class="form-card">
            <div class="card-head">
                <div class="title">
                    <i class="fas fa-user-edit"></i> Data Diri
                </div>
                <div class="status incomplete" id="statusBadge">
                    <i class="fas fa-circle"></i> Belum lengkap
                </div>
            </div>

            <form id="profileForm" autocomplete="off">
                <!-- Nama Panggilan (tanpa *) -->
                <div class="form-group">
                    <label>Nama Panggilan</label>
                    <input type="text" id="nama" placeholder="Masukkan nama panggilan Anda" required />
                </div>

                <!-- Row: WA + Email (WA tanpa *) -->
                <div class="form-row">
                    <div class="form-group">
                        <label>WhatsApp</label>
                        <input type="tel" id="wa" placeholder="0812-3456-7890" required />
                    </div>
                    <div class="form-group">
                        <label>Email <span class="optional">(opsional)</span></label>
                        <input type="email" id="email" placeholder="email@example.com" />
                    </div>
                </div>

                <!-- Catatan -->
                <div class="form-group">
                    <label>Catatan <span class="optional">(opsional)</span></label>
                    <textarea id="catatan" placeholder="Informasi tambahan untuk admin..."></textarea>
                </div>

                <button type="submit" class="btn-save" id="btnSimpan">
                    <i class="fas fa-save"></i> Simpan Profil
                </button>
            </form>
        </div>

        <!-- Kembali (diperbesar) -->
        <div class="back-row">
            <a href="index.html" class="btn-back">
                <i class="fas fa-arrow-left"></i> Kembali ke Beranda
                <i class="fas fa-home" style="color:var(--accent-gold);margin-left:4px;"></i>
            </a>
        </div>
    </div>

    <!-- ============================================================
    TOAST
    ============================================================ -->
    <div class="toast" id="toast">
        <i class="fas fa-info-circle"></i>
        <span id="toastMsg">Pesan</span>
    </div>

    <!-- ============================================================
    SCRIPT
    ============================================================ -->
    <script type="module">
        import { initializeApp } from "firebase-app";
        import { getDatabase, ref, onValue, update } from "firebase-database";

        const firebaseConfig = {
            apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8",
            authDomain: "mybro-9ba5f.firebaseapp.com",
            databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com/",
            projectId: "mybro-9ba5f"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ===== DEVICE ID =====
        function getDeviceId() {
            let id = localStorage.getItem('logoShop_deviceId');
            if (!id) {
                id = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
                localStorage.setItem('logoShop_deviceId', id);
            }
            return id;
        }
        const DEVICE_ID = getDeviceId();
        document.getElementById('deviceIdDisplay').innerHTML =
            '<i class="fas fa-microchip"></i> ID: ' + DEVICE_ID.slice(0, 14) + '…';

        // ===== TOAST =====
        function showToast(msg, type = 'info') {
            const t = document.getElementById('toast');
            const m = document.getElementById('toastMsg');
            const icon = t.querySelector('i');
            icon.className = 'fas fa-' + (type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle');
            t.className = 'toast show ' + type;
            m.textContent = msg;
            clearTimeout(t._hide);
            t._hide = setTimeout(() => { t.classList.remove('show'); }, 4000);
        }

        // ===== HAMBURGER =====
        document.getElementById('hamburger').addEventListener('click', () => {
            document.getElementById('navLinks').classList.toggle('open');
        });

        // ===== ELEMEN =====
        const form = document.getElementById('profileForm');
        const btnSimpan = document.getElementById('btnSimpan');
        const statusBadge = document.getElementById('statusBadge');
        const avatarDisplay = document.getElementById('avatarDisplay');
        const typingEl = document.getElementById('typingGreeting');

        const fields = {
            nama: document.getElementById('nama'),
            wa: document.getElementById('wa'),
            email: document.getElementById('email'),
            catatan: document.getElementById('catatan')
        };
        const displayName = document.getElementById('displayName');

        // ===== ANIMASI TYPING =====
        function typeGreeting(text, callback) {
            typingEl.innerHTML = '';
            let index = 0;
            const cursorSpan = document.createElement('span');
            cursorSpan.className = 'cursor';
            const interval = setInterval(() => {
                if (index < text.length) {
                    typingEl.innerHTML = text.substring(0, index + 1) + ' ';
                    // tambahkan cursor
                    const cursor = typingEl.querySelector('.cursor');
                    if (!cursor) {
                        const newCursor = document.createElement('span');
                        newCursor.className = 'cursor';
                        typingEl.appendChild(newCursor);
                    }
                    index++;
                } else {
                    clearInterval(interval);
                    // pastikan cursor tetap ada
                    if (!typingEl.querySelector('.cursor')) {
                        const c = document.createElement('span');
                        c.className = 'cursor';
                        typingEl.appendChild(c);
                    }
                    if (callback) callback();
                }
            }, 50);
        }

        // ===== UPDATE UI =====
        function updateUI(data) {
            const nama = data.nama || 'Pengguna';
            displayName.textContent = nama;

            // Avatar
            if (nama && nama !== 'Pengguna') {
                avatarDisplay.textContent = nama.charAt(0).toUpperCase();
                avatarDisplay.style.fontSize = '2.2rem';
                avatarDisplay.style.fontWeight = '800';
            } else {
                avatarDisplay.innerHTML = '<i class="fas fa-user"></i>';
                avatarDisplay.style.fontSize = '2.6rem';
                avatarDisplay.style.fontWeight = 'normal';
            }

            // Status badge
            const isComplete = data.nama && data.wa;
            if (isComplete) {
                statusBadge.className = 'status complete';
                statusBadge.innerHTML = '<i class="fas fa-check-circle"></i> Lengkap';
            } else {
                statusBadge.className = 'status incomplete';
                statusBadge.innerHTML = '<i class="fas fa-circle"></i> Belum lengkap';
            }

            // Typing greeting (hanya jika nama berubah atau pertama kali)
            const greetingText = nama !== 'Pengguna'
                ? `Halo, ${nama}! Selamat datang kembali.`
                : 'Selamat datang! Lengkapi profilmu.';
            typeGreeting(greetingText);
        }

        // ===== LOAD DATA =====
        const userRef = ref(db, `logo-shop/users/${DEVICE_ID}`);
        onValue(userRef, (snap) => {
            const data = snap.val() || {};
            fields.nama.value = data.nama || '';
            fields.wa.value = data.wa || '';
            fields.email.value = data.email || '';
            fields.catatan.value = data.catatan || '';
            updateUI(data);
        });

        // ===== SIMPAN =====
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnSimpan.disabled = true;
            btnSimpan.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

            const data = {
                nama: fields.nama.value.trim(),
                wa: fields.wa.value.trim(),
                email: fields.email.value.trim(),
                catatan: fields.catatan.value.trim(),
                lastUpdate: new Date().toISOString()
            };

            // Validasi wajib (tanpa asterisk di UI)
            if (!data.nama || !data.wa) {
                showToast('Nama dan WhatsApp wajib diisi!', 'error');
                btnSimpan.disabled = false;
                btnSimpan.innerHTML = '<i class="fas fa-save"></i> Simpan Profil';
                return;
            }

            try {
                await update(ref(db, `logo-shop/users/${DEVICE_ID}`), data);
                showToast('Profil berhasil disimpan!', 'success');
                updateUI(data);
            } catch (err) {
                showToast('Gagal: ' + err.message, 'error');
            }

            btnSimpan.disabled = false;
            btnSimpan.innerHTML = '<i class="fas fa-save"></i> Simpan Profil';
        });

        
    </script>
</body>
</html>
