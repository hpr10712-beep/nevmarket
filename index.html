<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06140f">
<title>Agent HaloKita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=Unbounded:wght@500..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06140f;--s1:#0b1f17;--s2:#12301f;--ln:rgba(214,255,190,.11);--tx:#eef5e1;--sub:#86a392;--hl:#c9f73a;--acc:#c9f73a;--on-acc:#06140f;--co:#ff6b57;--rcv:#26332d;
--fd:"Unbounded",system-ui,sans-serif;--fb:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme=light]{--bg:#ecf2e0;--s1:#f8fbf0;--s2:#dfe8cf;--ln:rgba(10,32,22,.13);--tx:#0a2016;--sub:#526a59;--acc:#0a2016;--on-acc:#c9f73a;--hl:#3d6b00;--rcv:#fff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{font:500 15px/1.4 var(--fb);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:active{transform:scale(.96)}
button:disabled{opacity:.5}
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
small{color:var(--sub);font-size:12.5px;font-weight:600}
.err{color:var(--co);font-size:13px;font-weight:600;min-height:16px}
.vb{display:inline-block;width:17px;height:17px;vertical-align:-3px;margin-left:3px}
.vb svg{width:100%;height:100%}

/* login */
#login{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:var(--bg);overflow:auto}
.lbox{width:100%;max-width:360px;display:grid;gap:12px}
.logo{width:76px;height:76px;margin:0 auto;border-radius:50%;background:var(--hl);display:grid;place-items:center}
.logo svg{width:56px;height:56px}
.lbox h1{font:800 26px/1.1 var(--fd);letter-spacing:-.04em;text-align:center}
.lbox>small{text-align:center;line-height:1.5}
.field{width:100%;border:1.5px solid var(--ln);background:var(--s1);border-radius:16px;padding:13px 14px;outline:none}
.field:focus{border-color:var(--hl)}
.btn{width:100%;background:var(--acc);color:var(--on-acc);border-radius:16px;padding:13px;font-weight:800;text-align:center}
.btn.g{background:var(--s2);color:var(--tx)}
.lnk{font-weight:700;color:var(--hl);text-align:center;padding:6px;cursor:pointer}

/* app */
#app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--ln);background:var(--s1)}
.logo.sm{width:44px;height:44px;flex:none}
.logo.sm svg{width:32px;height:32px}
.top .mid{flex:1;min-width:0}
.top b{font:800 16px var(--fd);letter-spacing:-.03em;display:flex;align-items:center;flex-wrap:wrap}
.top small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.out{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--co)}
.tabs{display:flex;gap:6px;padding:8px 12px;background:var(--s1);border-bottom:1px solid var(--ln)}
.tabs button{flex:1;padding:9px;border-radius:14px;font-weight:700;font-size:13.5px;color:var(--sub);background:var(--s2)}
.tabs button.on{background:var(--acc);color:var(--on-acc)}
.pg{display:none;flex:1;min-height:0;flex-direction:column;overflow:auto}
.pg.on{display:flex}

/* chat */
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;background:radial-gradient(60% 30% at 100% 0,rgba(201,247,58,.12),transparent 70%),var(--bg)}
.m{max-width:80%;padding:8px 13px 7px;border-radius:19px;white-space:pre-wrap;word-break:break-word;font-size:15.5px;line-height:1.38}
.m i{font:600 10.5px var(--fb);font-style:normal;opacity:.7;float:right;margin:8px 0 0 10px}
.me{align-self:flex-end;background:linear-gradient(180deg,#25ad66,#16874c);color:#fff;border-bottom-right-radius:6px}
.ot{align-self:flex-start;background:var(--rcv);color:var(--tx);border-bottom-left-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tk{display:inline-block;margin-left:3px;vertical-align:-3px;line-height:0}
.tk .i{width:15px;height:15px;stroke-width:2.6}
.day{align-self:center;font-size:12px;color:var(--sub);background:var(--s2);border-radius:999px;padding:4px 12px;margin:6px 0}
.cp{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);background:var(--s1);align-items:center}
.cp input{flex:1;min-width:0;border:1.5px solid var(--ln);background:var(--s2);border-radius:999px;padding:12px 16px;outline:none}
.cp input:focus{border-color:var(--hl)}
.send{width:46px;height:46px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;flex:none}

/* broadcast & status */
.list{padding:12px;display:grid;gap:10px}
.box{margin:12px 12px 0;padding:14px;border-radius:20px;background:var(--s1);border:1px solid var(--ln);display:grid;gap:10px}
.box textarea{width:100%;border:1.5px solid var(--ln);background:var(--s2);border-radius:14px;padding:11px 13px;resize:none;outline:none}
.card{display:grid;gap:8px;padding:14px;border-radius:20px;background:var(--s1);border:1px solid var(--ln)}
.card .hd{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px}
.card p{white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.45;font-weight:600}
.card .ft{display:flex;align-items:center;justify-content:space-between;gap:8px}
.del{font-weight:700;color:var(--co);font-size:13px;padding:6px 10px;border-radius:10px;background:var(--s2)}
.lb{padding:28px 20px;text-align:center;color:var(--sub);line-height:1.5}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--hl);color:var(--on-acc);font-weight:800;padding:10px 18px;border-radius:999px;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none;max-width:84%;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>

<div id="login" hidden>
  <div class="lbox">
    <div class="logo"><svg viewBox="0 0 48 48"><circle cx="24" cy="22" r="19" fill="#06140f"/><path d="M9 32.5 5.5 44.5l12-5.5z" fill="#06140f"/><circle cx="17.5" cy="19.5" r="2.6" fill="#c9f73a"/><circle cx="30.5" cy="19.5" r="2.6" fill="#c9f73a"/><path d="M16 27c2 3.2 4.6 4.8 8 4.8s6-1.6 8-4.8" fill="none" stroke="#c9f73a" stroke-width="3.2" stroke-linecap="round"/></svg></div>
    <h1>Agent HaloKita</h1>
    <small>Masuk dulu untuk mengirim pesan, broadcast, dan status.</small>
    <button class="btn g" id="gBtn">Masuk dengan Google</button>
    <small style="text-align:center">atau</small>
    <input class="field" id="eIn" type="email" placeholder="Email" autocomplete="email">
    <input class="field" id="pIn" type="password" placeholder="Kata sandi (min. 6 karakter)" autocomplete="current-password">
    <input class="field" id="nIn" placeholder="Nama tampilan (khusus daftar)" maxlength="24" hidden>
    <div class="err" id="lErr"></div>
    <button class="btn" id="eGo">Masuk</button>
    <div class="lnk" id="eTg">Belum punya akun? Daftar</div>
  </div>
</div>

<div id="app" hidden>
  <div class="top">
    <div class="logo sm"><svg viewBox="0 0 48 48"><circle cx="24" cy="22" r="19" fill="#06140f"/><path d="M9 32.5 5.5 44.5l12-5.5z" fill="#06140f"/><circle cx="17.5" cy="19.5" r="2.6" fill="#c9f73a"/><circle cx="30.5" cy="19.5" r="2.6" fill="#c9f73a"/><path d="M16 27c2 3.2 4.6 4.8 8 4.8s6-1.6 8-4.8" fill="none" stroke="#c9f73a" stroke-width="3.2" stroke-linecap="round"/></svg></div>
    <div class="mid">
      <b>Agent HaloKita<span class="vb" id="vbTop"></span></b>
      <small id="whoTxt"></small>
    </div>
    <button class="out" id="outBtn" aria-label="Keluar"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
  </div>
  <div class="tabs">
    <button class="on" data-p="pChat">Chat</button>
    <button data-p="pBc">Broadcast</button>
    <button data-p="pSt">Status</button>
  </div>

  <section class="pg on" id="pChat">
    <div id="msgs" style="flex:1;display:flex;flex-direction:column;overflow-y:auto;padding:14px 12px;gap:6px;background:var(--bg)"></div>
    <div class="cp">
      <input id="mi" placeholder="Tulis pesan ke Agent" maxlength="1000" autocomplete="off">
      <button class="send" id="sd" aria-label="Kirim"><svg class="i" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
    </div>
  </section>

  <section class="pg" id="pBc">
    <div class="box">
      <small>Broadcast akan tampil di semua pengguna yang membuka aplikasi.</small>
      <textarea id="bcT" rows="3" maxlength="1000" placeholder="Tulis pengumuman..."></textarea>
      <button class="btn" id="bcS">Kirim broadcast</button>
      <div class="err" id="bcE"></div>
    </div>
    <div class="list" id="bcList"></div>
  </section>

  <section class="pg" id="pSt">
    <div class="box">
      <small>Status tampil di semua pengguna selama 24 jam. Status baru menggantikan status sebelumnya.</small>
      <textarea id="stT" rows="2" maxlength="140" placeholder="Contoh: Agent online, siap bantu"></textarea>
      <button class="btn" id="stS">Bagikan status</button>
      <div class="err" id="stE"></div>
    </div>
    <div class="list" id="stList"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,setPersistence,browserSessionPersistence,getRedirectResult,onAuthStateChanged,signInWithPopup,signInWithRedirect,GoogleAuthProvider,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,push,onValue,update,query,limitToLast,serverTimestamp,get,remove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyBEPzUM9EresZ-yvphzDusVs7AUqdLuCNQ",
  authDomain: "mygame-68b24.firebaseapp.com",
  databaseURL: "https://mygame-68b24-default-rtdb.firebaseio.com",
  projectId: "mygame-68b24",
  storageBucket: "mygame-68b24.firebasestorage.app",
  messagingSenderId: "1003182873390",
  appId: "1:1003182873390:web:aabf3248f759cbc9d678bf"
}, "agent");
const auth = getAuth(app), db = getDatabase(app);
const $ = s => document.querySelector(s);
const SLIFE = 864e5;
let U = null, NAME = "", chatOff = [], seenMsg = new Set(), lastDay = "", started = false;

const CHECK = '<svg class="i" viewBox="0 0 24 24"><path d="M1.5 12.5 7 18 17.5 7"/><path d="M10 16.5l1.5 1.5L22 7"/></svg>';

function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 2200); }
const ago = t => { const m = Math.max(0, Math.floor((Date.now() - t) / 6e4)); return m < 1 ? "baru saja" : m < 60 ? m + " menit lalu" : Math.floor(m / 60) + " jam lalu"; };
const tm = t => t ? new Date(t).toLocaleTimeString("id-ID", {hour: "2-digit", minute: "2-digit"}) : "";
const alive = s => !!(s && s.text && typeof s.ts == "number" && Date.now() - s.ts < SLIFE);
const busy = (b, on) => b.disabled = on;
const VERIFIED = '<svg viewBox="0 0 24 24" width="17" height="17"><path d="M22.5 12 21 13.5 22 15 20.5 16.5 19 17 17.5 18.5 16 18 14.5 19.5 12 19 9.5 19.5 8 18 6.5 17 5 16.5 4 15 3 13.5 4 12 3 10.5 4 9 5 7.5 6.5 6.5 8 6 9.5 4.5 12 5 14.5 4.5 16 6 17.5 6.5 19 7.5 20.5 9 21 10.5 20.5 12 22 13.5Z" fill="#1d9bf0"/><path d="m7.8 12.4 3 3 5.6-6.2" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- Login: sesi hanya bertahan selama tab terbuka ---------- */
await setPersistence(auth, browserSessionPersistence);
// Kalau baru kembali dari login Google (redirect), biarkan masuk.
// Selain itu, hapus sesi lama agar halaman login selalu muncul.
const redir = await getRedirectResult(auth).catch(() => null);
if (!redir?.user) await signOut(auth).catch(() => {});
$("#login").hidden = false;

let daftar = false;
$("#eTg").onclick = () => {
  daftar = !daftar;
  $("#nIn").hidden = !daftar;
  $("#eGo").textContent = daftar ? "Daftar" : "Masuk";
  $("#eTg").textContent = daftar ? "Sudah punya akun? Masuk" : "Belum punya akun? Daftar";
  $("#lErr").textContent = "";
};
$("#eGo").onclick = async () => {
  const e = $("#eIn").value.trim(), p = $("#pIn").value, n = $("#nIn").value.trim().slice(0, 24);
  $("#lErr").textContent = "";
  if (!e || p.length < 6) { $("#lErr").textContent = "Isi email dan kata sandi (min. 6 karakter)"; return; }
  busy($("#eGo"), true);
  try {
    if (daftar) {
      if (n.length < 2) throw {message: "Isi nama tampilan minimal 2 karakter"};
      const c = await createUserWithEmailAndPassword(auth, e, p);
      await updateProfile(c.user, {displayName: n});
    } else await signInWithEmailAndPassword(auth, e, p);
  } catch (x) {
    $("#lErr").textContent = {
      "auth/invalid-credential": "Email atau kata sandi salah",
      "auth/email-already-in-use": "Email sudah terdaftar",
      "auth/invalid-email": "Format email tidak valid",
      "auth/weak-password": "Kata sandi minimal 6 karakter"
    }[x.code] || x.message || "Gagal, coba lagi";
  } finally { busy($("#eGo"), false); }
};
$("#gBtn").onclick = async () => {
  const pv = new GoogleAuthProvider();
  try { await signInWithPopup(auth, pv); }
  catch (x) {
    if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment"].includes(x.code)) signInWithRedirect(auth, pv);
    else if (!["auth/popup-closed-by-user", "auth/cancelled-popup-request"].includes(x.code)) $("#lErr").textContent = "Gagal masuk dengan Google";
  }
};
$("#outBtn").onclick = async () => { await signOut(auth); location.reload(); };

onAuthStateChanged(auth, async u => {
  if (!u) { U = null; $("#app").hidden = true; $("#login").hidden = false; return; }
  U = u;
  const s = await get(ref(db, "agent/users/" + u.uid)).catch(() => null);
  NAME = s?.val()?.name || u.displayName || (u.email || "").split("@")[0] || "Pengguna";
  await update(ref(db, "agent/users/" + u.uid), {name: NAME}).catch(() => {});
  $("#login").hidden = true; $("#app").hidden = false;
  $("#whoTxt").textContent = "Masuk sebagai " + NAME;
  if (!started) { started = true; start(); }
});

/* ---------- Chat pribadi dengan Agent ---------- */
function start() {
  $("#msgs").innerHTML = "";
  addMsg("Halo " + NAME + "! Saya Agent HaloKita. Tulis pesanmu, saya akan membalas. Pengumuman resmi ada di tab Broadcast.", "ot", Date.now(), true);
  chatOff.push(onValue(query(ref(db, "agent/chats/" + U.uid + "/messages"), limitToLast(120)), s => {
    s.forEach(c => {
      if (seenMsg.has(c.key)) return; seenMsg.add(c.key);
      const v = c.val();
      if (v.from == U.uid) addMsg(v.text, "me", v.ts, false, true);
    });
  }));
  loadBroadcast(); loadStatus();
}
function addMsg(text, cls, ts, verified, tick) {
  const b = $("#msgs"), d = new Date(ts || Date.now());
  if (d.toDateString() != lastDay) {
    lastDay = d.toDateString();
    const s = document.createElement("div"); s.className = "day";
    s.textContent = d.toLocaleDateString("id-ID", {day: "numeric", month: "long"}); b.append(s);
  }
  const m = document.createElement("div"); m.className = "m " + cls;
  m.append(document.createTextNode(text));
  const t = document.createElement("i"); t.textContent = tm(ts);
  if (tick) { const c = document.createElement("span"); c.className = "tk"; c.innerHTML = CHECK; t.append(c); }
  m.append(t); b.append(m); b.scrollTop = b.scrollHeight;
}
async function kirimChat() {
  const t = $("#mi").value.trim().slice(0, 1000);
  if (!t || !U) return;
  $("#mi").value = "";
  const k = push(ref(db, "agent/chats/" + U.uid + "/messages")).key;
  try {
    await update(ref(db), {["agent/chats/" + U.uid + "/messages/" + k]: {from: U.uid, text: t, ts: serverTimestamp()}});
    seenMsg.add(k); addMsg(t, "me", Date.now(), false, true);
    setTimeout(() => autoReply(t), 700);
  } catch { toast("Pesan gagal terkirim"); $("#mi").value = t; }
}
function autoReply(q) {
  const s = q.toLowerCase();
  const r = /halo|hai|\bhi\b/.test(s) ? "Halo! Ada yang bisa saya bantu?"
    : /terima kasih|makasih/.test(s) ? "Sama-sama! Senang bisa membantu."
    : /broadcast|pengumuman/.test(s) ? "Pengumuman terbaru ada di tab Broadcast."
    : /status/.test(s) ? "Status terbaru Agent ada di tab Status."
    : "Pesanmu sudah saya terima. Tim HaloKita akan membalas sesegera mungkin.";
  addMsg(r, "ot", Date.now(), true);
}
$("#sd").onclick = kirimChat;
$("#mi").onkeydown = e => { if (e.key == "Enter") kirimChat(); };

/* ---------- Broadcast ---------- */
function card(data, path) {
  const c = document.createElement("div"); c.className = "card";
  const hd = document.createElement("div"); hd.className = "hd";
  hd.innerHTML = VERIFIED + "<span>Agent HaloKita</span>";
  const p = document.createElement("p"); p.textContent = data.text;
  const ft = document.createElement("div"); ft.className = "ft";
  const sm = document.createElement("small"); sm.textContent = (data.name ? data.name + " · " : "") + ago(data.ts);
  ft.append(sm);
  if (path && U && data.by == U.uid) {
    const d = document.createElement("button"); d.className = "del"; d.textContent = "Hapus";
    d.onclick = async () => { try { await remove(ref(db, path)); toast("Dihapus"); } catch { toast("Gagal menghapus"); } };
    ft.append(d);
  }
  c.append(hd, p, ft); return c;
}
function loadBroadcast() {
  chatOff.push(onValue(query(ref(db, "agent/broadcast"), limitToLast(30)), s => {
    const box = $("#bcList"); box.innerHTML = "";
    const a = []; s.forEach(c => a.push({k: c.key, ...c.val()}));
    if (!a.length) { box.innerHTML = '<div class="lb">Belum ada broadcast.</div>'; return; }
    a.reverse().forEach(b => box.append(card(b, "agent/broadcast/" + b.k)));
    const top = a[0];
    if (loadBroadcast.seen === undefined) loadBroadcast.seen = top.k;
    else if (top.k != loadBroadcast.seen) { loadBroadcast.seen = top.k; addMsg("📢 Broadcast baru: " + top.text, "ot", top.ts, true); }
  }));
}
$("#bcS").onclick = async () => {
  const t = $("#bcT").value.trim().slice(0, 1000), b = $("#bcS");
  if (!t) { $("#bcE").textContent = "Tulis pengumuman dulu"; return; }
  busy(b, true);
  try {
    await push(ref(db, "agent/broadcast"), {text: t, ts: serverTimestamp(), by: U.uid, name: NAME});
    $("#bcT").value = ""; $("#bcE").textContent = ""; toast("Broadcast terkirim ke semua user");
  } catch { $("#bcE").textContent = "Gagal mengirim. Cek aturan database."; }
  finally { busy(b, false); }
};

/* ---------- Status ---------- */
function loadStatus() {
  chatOff.push(onValue(ref(db, "agent/status"), s => {
    const v = s.val(), box = $("#stList"); box.innerHTML = "";
    if (alive(v)) box.append(card(v, "agent/status"));
    else box.innerHTML = '<div class="lb">Belum ada status aktif.</div>';
  }));
}
$("#stS").onclick = async () => {
  const t = $("#stT").value.trim().slice(0, 140), b = $("#stS");
  if (!t) { $("#stE").textContent = "Tulis statusnya dulu"; return; }
  busy(b, true);
  try {
    await update(ref(db, "agent/status"), {text: t, ts: serverTimestamp(), by: U.uid, name: NAME});
    $("#stT").value = ""; $("#stE").textContent = ""; toast("Status dibagikan");
  } catch { $("#stE").textContent = "Gagal membagikan status. Status hanya bisa diubah oleh pembuatnya."; }
  finally { busy(b, false); }
};

/* ---------- Tab ---------- */
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x == b));
  document.querySelectorAll(".pg").forEach(p => p.classList.toggle("on", p.id == b.dataset.p));
});
</script>
</body>
</html>
