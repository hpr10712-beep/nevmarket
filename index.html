<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KodinganKita — Marketplace Produk Digital</title>
<meta name="description" content="Marketplace produk digital eksklusif. Setiap produk hanya dijual sekali.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="https://i.ibb.co.com/gLGhDr3Y/kodingankita-logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4f46e5; --primary-hover:#4338ca; --primary-light:#eef2ff;
  --bg-body:#ffffff; --bg-soft:#f8fafc;
  --text-main:#0f172a; --text-muted:#64748b;
  --border:#e2e8f0;
  --danger:#ef4444; --success:#10b981; --warning:#f59e0b;
  --radius-sm:8px; --radius-md:12px; --radius-lg:20px; --radius-full:999px;
  --shadow-sm:0 1px 2px 0 rgba(0,0,0,.05);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.05),0 2px 4px -1px rgba(0,0,0,.03);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.05),0 4px 6px -2px rgba(0,0,0,.025);
  --font:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:var(--font);background:var(--bg-body);color:var(--text-main);line-height:1.5;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block;object-fit:cover}
button{font-family:inherit;cursor:pointer;border:none;background:none}

/* HEADER & NAV */
header.site{position:sticky;top:0;z-index:40;background:rgba(255,255,255,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:800px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;color:var(--text-main)}
.brand img{width:32px;height:32px;border-radius:var(--radius-sm);object-fit:cover}
.hamburger{width:42px;height:42px;border-radius:var(--radius-full);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;background:var(--bg-soft)}
.hamburger span{display:block;width:20px;height:2px;background:var(--text-main);border-radius:2px}
.header-actions { display: flex; gap: 12px; align-items: center; }
.icon-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--bg-soft); color: var(--text-main); cursor: pointer; }

/* DRAWER */
.drawer-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.4);backdrop-filter:blur(2px);z-index:90;opacity:0;pointer-events:none;transition:opacity .3s}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:300px;background:#fff;z-index:100;transform:translateX(100%);transition:transform .3s cubic-bezier(0.4, 0, 0.2, 1);display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,0.1)}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.drawer-title{font-weight:800;font-size:16px}
.drawer-close{width:32px;height:32px;border-radius:50%;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-weight:bold}
.drawer-body{padding:16px;display:flex;flex-direction:column;gap:4px}
.drawer-item{padding:14px 16px;border-radius:var(--radius-sm);color:var(--text-main);font-size:14px;font-weight:600;display:flex;align-items:center;gap:12px}
.drawer-item:hover{background:var(--primary-light);color:var(--primary)}
.drawer-footer{margin-top:auto;padding:20px;border-top:1px solid var(--border)}

/* HOME HERO */
.hero{text-align:center;padding:32px 20px 20px;max-width:700px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.hero-title{font-size:clamp(24px, 6vw, 32px);font-weight:800;margin:0 0 6px;letter-spacing:-0.02em}
.hero-desc{color:var(--text-muted);font-size:14px;margin:0 0 24px;max-width:500px;line-height:1.6}
.mascot-container{width:100%;height:240px;background:linear-gradient(135deg, var(--bg-soft) 0%, var(--primary-light) 100%);border-radius:var(--radius-lg);margin-bottom:28px;overflow:hidden;position:relative;border:1px solid var(--border);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center}
.mascot-container iframe{width:100%;height:100%;border:0}
.menu-row{display:grid;grid-template-columns:repeat(4, 1fr);gap:16px;width:100%;max-width:440px}
.menu-item{display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .15s}
.menu-item:active{transform:scale(0.95)}
.menu-icon-wrap{width:66px;height:66px;border-radius:50%;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:var(--shadow-md)}
.menu-icon-wrap iframe{width:100%;height:100%;border:0;border-radius:50%}
.menu-label{font-size:12px;font-weight:600;color:var(--text-main);text-align:center}

/* SECTION & GRID */
.section{padding:30px 20px;max-width:800px;margin:0 auto}
.section-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
.section-title{margin:0;font-size:20px;font-weight:800}
.link-see-all{font-size:13px;font-weight:600;color:var(--primary)}
.product-grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:16px}
@media(min-width:640px){.product-grid{grid-template-columns:repeat(3, 1fr)}}
.pcard{background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;display:flex;flex-direction:column;position:relative;transition:transform .2s;cursor:pointer}
.pcard:active{transform:scale(0.98)}
.pcard-thumb{aspect-ratio:1;background:var(--bg-soft);position:relative}
.pcard-thumb img{width:100%;height:100%;object-fit:cover}
.pcard-badge{position:absolute;top:10px;left:10px;background:rgba(255,255,255,0.9);color:var(--primary);font-size:10px;font-weight:800;padding:4px 8px;border-radius:var(--radius-sm);text-transform:uppercase}
.pcard-body{padding:14px;display:flex;flex-direction:column;flex:1}
.pcard-category{font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:4px}
.pcard-title{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard-price{font-size:15px;font-weight:800;color:var(--primary);margin-top:auto}

/* FORMS & UTILS */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;transition:all .2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{background:var(--primary-hover)}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text-main)}
.btn-danger{background:var(--danger);color:#fff}
.btn-block{width:100%}
.input,.textarea,.select{width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:14px;outline:none}
.input:focus,.textarea:focus{border-color:var(--primary)}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:14px;grid-column:1/-1;background:var(--bg-soft);border-radius:var(--radius-md);border:1px dashed var(--border)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:400px;padding:24px;text-align:center;box-shadow:var(--shadow-lg)}
.modal h3{margin:0 0 12px;font-size:18px}
.modal p{color:var(--text-muted);font-size:14px;margin-bottom:20px}

/* TOAST */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:1001;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border-left:4px solid var(--primary);padding:12px 16px;border-radius:8px;box-shadow:var(--shadow-md);font-size:13px;font-weight:500;animation:slideIn .2s ease}
.toast.error{border-left-color:var(--danger)}
.toast.success{border-left-color:var(--success)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

/* TIMER */
.timer-box { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; text-align: center; margin-bottom: 20px; }
.timer-display { font-size: 32px; font-weight: 800; color: var(--danger); font-variant-numeric: tabular-nums; }
.qris-img { width: 100%; max-width: 300px; margin: 0 auto; border-radius: var(--radius-md); border: 1px solid var(--border); }
</style>
</head>
<body>

<header class="site">
  <div class="header-inner">
    <a href="#" class="brand" data-nav>
      <img src="https://i.ibb.co.com/gLGhDr3Y/kodingankita-logo.jpg" alt="Logo">
      <span id="brandName">KodinganKita</span>
    </a>
    <div class="header-actions">
      <div class="icon-btn" id="navSearchBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      </div>
      <button class="hamburger" id="hamburgerBtn"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <span class="drawer-title">Menu Navigasi</span>
    <button class="drawer-close" id="drawerClose">&times;</button>
  </div>
  <div class="drawer-body">
    <a href="#" data-nav class="drawer-item">Beranda</a>
    <a href="#catalog" data-nav class="drawer-item">Katalog Produk</a>
    <a href="#purchases" data-nav class="drawer-item">Pembelian Saya</a>
    <a href="#seller" data-nav class="drawer-item">Jadi Penjual</a>
  </div>
  <div class="drawer-footer">
    <button id="authBtn" class="btn btn-primary btn-block">Masuk dengan Google</button>
  </div>
</aside>

<main id="app"></main>
<div id="modal-root"></div>
<div id="toast-container"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, onValue, set, push, runTransaction, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8",
  authDomain: "mybro-9ba5f.firebaseapp.com",
  databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com",
  projectId: "mybro-9ba5f",
  storageBucket: "mybro-9ba5f.firebasestorage.app",
  messagingSenderId: "820948893264",
  appId: "1:820948893264:web:e564509a8fdc4c56335b55"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rupiah = n => "Rp" + Number(n||0).toLocaleString("id-ID");
const QRIS_IMG = "https://i.ibb.co.com/FLF6Wz07/IMG-20261012-160202.jpg";

const state = {
  user: null,
  profile: null,
  settings: {},
  products: {},
  shops: {},
  pendingProductId: null,
  orderTimer: null
};

function toast(msg, type="info") {
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.textContent = msg;
  $("#toast-container").appendChild(el);
  setTimeout(() => { el.style.opacity="0"; el.style.transition="opacity .3s"; setTimeout(()=>el.remove(),300); }, 4000);
}

function createIframe(code, isRound = false) {
  const iframe = document.createElement("iframe");
  if (isRound) iframe.style.borderRadius = "50%";
  iframe.srcdoc = `<html><head><style>body{margin:0;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;background:transparent;}*{box-sizing:border-box;}</style></head><body>${code}</body></html>`;
  return iframe;
}

/* --- AUTH --- */
onAuthStateChanged(auth, async user => {
  state.user = user;
  const btn = $("#authBtn");
  if(user) {
    btn.textContent = "Keluar (" + user.displayName + ")";
    btn.style.background = "var(--danger)";
    btn.onclick = () => signOut(auth);
    // Create user profile if not exists
    const userRef = ref(db, `users/${user.uid}`);
    const snap = await get(userRef);
    if(!snap.exists()) {
      await set(userRef, { displayName: user.displayName, email: user.email, photoURL: user.photoURL, createdAt: serverTimestamp() });
    }
    state.profile = (await get(userRef)).val();
  } else {
    btn.textContent = "Masuk dengan Google";
    btn.style.background = "var(--primary)";
    btn.onclick = () => signInWithPopup(auth, provider).catch(e => toast(e.message, 'error'));
    state.profile = null;
  }
  
  if(user && state.pendingProductId) {
    const pid = state.pendingProductId;
    state.pendingProductId = null;
    closeModal();
    buyFlow(pid);
  } else {
    render();
  }
});

/* --- DATA --- */
async function loadSettings() {
  const snap = await get(ref(db, "settings/marketplace"));
  state.settings = snap.val() || {};
  if(state.settings.name) $("#brandName").textContent = state.settings.name;
  render();
}
onValue(ref(db, "products"), snap => { state.products = snap.val() || {}; render(); });
onValue(ref(db, "shops"), snap => { state.shops = snap.val() || {}; render(); });

/* --- ROUTER --- */
function parseHash() {
  const h = location.hash.replace(/^#/, "");
  const [path, qs] = h.split("?");
  return { path, params: new URLSearchParams(qs || "") };
}

window.addEventListener("hashchange", () => {
  if(state.orderTimer) clearInterval(state.orderTimer);
  window.scrollTo(0, 0);
  render();
});

function render() {
  if(!state.settings) return;
  const { path, params } = parseHash();
  
  if (path.startsWith("product=")) return renderProduct(path.split("=")[1]);
  if (path.startsWith("order=")) return renderOrder(path.split("=")[1]);
  if (path.startsWith("shop=")) return renderShop(path.split("=")[1]);
  if (path === "catalog") return renderCatalog(params);
  if (path === "purchases") return renderPurchases();
  if (path === "seller") return renderSeller();
  return renderHome();
}

/* --- VIEWS --- */
function renderHome() {
  const s = state.settings;
  const products = Object.entries(state.products || {}).map(([id, p]) => ({id, ...p}))
    .filter(p => p.status === "available" && p.availability === "available").slice(0, 6);

  const defaultMenus = [
    { label: "Katalog", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>`, action: "#catalog" },
    { label: "Cari", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>`, action: "#catalog" },
    { label: "Jual", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><path d="M12 4v16m8-8H4"/></svg>`, action: "#seller" },
    { label: "Beli", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/></svg>`, action: "#purchases" }
  ];
  const menus = (s.menuItems && s.menuItems.length > 0) ? s.menuItems : defaultMenus;

  $("#app").innerHTML = `
    <section class="hero">
      <h1 class="hero-title">${esc(s.name || "KodinganKita")}</h1>
      <p class="hero-desc">${esc(s.description || "Marketplace Produk Digital Eksklusif. Setiap produk hanya dijual satu kali.")}</p>
      <div class="mascot-container" id="mascotBox">
        ${!s.mascot?.code ? `<span style="color:var(--text-muted);font-size:14px">Mascot belum diatur</span>` : ''}
      </div>
      <div class="menu-row">
        ${menus.slice(0,4).map((m, i) => `
          <a href="${esc(m.action)}" class="menu-item" data-nav>
            <div class="menu-icon-wrap" id="menu-icon-${i}"></div>
            <span class="menu-label">${esc(m.label)}</span>
          </a>
        `).join("")}
      </div>
    </section>
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">Produk Eksklusif</h2>
        <a href="#catalog" class="link-see-all" data-nav>Lihat Semua &rarr;</a>
      </div>
      <div class="product-grid">
        ${products.length ? products.map(p => `
          <a href="#product=${p.id}" class="pcard" data-nav>
            <div class="pcard-thumb">
              <img src="${p.imageURLs?.[0] || 'https://placehold.co/400x400/f8fafc/64748b?text=No+Image'}">
              <div class="pcard-badge">Eksklusif</div>
            </div>
            <div class="pcard-body">
              <div class="pcard-category">${esc(p.category)}</div>
              <div class="pcard-title">${esc(p.title)}</div>
              <div class="pcard-price">${rupiah(p.price)}</div>
            </div>
          </a>
        `).join("") : `<div class="empty-state">Belum ada produk tersedia.</div>`}
      </div>
    </section>
  `;

  if(s.mascot?.code) $("#mascotBox").appendChild(createIframe(s.mascot.code));
  menus.slice(0,4).forEach((m, i) => { if(m.code) $(`#menu-icon-${i}`).appendChild(createIframe(m.code, true)); });
}

function renderCatalog(params) {
  const q = params.get("q") || "";
  let products = Object.entries(state.products || {}).map(([id, p]) => ({id, ...p}))
    .filter(p => p.status === "available" && p.availability === "available");

  if(q) {
    const query = q.toLowerCase();
    products = products.filter(p => 
      (p.title||"").toLowerCase().includes(query) || 
      (p.category||"").toLowerCase().includes(query) || 
      (p.description||"").toLowerCase().includes(query)
    );
  }

  $("#app").innerHTML = `
    <section class="section">
      <form class="field" onsubmit="event.preventDefault(); location.hash='#catalog?q='+this.q.value">
        <input name="q" class="input" placeholder="Cari produk (misal: toko online, landing page)..." value="${esc(q)}">
      </form>
      <div class="product-grid">
        ${products.length ? products.map(p => `
          <a href="#product=${p.id}" class="pcard" data-nav>
            <div class="pcard-thumb"><img src="${p.imageURLs?.[0] || 'https://placehold.co/400x400'}"></div>
            <div class="pcard-body">
              <div class="pcard-category">${esc(p.category)}</div>
              <div class="pcard-title">${esc(p.title)}</div>
              <div class="pcard-price">${rupiah(p.price)}</div>
            </div>
          </a>
        `).join("") : `<div class="empty-state">Produk tidak ditemukan.</div>`}
      </div>
    </section>
  `;
}

function renderProduct(id) {
  const p = state.products[id];
  if(!p) return $("#app").innerHTML = `<div class="empty-state">Produk tidak ditemukan</div>`;
  
  const isSold = p.status === "sold" || p.availability === "sold";
  const isAvail = p.status === "available" && p.availability === "available";
  const shop = state.shops[p.shopId] || {};

  $("#app").innerHTML = `
    <section class="section">
      <a href="#catalog" data-nav style="font-size:13px;font-weight:600;color:var(--text-muted)">&larr; Kembali</a>
      <div style="margin-top:20px; border-radius:var(--radius-md); overflow:hidden; aspect-ratio:16/9; background:var(--bg-soft); border:1px solid var(--border); margin-bottom:20px;">
        <img src="${p.imageURLs?.[0] || 'https://placehold.co/800x450'}" style="width:100%;height:100%;object-fit:cover">
      </div>
      <div class="pcard-category">${esc(p.category)}</div>
      <h1 style="margin:8px 0 12px; font-size:24px;">${esc(p.title)}</h1>
      <div style="font-size:24px; font-weight:800; color:var(--primary); margin-bottom:20px;">${rupiah(p.price)}</div>
      
      <div style="background:var(--bg-soft); padding:16px; border-radius:var(--radius-md); margin-bottom:24px;">
        <h3 style="margin:0 0 8px; font-size:15px;">Deskripsi</h3>
        <p style="margin:0; font-size:14px; line-height:1.6; white-space:pre-wrap;">${esc(p.description)}</p>
      </div>

      <div style="display:flex; gap:12px; align-items:center; padding:16px; border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:24px;">
        <img src="${shop.logoURL || 'https://i.ibb.co.com/gLGhDr3Y/kodingankita-logo.jpg'}" style="width:40px;height:40px;border-radius:50%;object-fit:cover">
        <div>
          <div style="font-weight:700; font-size:14px;">${esc(shop.name || "Toko")}</div>
          <div style="font-size:12px; color:var(--text-muted);">${shop.ratingAverage ? shop.ratingAverage.toFixed(1) : 0} Bintang</div>
        </div>
      </div>

      ${isSold 
        ? `<div class="btn btn-danger btn-block" style="opacity:0.7; cursor:not-allowed;">Maaf, Produk Sudah Terjual</div>`
        : `<button id="btnBuy" class="btn btn-primary btn-block" style="padding:16px; font-size:16px;">Beli Sekarang (Eksklusif)</button>`
      }
    </section>
  `;

  if(isAvail) {
    $("#btnBuy").onclick = () => buyFlow(id);
  }
}

async function buyFlow(productId) {
  if(!state.user) {
    state.pendingProductId = productId;
    $("#modal-root").innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this)document.getElementById('modal-root').innerHTML=''">
        <div class="modal">
          <h3>Masuk Diperlukan</h3>
          <p>Silakan masuk dengan Google untuk melanjutkan pembelian produk eksklusif ini.</p>
          <button class="btn btn-primary btn-block" onclick="document.getElementById('authBtn').click(); document.getElementById('modal-root').innerHTML=''">Masuk Sekarang</button>
        </div>
      </div>`;
    return;
  }

  const product = state.products[productId];
  if(!product || product.status !== 'available') return toast("Produk sudah tidak tersedia", "error");

  try {
    const orderRef = push(ref(db, 'orders'));
    const orderId = orderRef.key;
    const now = Date.now();
    const expiresAt = now + (3 * 60 * 1000); // 3 Menit

    // TRANSACTION: Mengunci produk
    const result = await runTransaction(ref(db, `products/${productId}`), (p) => {
      if (!p) return null;
      if (p.status !== 'available' || p.availability !== 'available') return null;
      return { ...p, status: 'reserved', availability: 'reserved', reservedBy: state.user.uid, reservedUntil: expiresAt, reservationOrderId: orderId };
    });

    if (!result.committed) return toast("Maaf, produk baru saja dibeli orang lain.", "error");

    // CREATE ORDER
    const commRate = state.settings.commissionRate || 0.10;
    const price = Number(product.price);
    const comm = price * commRate;

    await set(orderRef, {
      buyerId: state.user.uid, buyerName: state.user.displayName,
      sellerId: product.sellerId, shopId: product.shopId, productId: product.id,
      productTitleSnapshot: product.title, priceSnapshot: price,
      commissionSnapshot: comm, sellerAmountSnapshot: price - comm,
      paymentStatus: 'pending', orderStatus: 'reserved',
      createdAt: now, expiresAt: expiresAt
    });

    location.hash = `#order=${orderId}`;
  } catch(e) { toast("Gagal membuat pesanan: " + e.message, "error"); }
}

async function renderOrder(orderId) {
  $("#app").innerHTML = `<div class="section">Memuat pesanan...</div>`;
  const snap = await get(ref(db, `orders/${orderId}`));
  const order = snap.val();
  if(!order) return $("#app").innerHTML = `<div class="empty-state">Pesanan tidak ditemukan</div>`;
  if(order.buyerId !== state.user?.uid) return $("#app").innerHTML = `<div class="empty-state">Akses ditolak</div>`;

  if(order.paymentStatus === 'paid') {
    return $("#app").innerHTML = `<div class="section" style="text-align:center; padding-top:60px;"><h2 style="color:var(--success)">Pembayaran Terkonfirmasi</h2><p>Pesanan ini sudah lunas dan produk menjadi milik Anda.</p><a href="#purchases" class="btn btn-primary" data-nav>Buka Pembelian Saya</a></div>`;
  }

  if(order.paymentStatus === 'expired' || order.paymentStatus === 'cancelled') {
    return $("#app").innerHTML = `<div class="section" style="text-align:center; padding-top:60px;"><h2 style="color:var(--danger)">Pesanan Kedaluwarsa</h2><p>Batas waktu pembayaran 3 menit telah habis.</p><a href="#catalog" class="btn btn-outline" data-nav>Kembali ke Katalog</a></div>`;
  }

  const remain = order.expiresAt - Date.now();
  if(remain <= 0) { expireOrder(orderId, order); return renderOrder(orderId); }

  $("#app").innerHTML = `
    <section class="section" style="max-width:500px; text-align:center;">
      <h2>Selesaikan Pembayaran</h2>
      <p style="color:var(--text-muted); font-size:13px;">ID: ${orderId}</p>
      
      <div class="timer-box">
        <div style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px;">Sisa Waktu</div>
        <div class="timer-display" id="timerDisplay">03:00</div>
      </div>

      <div style="font-size:28px; font-weight:800; color:var(--primary); margin-bottom:20px;">${rupiah(order.priceSnapshot)}</div>

      <img src="${QRIS_IMG}" class="qris-img" alt="QRIS">
      <p style="font-size:12px; color:var(--text-muted); margin-top:12px; margin-bottom:24px;">Scan menggunakan aplikasi bank atau e-wallet (GoPay, OVO, Dana, dll).</p>

      <button id="btnConfirm" class="btn btn-primary btn-block" style="padding:16px;">Saya Sudah Bayar</button>
      <button id="btnCancel" class="btn btn-outline btn-block" style="margin-top:12px;">Batalkan Pesanan</button>
    </section>
  `;

  if(state.orderTimer) clearInterval(state.orderTimer);
  const tick = () => {
    const r = order.expiresAt - Date.now();
    if(r <= 0) {
      clearInterval(state.orderTimer);
      expireOrder(orderId, order);
      return;
    }
    const m = Math.floor(r / 60000), s = Math.floor((r % 60000) / 1000);
    $("#timerDisplay").textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  };
  tick();
  state.orderTimer = setInterval(tick, 1000);

  $("#btnConfirm").onclick = async () => {
    if(!confirm("Anda yakin sudah membayar? Admin akan memverifikasi secara manual.")) return;
    await update(ref(db, `orders/${orderId}`), { paymentStatus: 'awaiting_verification' });
    clearInterval(state.orderTimer);
    toast("Konfirmasi terkirim. Menunggu verifikasi admin.", "success");
    location.hash = "#purchases";
  };

  $("#btnCancel").onclick = async () => {
    if(!confirm("Batalkan pesanan?")) return;
    await expireOrder(orderId, order, true);
    location.hash = "#catalog";
  };
}

async function expireOrder(orderId, order, isCancel = false) {
  try {
    await runTransaction(ref(db, `products/${order.productId}`), (p) => {
      if(!p || p.reservationOrderId !== orderId) return p;
      return { ...p, status: 'available', availability: 'available', reservedBy: null, reservedUntil: null, reservationOrderId: null };
    });
    await update(ref(db, `orders/${orderId}`), { paymentStatus: isCancel ? 'cancelled' : 'expired', orderStatus: 'expired' });
    if(!isCancel) toast("Waktu habis. Pesanan dibatalkan.", "error");
    if(state.orderTimer) clearInterval(state.orderTimer);
    render();
  } catch(e) { console.error(e); }
}

async function renderPurchases() {
  if(!state.user) return $("#app").innerHTML = `<div class="empty-state">Silakan login terlebih dahulu.</div>`;
  $("#app").innerHTML = `<div class="section">Memuat pembelian...</div>`;
  
  const snap = await get(ref(db, 'orders'));
  const all = snap.val() || {};
  const myOrders = Object.entries(all).map(([id, o]) => ({id, ...o})).filter(o => o.buyerId === state.user.uid).sort((a,b)=>b.createdAt - a.createdAt);

  $("#app").innerHTML = `
    <section class="section">
      <h2 style="margin-bottom:20px;">Pembelian Saya</h2>
      ${myOrders.length ? myOrders.map(o => `
        <div style="border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; margin-bottom:12px; display:flex; gap:16px; align-items:center;">
          <div style="flex:1;">
            <div style="font-weight:700; font-size:14px;">${esc(o.productTitleSnapshot)}</div>
            <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">${new Date(o.createdAt).toLocaleDateString('id-ID')}</div>
            <div style="margin-top:8px; font-weight:600; color:${o.paymentStatus==='paid'?'var(--success)':'var(--warning)'}; text-transform:capitalize;">${o.paymentStatus}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-weight:800; color:var(--primary); margin-bottom:8px;">${rupiah(o.priceSnapshot)}</div>
            ${o.paymentStatus === 'paid' 
              ? `<button class="btn btn-primary btn-sm" onclick="downloadFile('${o.id}')">Unduh File</button>`
              : `<a href="#order=${o.id}" class="btn btn-outline btn-sm" data-nav>Lihat</a>`}
          </div>
        </div>
      `).join('') : `<div class="empty-state">Belum ada pembelian.</div>`}
    </section>
  `;
}

window.downloadFile = async (orderId) => {
  toast("Memeriksa hak akses...");
  const snap = await get(ref(db, `orders/${orderId}`));
  const o = snap.val();
  if(o.paymentStatus !== 'paid') return toast("Pembayaran belum lunas.", "error");
  
  const pSnap = await get(ref(db, `products/${o.productId}`));
  const fileUrl = pSnap.val()?.fileDownloadURL;
  
  if(fileUrl) {
    window.open(fileUrl, '_blank');
  } else {
    alert("File produk belum diunggah ke server oleh Penjual/Admin. Hubungi admin untuk pengiriman file.");
  }
};

async function renderSeller() {
  if(!state.user) return $("#app").innerHTML = `<div class="empty-state">Silakan login untuk menjadi penjual.</div>`;
  
  const shopsSnap = await get(ref(db, 'shops'));
  const myShop = Object.entries(shopsSnap.val() || {}).find(([id, s]) => s.ownerId === state.user.uid);

  if(myShop) {
    return $("#app").innerHTML = `
      <section class="section">
        <h2>Dashboard Toko</h2>
        <p>Selamat datang di toko <b>${esc(myShop[1].name)}</b>.</p>
        <a href="#shop=${myShop[1].slug}" data-nav class="btn btn-primary btn-block">Lihat Toko Publik</a>
      </section>`;
  }

  const appsSnap = await get(ref(db, 'sellerApplications'));
  const myApp = Object.entries(appsSnap.val() || {}).find(([id, a]) => a.userId === state.user.uid);

  if(myApp) {
    return $("#app").innerHTML = `<div class="section"><div class="empty-state">Pengajuan toko Anda sedang ditinjau (Status: ${myApp[1].status}).</div></div>`;
  }

  $("#app").innerHTML = `
    <section class="section">
      <h2>Buka Toko Baru</h2>
      <p style="color:var(--text-muted); font-size:14px; margin-bottom:20px;">Isi data toko Anda. Admin akan meninjau pengajuan ini.</p>
      <form id="formSeller">
        <div class="field"><label>Nama Toko</label><input class="input" name="shopName" required></div>
        <div class="field"><label>Slug Toko (huruf kecil, tanpa spasi)</label><input class="input" name="slug" pattern="[a-z0-9-]+" required></div>
        <div class="field"><label>Deskripsi Singkat</label><textarea class="textarea" name="description" required></textarea></div>
        <div class="field"><label>Nama Pemilik</label><input class="input" name="ownerName" required></div>
        <div class="field"><label>Kontak (WA/Email)</label><input class="input" name="contact" required></div>
        <button type="submit" class="btn btn-primary btn-block">Ajukan Toko</button>
      </form>
    </section>
  `;

  $("#formSeller").onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      const appRef = push(ref(db, 'sellerApplications'));
      await set(appRef, {
        userId: state.user.uid,
        shopName: fd.get('shopName'),
        slug: fd.get('slug').toLowerCase(),
        description: fd.get('description'),
        ownerName: fd.get('ownerName'),
        contact: fd.get('contact'),
        email: state.user.email,
        status: 'pending',
        createdAt: serverTimestamp()
      });
      toast("Pengajuan berhasil dikirim!", "success");
      renderSeller();
    } catch (err) { toast(err.message, "error"); }
  };
}

function renderShop(slug) {
  const shopEntry = Object.entries(state.shops).find(([id, s]) => s.slug === slug);
  if(!shopEntry) return $("#app").innerHTML = `<div class="empty-state">Toko tidak ditemukan.</div>`;
  const [shopId, shop] = shopEntry;
  
  const products = Object.entries(state.products).map(([id, p]) => ({id, ...p}))
    .filter(p => p.shopId === shopId && p.status === "available" && p.availability === "available");

  $("#app").innerHTML = `
    <section class="section">
      <div style="text-align:center; margin-bottom:30px;">
        <img src="${shop.logoURL || 'https://i.ibb.co.com/gLGhDr3Y/kodingankita-logo.jpg'}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;margin:0 auto 16px;">
        <h2 style="margin:0 0 8px;">${esc(shop.name)}</h2>
        <p style="color:var(--text-muted); font-size:14px; margin:0;">${esc(shop.description)}</p>
      </div>
      <h3>Produk Toko (${products.length})</h3>
      <div class="product-grid" style="margin-top:16px;">
        ${products.length ? products.map(p => `
          <a href="#product=${p.id}" class="pcard" data-nav>
            <div class="pcard-thumb"><img src="${p.imageURLs?.[0] || 'https://placehold.co/400x400'}"></div>
            <div class="pcard-body">
              <div class="pcard-title">${esc(p.title)}</div>
              <div class="pcard-price">${rupiah(p.price)}</div>
            </div>
          </a>
        `).join("") : `<div class="empty-state">Belum ada produk tersedia.</div>`}
      </div>
    </section>
  `;
}

/* --- UI LOGIC --- */
function closeModal() { $("#modal-root").innerHTML = ""; }
const drawer = $("#drawer"), overlay = $("#drawerOverlay");
$("#hamburgerBtn").onclick = () => { drawer.classList.add("open"); overlay.classList.add("open"); };
$("#drawerClose").onclick = () => { drawer.classList.remove("open"); overlay.classList.remove("open"); };
overlay.onclick = () => { drawer.classList.remove("open"); overlay.classList.remove("open"); };
document.addEventListener("click", (e) => { if (e.target.closest("[data-nav]")) { drawer.classList.remove("open"); overlay.classList.remove("open"); } });
$("#navSearchBtn").onclick = () => { location.hash = "#catalog"; };

await loadSettings();
</script>
