<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KodinganKita — Marketplace Produk Digital</title>
<meta name="description" content="Marketplace produk digital eksklusif. Setiap produk hanya dijual sekali.">
<link rel="icon" href="https://i.ibb.co.com/gLGhDr3Y/kodingankita-logo.jpg">
<style>
:root{
  --primary:#4f46e5; --primary-600:#4338ca; --primary-50:#eef2ff;
  --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
  --bg:#ffffff; --bg-soft:#f8fafc; --danger:#dc2626; --success:#16a34a;
  --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}

/* HEADER (Sesuai Sketsa) */
header.site{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:800px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--text)}
.brand img{width:32px;height:32px;border-radius:8px;object-fit:cover}
.hamburger{background:none;border:0;width:40px;height:40px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:0}
.hamburger span{display:block;width:24px;height:2px;background:var(--text);border-radius:2px}

/* HERO SKETSA */
.hero{text-align:center;padding:30px 20px 10px;max-width:600px;margin:0 auto}
.hero-title{font-size:28px;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.hero-desc{color:var(--muted);font-size:13px;margin:0 0 24px}

/* MASCOT BOX */
.mascot-container{width:100%;height:220px;background:var(--bg-soft);border-radius:40px;margin-bottom:24px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);box-shadow:inset 0 2px 10px rgba(0,0,0,.02)}
.mascot-container iframe, .mascot-container canvas {width:100%;height:100%;object-fit:cover;border:0}
.mascot-container .mascot-empty{font-size:14px;color:var(--muted);font-weight:500}

/* MENU ROW (4 Lingkaran) */
.menu-row{display:grid;grid-template-columns:repeat(4, 1fr);gap:12px;margin-bottom:30px}
.menu-item{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--text)}
.menu-icon-wrap{width:65px;height:65px;border-radius:50%;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.04);transition:transform .15s}
.menu-item:active .menu-icon-wrap{transform:scale(.95)}
.menu-icon-wrap svg, .menu-icon-wrap img, .menu-icon-wrap canvas {width:100%;height:100%;object-fit:cover}
.menu-label{font-size:11px;font-weight:600;text-align:center;line-height:1.2}

/* PRODUK GRID (2 Kolom Sesuai Sketsa) */
.section{padding:20px;max-width:800px;margin:0 auto}
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(min-width:640px){.product-grid{grid-template-columns:repeat(3,1fr)}}

/* KARTU PRODUK */
.pcard{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;text-decoration:none;color:inherit}
.pcard-thumb{aspect-ratio:1;background:var(--bg-soft);overflow:hidden;position:relative}
.pcard-thumb img{width:100%;height:100%;object-fit:cover}
.pcard-body{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pcard-title{font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard-price{font-size:14px;font-weight:800;color:var(--primary);margin-top:auto;padding-top:6px}

/* DRAWER MENU */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:280px;background:#fff;z-index:100;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:800}
.drawer-body{padding:16px;display:flex;flex-direction:column}
.drawer-body a{padding:14px;color:var(--text);font-size:14px;font-weight:600;border-bottom:1px solid var(--bg-soft);text-decoration:none}
.drawer-body a:hover{background:var(--bg-soft);color:var(--primary)}

/* UTILS */
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px}
.skeleton{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<!-- HEADER -->
<header class="site">
  <div class="header-inner">
    <a href="#" class="brand" data-nav>
      <img src="https://i.ibb.co.com/gLGhDr3Y/kodingankita-logo.jpg" alt="Logo">
      <span id="brandName">KodinganKita</span>
    </a>
    <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <span>Menu</span>
    <button id="drawerClose" style="background:none;border:0;font-size:20px;cursor:pointer;color:var(--muted)">Tutup</button>
  </div>
  <div class="drawer-body">
    <a href="#" data-nav>Beranda</a>
    <a href="#catalog" data-nav>Katalog Produk</a>
    <a href="#purchases" data-nav>Pembelian Saya</a>
    <a href="#seller" data-nav>Jadi Penjual</a>
    <div style="flex:1"></div>
    <button id="authBtn" style="margin-top:20px;padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--primary);color:#fff;font-weight:600;cursor:pointer;font-family:inherit">Masuk</button>
  </div>
</aside>

<!-- MAIN CONTENT -->
<main id="app"></main>

<div id="toast-container" style="position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, onValue, set, push, runTransaction, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8",
  authDomain: "mybro-9ba5f.firebaseapp.com",
  databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com",
  projectId: "mybro-9ba5f",
  storageBucket: "mybro-9ba5f.firebasestorage.app",
  messagingSenderId: "820948893264",
  appId: "1:820948893264:web:e564509a8fdc4c56335b55"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rupiah = n => "Rp"+Number(n||0).toLocaleString("id-ID");

const state = {
  user: null,
  settings: null,
  products: null,
  pendingProductId: null
};

/* --- FUNGSI EKSEKUSI KODE DARI ADMIN --- */
function executeCustomCode(container) {
  // Cari semua tag <script> yang di-inject, lalu buat ulang agar dieksekusi oleh browser
  const scripts = container.querySelectorAll("script");
  scripts.forEach(oldScript => {
    const newScript = document.createElement("script");
    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
    oldScript.parentNode.replaceChild(newScript, oldScript);
  });
}

/* --- LOAD SETTINGS --- */
async function loadSettings() {
  const snap = await get(ref(db, "settings/marketplace"));
  state.settings = snap.val() || {};
  if(state.settings.name) $("#brandName").textContent = state.settings.name;
  render();
}

onValue(ref(db, "products"), snap => {
  state.products = snap.val() || {};
  render();
});

onAuthStateChanged(auth, user => {
  state.user = user;
  $("#authBtn").textContent = user ? "Keluar" : "Masuk";
  $("#authBtn").onclick = () => user ? signOut(auth) : signInWithPopup(auth, provider);
  if(user && state.pendingProductId) {
    const pid = state.pendingProductId;
    state.pendingProductId = null;
    buyFlow(pid);
  }
});

/* --- ROUTER --- */
function parseHash() {
  const h = location.hash.replace(/^#/, "");
  const [path, qs] = h.split("?");
  return { path, params: new URLSearchParams(qs || "") };
}

function render() {
  const { path } = parseHash();
  if (path.startsWith("product=")) return renderProduct(path.split("=")[1]);
  return renderHome();
}

/* --- HOME SKETSA --- */
function renderHome() {
  const s = state.settings || {};
  
  // Ambil data produk
  let products = [];
  if (state.products) {
    products = Object.entries(state.products)
      .map(([id, p]) => ({id, ...p}))
      .filter(p => p.status === "available" && p.availability === "available")
      .slice(0, 4);
  }

  // Render Mascot (Kode HTML dari admin)
  let mascotHTML = s.mascot?.code || `<div class="mascot-empty">Mascot belum diatur oleh Admin</div>`;

  // Render Menu (Kode HTML dari admin)
  let menuHTML = "";
  const defaultMenus = [
    { label: "Katalog", code: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>`, action: "#catalog" },
    { label: "Cari", code: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>`, action: "#catalog" },
    { label: "Jual", code: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16m8-8H4"/></svg>`, action: "#seller" },
    { label: "Beli", code: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/></svg>`, action: "#purchases" }
  ];

  const menus = (s.menuItems && s.menuItems.length > 0) ? s.menuItems : defaultMenus;

  menuHTML = menus.map(m => `
    <a href="${esc(m.action)}" class="menu-item" data-nav>
      <div class="menu-icon-wrap">
        ${m.code}
      </div>
      <span class="menu-label">${esc(m.label)}</span>
    </a>
  `).join("");

  $("#app").innerHTML = `
    <section class="hero">
      <h1 class="hero-title">${esc(s.name || "KodinganKita")}</h1>
      <p class="hero-desc">${esc(s.description || "Marketplace Produk Digital Eksklusif")}</p>
      
      <div class="mascot-container" id="mascotContainer">
        ${mascotHTML}
      </div>

      <div class="menu-row">
        ${menuHTML}
      </div>
    </section>

    <section class="section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px">
        <h2 style="font-size:18px;margin:0">Produk</h2>
        <a href="#catalog" style="font-size:12px;font-weight:600" data-nav>Lihat Semua</a>
      </div>
      <div class="product-grid">
        ${products.length ? products.map(p => `
          <a href="#product=${p.id}" class="pcard" data-nav>
            <div class="pcard-thumb">
              <img src="${p.imageURLs?.[0] || 'https://placehold.co/400x400/eef2ff/4f46e5?text=Produk'}" alt="">
            </div>
            <div class="pcard-body">
              <div class="pcard-title">${esc(p.title)}</div>
              <div class="pcard-price">${rupiah(p.price)}</div>
            </div>
          </a>
        `).join("") : '<div class="empty" style="grid-column:1/-1">Belum ada produk</div>'}
      </div>
    </section>
  `;

  // Jalankan script kustom (jika ada) dari admin
  executeCustomCode($("#mascotContainer"));
  document.querySelectorAll('.menu-icon-wrap').forEach(wrap => executeCustomCode(wrap));
}

function renderProduct(id) {
  // Simplified view for product details
  $("#app").innerHTML = `<section class="section"><a href="#" data-nav style="font-size:13px">&larr; Kembali</a><h1>Detail Produk</h1><p>ID: ${id}</p></section>`;
}

/* --- DRAWER LOGIC --- */
$("#hamburgerBtn").addEventListener("click", () => {
  $("#drawer").classList.add("open");
  $("#drawerOverlay").classList.add("open");
});
$("#drawerClose").addEventListener("click", () => {
  $("#drawer").classList.remove("open");
  $("#drawerOverlay").classList.remove("open");
});
$("#drawerOverlay").addEventListener("click", () => {
  $("#drawer").classList.remove("open");
  $("#drawerOverlay").classList.remove("open");
});

window.addEventListener("hashchange", render);
await loadSettings();
render();
</script>
</body>
</html>
