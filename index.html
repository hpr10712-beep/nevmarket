<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KodinganKita — Marketplace Produk Digital</title>
<link rel="icon" href="https://i.ibb.co.com/gLGhDr3Y/kodingankita-logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4f46e5; --primary-hover:#4338ca; --primary-light:#eef2ff;
  --bg-body:#f8fafc; --bg-card:#ffffff;
  --text-main:#0f172a; --text-muted:#64748b;
  --border:#e2e8f0;
  --danger:#ef4444; --success:#10b981; --warning:#f59e0b;
  --radius-sm:8px; --radius-md:12px; --radius-lg:24px; --radius-full:999px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.05);
  --shadow-md:0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg:0 10px 25px rgba(0,0,0,0.1);
  --font:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:var(--font);background:var(--bg-body);color:var(--text-main);line-height:1.5;-webkit-font-smoothing:antialiased; padding-bottom: 100px;}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none}

/* ================= HEADER ================= */
header.site{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.9);backdrop-filter:blur(15px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--text-main);letter-spacing:-0.5px}
.brand img{width:32px;height:32px;border-radius:8px}
.search-bar{flex:1;max-width:500px;position:relative;display:none}
@media(min-width:640px){.search-bar{display:block}}
.search-bar input{width:100%;padding:10px 16px 10px 40px;border:1px solid var(--border);border-radius:var(--radius-full);background:var(--bg-body);font-size:14px;outline:none;transition:0.2s}
.search-bar input:focus{background:#fff;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-muted)}
.btn-login{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);padding:8px 16px;border-radius:var(--radius-full);font-weight:600;font-size:14px;box-shadow:var(--shadow-sm);transition:0.2s}
.btn-login:hover{background:var(--bg-body)}
.btn-login img{width:18px;height:18px}

/* ================= BOTTOM NAV (IPHONE DOCK STYLE) ================= */
.bottom-nav-container{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:center;z-index:50;pointer-events:none}
.bottom-nav{background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.3);box-shadow:0 10px 40px rgba(0,0,0,0.15);border-radius:var(--radius-full);display:flex;justify-content:space-around;padding:12px 24px;width:92%;max-width:450px;pointer-events:auto}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text-muted);transition:0.3s;cursor:pointer;position:relative}
.nav-item.active{color:var(--primary);transform:translateY(-2px)}
.nav-item .icon-wrap{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.nav-item .icon-wrap iframe{width:100%;height:100%;border:none}
.nav-item span{font-size:10px;font-weight:700}
.nav-item.active span{color:var(--primary)}

/* ================= CONTAINER ================= */
.container{max-width:1000px;margin:0 auto;padding:20px}

/* ================= HOME ================= */
.hero{text-align:center;padding:40px 20px 20px}
.hero-title{font-size:32px;font-weight:800;margin:0 0 10px;letter-spacing:-1px}
.hero-desc{color:var(--text-muted);font-size:15px;margin:0 auto 30px;max-width:500px}
.mascot-box{width:100%;max-width:600px;height:220px;margin:0 auto 30px;background:var(--primary-light);border-radius:var(--radius-lg);overflow:hidden;position:relative;box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center}
.mascot-box iframe{width:100%;height:100%;border:none}
.quick-menu{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:400px;margin:0 auto}
.quick-item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.quick-icon{width:64px;height:64px;background:#fff;border-radius:50%;box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:transform 0.2s}
.quick-item:active .quick-icon{transform:scale(0.9)}
.quick-icon iframe{width:100%;height:100%;border:none;border-radius:50%}
.quick-label{font-size:12px;font-weight:600}

/* ================= GRID PRODUK ================= */
.section-title{font-size:20px;font-weight:800;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;transition:transform 0.2s, box-shadow 0.2s;border:1px solid var(--border);position:relative}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.card-img{aspect-ratio:1;background:#f1f5f9;width:100%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card-img img{width:100%;height:100%;object-fit:contain} /* Agar gambar tidak terpotong */
.badge{position:absolute;top:8px;left:8px;background:var(--primary);color:#fff;font-size:10px;font-weight:800;padding:4px 8px;border-radius:4px;text-transform:uppercase;z-index:2}
.card-body{padding:12px;display:flex;flex-direction:column;flex:1}
.card-title{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-price{font-size:15px;font-weight:800;color:var(--primary);margin-top:auto}

/* ================= DETAIL PRODUK ================= */
.detail-img{width:100%;max-height:400px;background:#fff;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--border);margin-bottom:24px}
.detail-img img{max-width:100%;max-height:400px;object-fit:contain} /* Sesuai ukuran asli */
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.detail-title{font-size:24px;font-weight:800;margin:0;line-height:1.3}
.btn-icon{width:40px;height:40px;border-radius:50%;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);cursor:pointer;flex-shrink:0}
.price-box{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.meta-info{display:flex;gap:16px;font-size:13px;color:var(--text-muted);margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.hashtags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.hashtag{background:var(--primary-light);color:var(--primary);padding:4px 12px;border-radius:var(--radius-full);font-size:12px;font-weight:600}
.desc-title{font-size:16px;font-weight:700;margin:0 0 12px}
.desc-text{font-size:14px;line-height:1.7;color:var(--text-main);white-space:pre-wrap;margin-bottom:30px}

/* ================= FORM & BUTTONS ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:var(--radius-md);font-weight:700;font-size:15px;transition:0.2s;width:100%;cursor:pointer}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,0.3)}
.btn-primary:active{background:var(--primary-hover);transform:scale(0.98)}
.btn-outline{background:#fff;color:var(--text-main);border:1px solid var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-disabled{background:#e2e8f0;color:#94a3b8;cursor:not-allowed;box-shadow:none}
.input-field{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:14px;outline:none;background:#fff;margin-bottom:16px;font-family:inherit}
.input-field:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
textarea.input-field{min-height:100px;resize:vertical}

/* ================= MODALS ================= */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(5px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn 0.2s}
.modal-box{background:#fff;border-radius:24px;width:100%;max-width:400px;padding:30px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.2);animation:slideUp 0.3s;position:relative}
.modal-icon{width:60px;height:60px;background:var(--primary-light);color:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.modal-title{font-size:20px;font-weight:800;margin:0 0 10px}
.modal-desc{font-size:14px;color:var(--text-muted);margin-bottom:24px;line-height:1.6}
.close-btn{position:absolute;top:16px;right:16px;width:32px;height:32px;background:var(--bg-body);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-muted);cursor:pointer;border:none}

/* ================= UTILS & ANIMATIONS ================= */
.loading{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 24px;border-radius:var(--radius-full);font-size:14px;font-weight:500;z-index:2000;box-shadow:var(--shadow-lg);animation:slideDown 0.3s;display:flex;align-items:center;gap:8px}
@keyframes slideDown{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:14px;grid-column:1/-1}
.qris-box{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;text-align:center;margin-bottom:24px}
.qris-box img{width:100%;max-width:280px;margin:0 auto;border-radius:var(--radius-sm);border:1px solid var(--border)}
.timer{font-size:36px;font-weight:800;color:var(--danger);font-variant-numeric:tabular-nums;text-align:center;margin-bottom:20px}
</style>
</head>
<body>

<!-- HEADER -->
<header class="site">
  <a href="#home" class="brand">
    <img src="https://i.ibb.co.com/gLGhDr3Y/kodingankita-logo.jpg" alt="Logo">
    <span>KodinganKita</span>
  </a>
  <div class="search-bar">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="navSearch" placeholder="Cari produk keren..." onkeydown="if(event.key==='Enter') window.goSearch(this.value)">
  </div>
  <button id="authBtn" class="btn-login" onclick="handleAuth()">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="G">
    <span>Masuk</span>
  </button>
</header>

<!-- MAIN APP -->
<main id="app">
  <div class="loading"></div>
</main>

<!-- BOTTOM NAV (IPHONE DOCK) -->
<div class="bottom-nav-container">
  <div class="bottom-nav" id="bottomNav">
    <a href="#home" class="nav-item" data-nav="home">
      <div class="icon-wrap" id="nav-icon-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </div>
      <span>Beranda</span>
    </a>
    <a href="#catalog" class="nav-item" data-nav="catalog">
      <div class="icon-wrap" id="nav-icon-catalog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      </div>
      <span>Katalog</span>
    </a>
    <a href="#history" class="nav-item" data-nav="history">
      <div class="icon-wrap" id="nav-icon-history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 01-8 0"></path></svg>
      </div>
      <span>Riwayat</span>
    </a>
    <a href="#profile" class="nav-item" data-nav="profile">
      <div class="icon-wrap" id="nav-icon-profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <span>Profil</span>
    </a>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-container"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, onValue, set, push, runTransaction, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8",
  authDomain: "mybro-9ba5f.firebaseapp.com",
  databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com",
  projectId: "mybro-9ba5f",
  storageBucket: "mybro-9ba5f.firebasestorage.app",
  messagingSenderId: "820948893264",
  appId: "1:820948893264:web:e564509a8fdc4c56335b55"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rupiah = n => "Rp" + Number(n||0).toLocaleString("id-ID");
const QRIS_IMG = "https://i.ibb.co.com/FLF6Wz07/IMG-20261012-160202.jpg";

const state = {
  user: null,
  settings: {},
  products: {},
  shops: {},
  pendingProductId: null,
  orderTimer: null
};

// --- UTILS ---
function toast(msg, type="info") {
  const el = document.createElement("div");
  el.className = `toast`;
  if(type === 'error') el.style.background = 'var(--danger)';
  if(type === 'success') el.style.background = 'var(--success)';
  el.innerHTML = msg;
  $("#toast-container").appendChild(el);
  setTimeout(() => { el.style.opacity="0"; setTimeout(()=>el.remove(),300); }, 3000);
}

function closeModal() { $("#modal-root").innerHTML = ""; }

function createIframe(code, isRound = false) {
  const iframe = document.createElement("iframe");
  if (isRound) iframe.style.borderRadius = "50%";
  iframe.srcdoc = `<html><head><style>body{margin:0;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;background:transparent;}*{box-sizing:border-box;}</style></head><body>${code}</body></html>`;
  return iframe;
}

// --- LOGIKA PRODUK (FIX BUG TERJUAL) ---
function checkAvailability(p) {
  if (p.status === 'sold' || p.availability === 'sold') return false; // Benar-benar terjual
  if (p.status === 'reserved') {
    // Jika masih reserved tapi waktu habis, anggap tersedia
    if (p.reservedUntil && p.reservedUntil < Date.now()) return true;
    return false; // Sedang dikunci orang lain
  }
  return true; // Status available
}

// --- AUTHENTICATION ---
window.handleAuth = async () => {
  if (state.user) {
    if(confirm("Keluar dari akun?")) await signOut(auth);
  } else {
    try {
      await signInWithPopup(auth, provider);
    } catch(e) { toast("Gagal login: " + e.message, "error"); }
  }
};

onAuthStateChanged(auth, async user => {
  state.user = user;
  const btn = $("#authBtn");
  if(user) {
    btn.innerHTML = `<img src="${user.photoURL}" style="width:18px;height:18px;border-radius:50%"> <span>${user.displayName.split(' ')[0]}</span>`;
    const userRef = ref(db, `users/${user.uid}`);
    if(!(await get(userRef)).exists()) {
      await set(userRef, { displayName: user.displayName, email: user.email, photoURL: user.photoURL, createdAt: serverTimestamp() });
    }
  } else {
    btn.innerHTML = `<img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg"> <span>Masuk</span>`;
  }
  
  if(user && state.pendingProductId) {
    const pid = state.pendingProductId;
    state.pendingProductId = null;
    closeModal();
    buyFlow(pid);
  } else {
    render();
  }
});

// --- DATA LOADING ---
onValue(ref(db, "settings/marketplace"), snap => { state.settings = snap.val() || {}; render(); });
onValue(ref(db, "products"), snap => { state.products = snap.val() || {}; render(); });
onValue(ref(db, "shops"), snap => { state.shops = snap.val() || {}; render(); });

// --- ROUTER ---
window.goSearch = (q) => { location.hash = `#catalog?q=${encodeURIComponent(q)}`; };
function getRoute() {
  const hash = location.hash || '#home';
  const path = hash.split('?')[0].replace('#', '');
  const params = new URLSearchParams(hash.split('?')[1] || '');
  return { path, params };
}

window.addEventListener("hashchange", () => {
  if(state.orderTimer) clearInterval(state.orderTimer);
  window.scrollTo(0,0);
  render();
});

function render() {
  const { path, params } = getRoute();
  
  // Update Active Nav (Bawah)
  $$(".bottom-nav .nav-item").forEach(el => el.classList.toggle("active", el.dataset.nav === path));
  
  // Render Ikon Bawah Kustom dari Admin (jika ada)
  const defaultNavs = {
    home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>`,
    catalog: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>`,
    history: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 01-8 0"></path></svg>`,
    profile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`
  };
  
  if(state.settings.bottomMenus) {
    state.settings.bottomMenus.forEach(m => {
      const wrap = $(`#nav-icon-${m.id}`);
      if(wrap) { wrap.innerHTML = ""; wrap.appendChild(createIframe(m.code, false)); }
    });
  }

  if (path === 'home') renderHome();
  else if (path === 'catalog') renderCatalog(params);
  else if (path === 'product') renderProduct(params.get('id'));
  else if (path === 'order') renderOrder(params.get('id'));
  else if (path === 'history') renderHistory();
  else if (path === 'profile') renderProfile();
  else if (path === 'shop') renderShop(params.get('slug'));
  else renderHome();
}

// --- VIEW: HOME ---
function renderHome() {
  const s = state.settings;
  const latest = Object.entries(state.products)
    .map(([id, p]) => ({id, ...p}))
    .filter(p => p.status !== 'sold') // Hanya sembunyikan yang benar-benar terjual
    .sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 8);

  const defaultMenus = [
    { label: "Katalog", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>`, action: "#catalog" },
    { label: "Cari", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>`, action: "#catalog" },
    { label: "Jual", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><path d="M12 4v16m8-8H4"/></svg>`, action: "#seller" },
    { label: "Riwayat", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/></svg>`, action: "#history" }
  ];
  const menus = (s.menuItems && s.menuItems.length > 0) ? s.menuItems : defaultMenus;

  $("#app").innerHTML = `
    <div class="hero">
      <h1 class="hero-title">${esc(s.name || "KodinganKita")}</h1>

          <a href="${esc(m.action)}" class="quick-item">
            <div class="quick-icon" id="menu-icon-${i}"></div>

// --- VIEW: CATALOG ---
function renderCatalog(params) {
  const q = (params.get("q") || "").toLowerCase();
  let products = Object.entries(state.products).map(([id, p]) => ({id, ...p}))
    .filter(p => p.status !== 'sold'); // Sembunyikan yang sold

  if(q) {
    products = products.filter(p => 
      (p.title||"").toLowerCase().includes(q) || 
      (p.category||"").toLowerCase().includes(q) || 
      (p.description||"").toLowerCase().includes(q)
    );
  }

  $("#app").innerHTML = `
    <div class="container">
      <h2 class="section-title">Katalog Produk</h2>
      <input type="text" class="input-field" placeholder="Cari produk..." value="${esc(q)}" onkeydown="if(event.key==='Enter') window.goSearch(this.value)">
      
      <div class="grid">
        ${products.length ? products.map(p => `
          <a href="#product?id=${p.id}" class="card">
            <div class="card-img"><img src="${p.imageURLs?.[0] || 'https://placehold.co/400x400/f1f5f9/64748b?text=No+Image'}"></div>
            <div class="card-body">
              <div class="card-title">${esc(p.title)}</div>
              <div class="card-price">${rupiah(p.price)}</div>
            </div>
          </a>
        `).join("") : `<div class="empty-state">Produk tidak ditemukan.</div>`}
      </div>
    </div>
  `;
}

// --- LOGIC: BUY FLOW ---
window.buyFlow = async (productId) => {
  if(!state.user) {
    state.pendingProductId = productId;
    $("#modal-root").innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal-box">
          <button class="close-btn" onclick="closeModal()">&times;</button>
          <div class="modal-icon">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          </div>
          <h3 class="modal-title">Harap Masuk</h3>
          <p class="modal-desc">Silakan masuk dengan akun Google Anda untuk melanjutkan pembelian produk eksklusif ini.</p>
          <button class="btn btn-primary" onclick="handleAuth(); closeModal();" style="margin-bottom:10px">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" style="width:18px"> Masuk Google
          </button>
          <button class="btn btn-outline" onclick="closeModal()">Batal</button>
        </div>
      </div>`;
    return;
  }

  const product = state.products[productId];
  if(!checkAvailability(product)) return toast("Produk sudah terjual atau sedang dipesan.", "error");

  try {
    const orderRef = push(ref(db, 'orders'));
    const orderId = orderRef.key;
    const now = Date.now();
    const expiresAt = now + (3 * 60 * 1000); // 3 Menit

    // Kunci Produk
    const result = await runTransaction(ref(db, `products/${productId}`), (p) => {
      if (!p) return null;
      // Validasi ganda (apakah sudah terjual / direservasi?)
      if (p.status === 'sold' || (p.status === 'reserved' && p.reservedUntil > Date.now())) return null;
      return { ...p, status: 'reserved', availability: 'reserved', reservedBy: state.user.uid, reservedUntil: expiresAt, reservationOrderId: orderId };
    });

    if (!result.committed) return toast("Maaf, produk baru saja diambil orang lain.", "error");

    // Buat Pesanan
    const commRate = state.settings.commissionRate || 0.10;
    const price = Number(product.price);
    
    await set(orderRef, {
      buyerId: state.user.uid, buyerName: state.user.displayName,
      sellerId: product.sellerId || 'admin', shopId: product.shopId || 'admin', productId: productId,
      productTitleSnapshot: product.title, priceSnapshot: price,
      commissionSnapshot: price * commRate, sellerAmountSnapshot: price - (price * commRate),
      paymentStatus: 'pending', orderStatus: 'reserved',
      createdAt: now, expiresAt: expiresAt
    });

    location.hash = `#order?id=${orderId}`;
  } catch(e) { toast("Gagal membuat pesanan: " + e.message, "error"); }
};

// --- VIEW: PAYMENT ---
function renderOrder(orderId) {
  $("#app").innerHTML = `<div class="loading"></div>`;
  
  get(ref(db, `orders/${orderId}`)).then(snap => {
    const order = snap.val();
    if(!order) return $("#app").innerHTML = `<div class="empty-state">Pesanan tidak ditemukan.</div>`;
    if(order.buyerId !== state.user?.uid) return $("#app").innerHTML = `<div class="empty-state">Akses ditolak.</div>`;

    if(order.paymentStatus === 'paid') {
      return $("#app").innerHTML = `<div class="container" style="text-align:center;padding-top:60px"><h2 style="color:var(--success)">Pembayaran Berhasil</h2><p>Pesanan sudah lunas.</p><a href="#history" class="btn btn-primary" style="margin-top:20px">Lihat Riwayat</a></div>`;
    }

    const remain = order.expiresAt - Date.now();
    if(order.paymentStatus === 'expired' || remain <= 0) {
      expireOrder(orderId, order);
      return $("#app").innerHTML = `<div class="container" style="text-align:center;padding-top:60px"><h2 style="color:var(--danger)">Waktu Habis</h2><p>Pesanan dibatalkan otomatis.</p><a href="#catalog" class="btn btn-outline" style="margin-top:20px">Kembali</a></div>`;
    }

    $("#app").innerHTML = `
      <div class="container" style="max-width:480px">
        <h2 style="text-align:center;margin-bottom:20px">Selesaikan Pembayaran</h2>
        
        <div class="timer" id="timerDisplay">03:00</div>

        <div class="qris-box">
          <img src="${QRIS_IMG}">
          <p style="font-size:13px;color:var(--text-muted);margin-top:16px">Total: <b style="color:var(--primary);font-size:18px">${rupiah(order.priceSnapshot)}</b></p>
        </div>

        <button class="btn btn-primary" style="margin-bottom:12px" onclick="confirmPayment('${orderId}', this)">Saya Sudah Bayar</button>
        <button class="btn btn-outline" onclick="cancelOrder('${orderId}', '${order.productId}')">Batalkan Pesanan</button>
      </div>
    `;

    if(state.orderTimer) clearInterval(state.orderTimer);
    const tick = () => {
      const r = order.expiresAt - Date.now();
      if(r <= 0) { clearInterval(state.orderTimer); expireOrder(orderId, order); return; }
      const m = Math.floor(r / 60000), s = Math.floor((r % 60000) / 1000);
      const el = $("#timerDisplay");
      if(el) el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    };
    tick();
    state.orderTimer = setInterval(tick, 1000);
  });
}

window.confirmPayment = async (orderId, btn) => {
  if(!confirm("Pastikan Anda sudah mentransfer dana. Lanjutkan?")) return;
  btn.textContent = "Memproses..."; btn.disabled = true;
  await update(ref(db, `orders/${orderId}`), { paymentStatus: 'awaiting_verification' });
  clearInterval(state.orderTimer);
  toast("Konfirmasi terkirim. Menunggu verifikasi Admin.", "success");
  location.hash = "#history";
};

window.cancelOrder = async (orderId, productId) => {
  if(!confirm("Batalkan pesanan ini?")) return;
  await runTransaction(ref(db, `products/${productId}`), (p) => {
    if(!p || p.reservationOrderId !== orderId) return p;
    return { ...p, status: 'available', availability: 'available', reservedBy: null, reservationOrderId: null };
  });
  await update(ref(db, `orders/${orderId}`), { paymentStatus: 'cancelled', orderStatus: 'cancelled' });
  clearInterval(state.orderTimer);
  location.hash = "#catalog";
};

async function expireOrder(orderId, order) {
  await runTransaction(ref(db, `products/${order.productId}`), (p) => {
    if(!p || p.reservationOrderId !== orderId) return p;
    return { ...p, status: 'available', availability: 'available', reservedBy: null, reservationOrderId: null };
  });
  await update(ref(db, `orders/${orderId}`), { paymentStatus: 'expired', orderStatus: 'expired' });
  if(state.orderTimer) clearInterval(state.orderTimer);
  toast("Waktu habis. Pesanan dibatalkan.", "error");
  renderOrder(orderId); 
}

// --- VIEW: RIWAYAT (History) ---
async function renderHistory() {
  if(!state.user) return $("#app").innerHTML = `<div class="container"><div class="empty-state">Login untuk melihat riwayat.</div></div>`;
  
  $("#app").innerHTML = `<div class="loading"></div>`;
  const snap = await get(ref(db, 'orders'));
  const all = snap.val() || {};
  const myOrders = Object.entries(all).map(([id, o]) => ({id, ...o}))
    .filter(o => o.buyerId === state.user.uid)
    .sort((a,b) => b.createdAt - a.createdAt);

  $("#app").innerHTML = `
    <div class="container">
      <h2 class="section-title">Riwayat Pembelian</h2>
      ${myOrders.length ? myOrders.map(o => `
        <div class="card" style="padding:16px;margin-bottom:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap">
          <div style="flex:1;min-width:200px">
            <div style="font-weight:700;font-size:15px">${esc(o.productTitleSnapshot)}</div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:4px">${new Date(o.createdAt).toLocaleDateString('id-ID')}</div>
            <div style="margin-top:8px">
              ${o.paymentStatus === 'paid' ? `<span style="color:var(--success);font-weight:700;font-size:12px">LUNAS</span>` : 
                o.paymentStatus === 'awaiting_verification' ? `<span style="color:var(--warning);font-weight:700;font-size:12px">MENUNGGU VERIFIKASI</span>` :
                o.paymentStatus === 'pending' ? `<span style="color:var(--warning);font-weight:700;font-size:12px">BELUM DIBAYAR</span>` :
                `<span style="color:var(--danger);font-weight:700;font-size:12px">DIBATALKAN</span>`}
            </div>
          </div>
          <div style="text-align:right">
            <div style="font-weight:800;color:var(--primary);margin-bottom:10px">${rupiah(o.priceSnapshot)}</div>
            ${o.paymentStatus === 'paid' 
              ? `<button class="btn btn-primary" style="width:auto;padding:8px 16px" onclick="downloadFile('${o.id}')">Unduh File</button>`
              : o.paymentStatus === 'pending' 
              ? `<a href="#order?id=${o.id}" class="btn btn-outline" style="width:auto;padding:8px 16px">Bayar</a>`
              : ''}
          </div>
        </div>
      `).join('') : `<div class="empty-state">Belum ada riwayat pembelian.</div>`}
    </div>
  `;
}

window.downloadFile = async (orderId) => {
  toast("Memeriksa akses...");
  const oSnap = await get(ref(db, `orders/${orderId}`));
  const o = oSnap.val();
  if(o.paymentStatus !== 'paid') return toast("Pembayaran belum lunas", "error");
  
  const pSnap = await get(ref(db, `products/${o.productId}`));
  const fileUrl = pSnap.val()?.fileDownloadURL;
  if(fileUrl) {
    window.open(fileUrl, '_blank');
  } else {
    alert("File produk belum diunggah oleh Admin/Penjual.");
  }
};

        <p style="color:var(--text-muted);margin:4px 0 0">${esc(state.user.email)}</p>
      </div>

      ${myShop ? `
        <div class="card" style="padding:20px;text-align:center">
          <h3 style="margin:0 0 10px">Toko Anda</h3>
          <p style="font-weight:700;font-size:18px;color:var(--primary);margin-bottom:16px">${esc(myShop[1].name)}</p>

          <h3 style="margin-top:0;text-align:center">Buka Toko Baru</h3>
          <form id="formSeller">
            <input type="text" class="input-field" name="shopName" placeholder="Nama Toko" required>
            <input type="text" class="input-field" name="slug" placeholder="Slug (huruf kecil, tanpa spasi)" pattern="[a-z0-9-]+" required>
            <textarea class="input-field" name="description" placeholder="Deskripsi Toko" required></textarea>
            <input type="text" class="input-field" name="ownerName" placeholder="Nama Pemilik" required>
            <input type="text" class="input-field" name="contact" placeholder="Kontak (WA/Email)" required>
            <button type="submit" class="btn btn-primary">Ajukan Toko</button>

  const [shopId, shop] = shopEntry;
  
  const products = Object.entries(state.products).map(([id, p]) => ({id, ...p}))
