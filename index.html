/* ---------- Admin: Reports ---------- */
async function adminReports() {
  let orders = [];
  try {
    const s = await get(ref(db, 'orders'));
    if (s.exists()) orders = Object.values(s.val());
  } catch {}

  const paid = orders.filter(o => o.paymentStatus === 'paid' || o.orderStatus === 'completed');
  const revenue = paid.reduce((s,o) => s + (Number(o.total)||0), 0);

  const byProduct = {};
  paid.forEach(o => (o.items||[]).forEach(it => {
    byProduct[it.productId] = byProduct[it.productId] || { name: it.name, qty: 0, revenue: 0 };
    byProduct[it.productId].qty += Number(it.qty)||0;
    byProduct[it.productId].revenue += Number(it.lineTotal)||0;
  }));

  const byMethod = {};
  paid.forEach(o => {
    const k = o.paymentMethodLabel || o.paymentMethod || 'Lainnya';
    byMethod[k] = byMethod[k] || { count:0, revenue:0 };
    byMethod[k].count++;
    byMethod[k].revenue += Number(o.total)||0;
  });

  const byCategory = {};
  paid.forEach(o => (o.items||[]).forEach(it => {
    const prod = findProduct(it.productId);
    const cid = prod?.categoryId || 'lainnya';
    const cname = state.categories.find(c => c.categoryId === cid)?.name || 'Lainnya';
    byCategory[cname] = byCategory[cname] || { qty:0, revenue:0 };
    byCategory[cname].qty += Number(it.qty)||0;
    byCategory[cname].revenue += Number(it.lineTotal)||0;
  }));

  return `
    <div class="sec-head">
      <div><h2>Laporan</h2><div class="sub">Data hanya dari transaksi terverifikasi</div></div>
      <button class="btn btn-outline" id="exportCsvBtn"><i class="fa-solid fa-file-csv"></i> Ekspor CSV</button>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><div class="s-top"><div class="stat-ico i-green"><i class="fa-solid fa-money-bill-wave"></i></div></div><div class="s-val">${rupiah(revenue)}</div><div class="s-lab">Total Pendapatan</div></div>
      <div class="stat-card"><div class="s-top"><div class="stat-ico i-blue"><i class="fa-solid fa-receipt"></i></div></div><div class="s-val">${paid.length}</div><div class="s-lab">Transaksi Berhasil</div></div>
      <div class="stat-card"><div class="s-top"><div class="stat-ico i-amber"><i class="fa-solid fa-clock"></i></div></div><div class="s-val">${orders.filter(o=>o.paymentStatus==='pending').length}</div><div class="s-lab">Transaksi Pending</div></div>
      <div class="stat-card"><div class="s-top"><div class="stat-ico i-purple"><i class="fa-solid fa-rotate-left"></i></div></div><div class="s-val">${orders.filter(o=>o.orderStatus==='refunded').length}</div><div class="s-lab">Refund</div></div>
    </div>

    <div class="detail-grid" style="grid-template-columns:1fr 1fr;gap:20px">
      <div class="card card-pad">
        <h3 style="font-size:15px;margin-bottom:12px">Penjualan per Produk</h3>
        ${Object.values(byProduct).length ? `<div class="table-wrap" style="border:none"><table style="min-width:auto">
          <thead><tr><th>Produk</th><th>Qty</th><th>Pendapatan</th></tr></thead>
          <tbody>${Object.values(byProduct).sort((a,b)=>b.revenue-a.revenue).map(p => `
            <tr><td class="text-sm">${esc(p.name)}</td><td>${p.qty}</td><td style="font-weight:700">${rupiah(p.revenue)}</td></tr>`).join('')}
          </tbody></table></div>` : '<p class="text-sm text-muted">Belum ada data.</p>'}
      </div>

      <div class="card card-pad">
        <h3 style="font-size:15px;margin-bottom:12px">Penjualan per Metode</h3>
        ${Object.keys(byMethod).length ? `<div class="table-wrap" style="border:none"><table style="min-width:auto">
          <thead><tr><th>Metode</th><th>Transaksi</th><th>Pendapatan</th></tr></thead>
          <tbody>${Object.entries(byMethod).sort((a,b)=>b[1].revenue-a[1].revenue).map(([k,v]) => `
            <tr><td class="text-sm">${esc(k)}</td><td>${v.count}</td><td style="font-weight:700">${rupiah(v.revenue)}</td></tr>`).join('')}
          </tbody></table></div>` : '<p class="text-sm text-muted">Belum ada data.</p>'}
      </div>

      <div class="card card-pad">
        <h3 style="font-size:15px;margin-bottom:12px">Penjualan per Kategori</h3>
        ${Object.keys(byCategory).length ? `<div class="table-wrap" style="border:none"><table style="min-width:auto">
          <thead><tr><th>Kategori</th><th>Qty</th><th>Pendapatan</th></tr></thead>
          <tbody>${Object.entries(byCategory).sort((a,b)=>b[1].revenue-a[1].revenue).map(([k,v]) => `
            <tr><td class="text-sm">${esc(k)}</td><td>${v.qty}</td><td style="font-weight:700">${rupiah(v.revenue)}</td></tr>`).join('')}
          </tbody></table></div>` : '<p class="text-sm text-muted">Belum ada data.</p>'}
      </div>

      <div class="card card-pad">
        <h3 style="font-size:15px;margin-bottom:12px">Ringkasan Status</h3>
        <div class="summary-row"><span>Menunggu Pembayaran</span><span class="v">${orders.filter(o=>o.paymentStatus==='pending').length}</span></div>
        <div class="summary-row"><span>Menunggu Verifikasi</span><span class="v">${orders.filter(o=>o.paymentStatus==='awaiting_verification').length}</span></div>
        <div class="summary-row"><span>Dibayar</span><span class="v">${orders.filter(o=>o.paymentStatus==='paid').length}</span></div>
        <div class="summary-row"><span>Selesai</span><span class="v">${orders.filter(o=>o.orderStatus==='completed').length}</span></div>
        <div class="summary-row"><span>Ditolak</span><span class="v">${orders.filter(o=>o.paymentStatus==='rejected').length}</span></div>
      </div>
    </div>`;
}

/* ---------- Admin: Audit Log ---------- */
async function adminAudit() {
  let logs = [];
  try {
    const s = await get(ref(db, 'auditLogs'));
    if (s.exists()) logs = Object.values(s.val()).sort((a,b) => (Number(b.createdAt)||0) - (Number(a.createdAt)||0));
  } catch {}

  return `
    <div class="sec-head">
      <div><h2>Audit Log</h2><div class="sub">${logs.length} aktivitas tercatat</div></div>
    </div>
    ${logs.length ? `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Waktu</th><th>Aktor</th><th>Aksi</th><th>Deskripsi</th></tr></thead>
        <tbody>
          ${logs.slice(0,300).map(l => `
            <tr>
              <td class="text-xs text-muted">${fmtDate(l.createdAt)}</td>
              <td>
                <div class="text-sm" style="font-weight:600">${esc(l.actorName || '-')}</div>
                <div class="text-xs text-muted">${esc(l.actorEmail || '')}</div>
              </td>
              <td><span class="chip">${esc(l.action || '-')}</span></td>
              <td class="text-sm">${esc(l.description || '')}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>` : emptyState('fa-solid fa-clipboard-list','Belum Ada Log','Aktivitas penting akan tercatat di sini.','')}
  `;
}

/* ============================================================
   25. ADMIN EVENT BINDING
   ============================================================ */
function bindAdminPage(section) {
  const addBtn = $('#addProductBtn') || $('#addProductBtn2');
  if (addBtn) addBtn.onclick = () => productFormModal(null);

  $$('[data-edit-product]').forEach(b => b.onclick = () => {
    const p = findProduct(b.dataset.editProduct);
    if (p) productFormModal(p);
  });

  $$('[data-toggle-product]').forEach(b => b.onclick = async () => {
    const p = findProduct(b.dataset.toggleProduct);
    if (!p) return;
    try {
      await update(ref(db, `products/${p.productId}`), { published: p.published === false, updatedAt: serverTimestamp() });
      await logAudit('product_toggle', `Status produk diubah: ${p.name}`, { productId: p.productId });
      toast('Status produk diubah.', 'ok');
    } catch (e) { toast('Gagal: ' + e.message, 'err'); }
  });

  $$('[data-delete-product]').forEach(b => b.onclick = async () => {
    const p = findProduct(b.dataset.deleteProduct);
    if (!p) return;
    const ok = await confirmDialog({ title:'Hapus Produk', message:`Hapus "${p.name}" secara permanen? Tindakan ini tidak dapat dibatalkan.`, confirmText:'Hapus Permanen', danger:true });
    if (!ok) return;
    try {
      await remove(ref(db, `products/${p.productId}`));
      await logAudit('product_delete', `Produk dihapus: ${p.name}`, { productId: p.productId });
      toast('Produk dihapus.', 'ok');
    } catch (e) { toast('Gagal menghapus: ' + e.message, 'err'); }
  });

  const addCat = $('#addCategoryBtn');
  if (addCat) addCat.onclick = () => categoryFormModal(null);

  $$('[data-edit-cat]').forEach(b => b.onclick = () => {
    const c = state.categories.find(x => x.categoryId === b.dataset.editCat);
    if (c) categoryFormModal(c);
  });

  $$('[data-del-cat]').forEach(b => b.onclick = async () => {
    const c = state.categories.find(x => x.categoryId === b.dataset.delCat);
    if (!c) return;
    const ok = await confirmDialog({ title:'Hapus Kategori', message:`Hapus kategori "${c.name}"? Produk dengan kategori ini tidak akan terhapus.`, confirmText:'Hapus', danger:true });
    if (!ok) return;
    try {
      await remove(ref(db, `categories/${c.categoryId}`));
      await logAudit('category_delete', `Kategori dihapus: ${c.name}`, { categoryId: c.categoryId });
      toast('Kategori dihapus.', 'ok');
    } catch (e) { toast('Gagal: ' + e.message, 'err'); }
  });

  const seedCat = $('#seedCategoriesBtn');
  if (seedCat) seedCat.onclick = async () => {
    const ok = await confirmDialog({ title:'Muat Kategori Default', message:'Kategori default CAZOO akan ditulis ke database. Kategori dengan ID sama akan ditimpa.', confirmText:'Muat' });
    if (!ok) return;
    try {
      for (const c of DEFAULT_CATEGORIES) {
        await set(ref(db, `categories/${c.categoryId}`), { ...c, updatedAt: serverTimestamp() });
      }
      await logAudit('category_seed', 'Kategori default dimuat', {});
      toast('Kategori default dimuat.', 'ok');
    } catch (e) { toast('Gagal: ' + e.message, 'err'); }
  };

  const orderSearch = $('#aOrderSearch');
  const orderStatus = $('#aOrderStatus');
  const refilter = debounce(async () => {
    const box = $('#adminOrdersTable');
    if (!box) return;
    let orders = [];
    try {
      const s = await get(ref(db, 'orders'));
      if (s.exists()) orders = Object.values(s.val());
    } catch { return; }
    const q = (orderSearch?.value || '').toLowerCase().trim();
    const st = orderStatus?.value || '';
    if (q) orders = orders.filter(o =>
      String(o.orderNumber||'').toLowerCase().includes(q) ||
      String(o.customerEmail||'').toLowerCase().includes(q) ||
      String(o.orderId||'').toLowerCase().includes(q));
    if (st) orders = orders.filter(o => o.paymentStatus === st || o.orderStatus === st);
    orders.sort((a,b) => (Number(b.createdAt)||0) - (Number(a.createdAt)||0));
    box.innerHTML = renderAdminOrdersTable(orders);
    bindOrderActionButtons();
  }, 280);

  if (orderSearch) orderSearch.oninput = refilter;
  if (orderStatus) orderStatus.onchange = refilter;
  bindOrderActionButtons();

  const addMethod = $('#addMethodBtn');
  if (addMethod) addMethod.onclick = () => methodFormModal(null);

  $$('[data-edit-method]').forEach(b => b.onclick = () => {
    const m = state.methods[b.dataset.editMethod];
    if (m) methodFormModal(m);
  });

  const seedMethods = $('#seedMethodsBtn');
  if (seedMethods) seedMethods.onclick = async () => {
    const ok = await confirmDialog({ title:'Muat Metode Default', message:'Metode pembayaran default CAZOO akan ditulis ke database.', confirmText:'Muat' });
    if (!ok) return;
    try {
      for (const [id, m] of Object.entries(DEFAULT_METHODS)) {
        await set(ref(db, `paymentMethods/${id}`), { ...m, updatedAt: serverTimestamp() });
      }
      await logAudit('payment_seed', 'Metode pembayaran default dimuat', {});
      toast('Metode default dimuat.', 'ok');
    } catch (e) { toast('Gagal: ' + e.message, 'err'); }
  };

  const addPromo = $('#addPromoBtn') || $('#addPromoBtn2');
  if (addPromo) addPromo.onclick = () => promoFormModal(null);

  $$('[data-edit-promo]').forEach(b => b.onclick = () => {
    const p = state.promotions[b.dataset.editPromo];
    if (p) promoFormModal(p);
  });

  $$('[data-del-promo]').forEach(b => b.onclick = async () => {
    const p = state.promotions[b.dataset.delPromo];
    if (!p) return;
    const ok = await confirmDialog({ title:'Hapus Promo', message:`Hapus kode promo "${p.code}"?`, confirmText:'Hapus', danger:true });
    if (!ok) return;
    try {
      await remove(ref(db, `promotions/${p.promotionId}`));
      toast('Promo dihapus.', 'ok');
    } catch (e) { toast('Gagal: ' + e.message, 'err'); }
  });

  $$('[data-approve-review]').forEach(b => b.onclick = async () => {
    try {
      await update(ref(db, `reviews/${b.dataset.approveReview}`), { status:'approved', reviewedAt: serverTimestamp() });
      toast('Ulasan disetujui.', 'ok');
    } catch (e) { toast('Gagal: ' + e.message, 'err'); }
  });
  $$('[data-reject-review]').forEach(b => b.onclick = async () => {
    try {
      await update(ref(db, `reviews/${b.dataset.rejectReview}`), { status:'rejected', reviewedAt: serverTimestamp() });
      toast('Ulasan ditolak.', 'ok');
    } catch (e) { toast('Gagal: ' + e.message, 'err'); }
  });

  $$('[data-make-admin]').forEach(b => b.onclick = async () => {
    const uid = b.dataset.makeAdmin;
    const ok = await confirmDialog({
      title:'Jadikan Administrator',
      message:'Pengguna ini akan mendapatkan akses penuh ke panel admin. Pastikan Anda mengenal pengguna ini.',
      confirmText:'Jadikan Admin',
      danger: true
    });
    if (!ok) return;
    try {
      await set(ref(db, `adminRoles/${uid}`), { enabled: true, role:'admin', grantedBy: state.user.uid, grantedAt: serverTimestamp() });
      await logAudit('admin_grant', `Hak admin diberikan ke ${uid}`, { uid });
      toast('Hak admin diberikan.', 'ok');
    } catch (e) { toast('Gagal: ' + e.message + ' (cek Database Rules untuk /adminRoles)', 'err'); }
  });

  const settingsForm = $('#settingsForm');
  if (settingsForm) settingsForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(settingsForm);
    const btn = settingsForm.querySelector('button[type=submit]');
    setBtnLoading(btn, true);
    try {
      await update(ref(db, 'storeSettings'), {
        storeName: String(fd.get('storeName') || 'CAZOO').trim(),
        tagline: String(fd.get('tagline') || '').trim(),
        supportEmail: String(fd.get('supportEmail') || '').trim(),
        supportWhatsapp: String(fd.get('supportWhatsapp') || '').trim(),
        announcement: String(fd.get('announcement') || '').trim(),
        maintenance: settingsForm.querySelector('[name=maintenance]').checked,
        updatedAt: serverTimestamp()
      });
      await logAudit('settings_update', 'Pengaturan toko diperbarui', {});
      toast('Pengaturan disimpan.', 'ok');
    } catch (err) { toast('Gagal: ' + err.message, 'err'); }
    finally { setBtnLoading(btn, false); }
  };

  const homeForm = $('#homepageForm');
  if (homeForm) homeForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(homeForm);
    const btn = homeForm.querySelector('button[type=submit]');
    setBtnLoading(btn, true);
    try {
      await update(ref(db, 'homepage'), {
        heroBadge: String(fd.get('heroBadge') || '').trim(),
        heroTitle: String(fd.get('heroTitle') || '').trim(),
        heroSubtitle: String(fd.get('heroSubtitle') || '').trim(),
        heroPrimaryLabel: String(fd.get('heroPrimaryLabel') || '').trim(),
        heroSecondaryLabel: String(fd.get('heroSecondaryLabel') || '').trim(),
        promoEnabled: homeForm.querySelector('[name=promoEnabled]').checked,
        promoTitle: String(fd.get('promoTitle') || '').trim(),
        promoText: String(fd.get('promoText') || '').trim(),
        promoCode: String(fd.get('promoCode') || '').trim().toUpperCase(),
        promoDiscountText: String(fd.get('promoDiscountText') || '').trim(),
        updatedAt: serverTimestamp()
      });
      await logAudit('homepage_update', 'Konten beranda diperbarui', {});
      toast('Konten beranda disimpan.', 'ok');
    } catch (err) { toast('Gagal: ' + err.message, 'err'); }
    finally { setBtnLoading(btn, false); }
  };

  const legalForm = $('#legalForm');
  if (legalForm) legalForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(legalForm);
    const btn = legalForm.querySelector('button[type=submit]');
    setBtnLoading(btn, true);
    try {
      await update(ref(db, 'storeSettings'), {
        footerAbout: String(fd.get('footerAbout') || '').trim(),
        terms: String(fd.get('terms') || '').trim(),
        privacy: String(fd.get('privacy') || '').trim(),
        refundPolicy: String(fd.get('refundPolicy') || '').trim(),
        updatedAt: serverTimestamp()
      });
      await logAudit('legal_update', 'Konten legal diperbarui', {});
      toast('Konten legal disimpan.', 'ok');
    } catch (err) { toast('Gagal: ' + err.message, 'err'); }
    finally { setBtnLoading(btn, false); }
  };

  const seedAll = $('#seedAllBtn');
  if (seedAll) seedAll.onclick = async () => {
    const ok = await confirmDialog({
      title:'Isi Data Awal',
      message:'Data default (kategori, metode pembayaran, pengaturan, konten beranda) akan ditulis ke database. Data yang ada dengan ID sama akan ditimpa.',
      confirmText:'Isi Data'
    });
    if (!ok) return;
    setBtnLoading(seedAll, true, 'Mengisi...');
    try {
      for (const c of DEFAULT_CATEGORIES) await set(ref(db, `categories/${c.categoryId}`), { ...c, updatedAt: serverTimestamp() });
      for (const [id, m] of Object.entries(DEFAULT_METHODS)) await set(ref(db, `paymentMethods/${id}`), { ...m, updatedAt: serverTimestamp() });
      await update(ref(db, 'storeSettings'), { ...DEFAULT_SETTINGS, updatedAt: serverTimestamp() });
      await update(ref(db, 'homepage'), { ...DEFAULT_HOMEPAGE, updatedAt: serverTimestamp() });
      await logAudit('seed_all', 'Data awal dimuat', {});
      toast('Data awal berhasil dimuat.', 'ok');
    } catch (e) { toast('Gagal: ' + e.message, 'err'); }
    finally { setBtnLoading(seedAll, false); }
  };

  const exportBtn = $('#exportCsvBtn');
  if (exportBtn) exportBtn.onclick = async () => {
    try {
      const s = await get(ref(db, 'orders'));
      const orders = s.exists() ? Object.values(s.val()) : [];
      const rows = [['Order Number','Tanggal','Pembeli','Email','Total','Metode','Status Pembayaran','Status Pesanan']];
      orders.sort((a,b)=>(Number(b.createdAt)||0)-(Number(a.createdAt)||0)).forEach(o => {
        rows.push([
          o.orderNumber || o.orderId,
          fmtDate(o.createdAt),
          o.customerName || '',
          o.customerEmail || '',
          String(o.total || 0),
          o.paymentMethodLabel || o.paymentMethod || '',
          o.paymentStatus || '',
          o.orderStatus || ''
        ]);
      });
      const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cazoo-orders-${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      toast('CSV berhasil diekspor.', 'ok');
      await logAudit('report_export', 'Ekspor CSV pesanan', { count: orders.length });
    } catch (e) { toast('Gagal ekspor: ' + e.message, 'err'); }
  };
}

async function approveOrder(orderId) {
  const ok = await confirmDialog({
    title: 'Setujui Pembayaran',
    message: 'Pesanan akan ditandai sebagai Dibayar dan Selesai, serta produk digital akan diberikan kepada pembeli. Pastikan pembayaran benar-benar sudah diterima.',
    confirmText: 'Setujui & Berikan Akses'
  });
  if (!ok) return;

  try {
    const s = await get(ref(db, `orders/${orderId}`));
    if (!s.exists()) { toast('Pesanan tidak ditemukan.', 'err'); return; }
    const o = s.val();

    if (o.paymentStatus === 'paid' || o.orderStatus === 'completed') {
      toast('Pesanan ini sudah diproses sebelumnya.', 'warn');
      return;
    }

    const now = Date.now();

    await update(ref(db, `orders/${orderId}`), {
      paymentStatus: 'paid',
      orderStatus: 'completed',
      verifiedBy: state.user.uid,
      verifiedAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });

    for (const it of (o.items || [])) {
      const prod = findProduct(it.productId) || {};
      const purchaseRef = ref(db, `purchases/${o.uid}/${orderId}_${it.productId}`);
      await set(purchaseRef, {
        purchaseId: `${orderId}_${it.productId}`,
        orderId,
        orderNumber: o.orderNumber || orderId,
        uid: o.uid,
        productId: it.productId,
        productName: it.name,
        purchasedAt: now,
        accessStatus: 'active',
        licenseKey: 'CZ-' + uid8() + '-' + uid8(),
        downloadUrl: prod?.asset?.downloadUrl || prod?.downloadUrl || ''
      });

      if (prod?.productId) {
        const newSales = (Number(prod.sales) || 0) + (Number(it.qty) || 1);
        await update(ref(db, `products/${prod.productId}`), { sales: newSales });
      }
    }

    try {
      const cs = await get(ref(db, 'paymentConfirmations'));
      if (cs.exists()) {
        const found = Object.entries(cs.val()).find(([,c]) => c.orderId === orderId && c.status === 'awaiting_verification');
        if (found) {
          await update(ref(db, `paymentConfirmations/${found[0]}`), {
            status: 'approved',
            reviewedBy: state.user.uid,
            reviewedAt: serverTimestamp()
          });
        }
      }
    } catch {}

    await logAudit('order_approve', `Pembayaran disetujui untuk ${o.orderNumber || orderId}`, { orderId, total: o.total });
    toast('Pembayaran disetujui. Produk telah diberikan ke pembeli.', 'ok');
    render();
  } catch (e) {
    console.error(e);
    toast('Gagal menyetujui: ' + e.message, 'err');
  }
}

async function rejectOrder(orderId) {
  const wrap = openModal({
    title: 'Tolak Pembayaran',
    body: `
      <div class="field">
        <label class="label">Alasan Penolakan <span class="req">*</span></label>
        <textarea class="textarea" id="rejectReason" placeholder="Contoh: Bukti pembayaran tidak ditemukan / nominal tidak sesuai" style="min-height:90px"></textarea>
      </div>`,
    footer: `
      <button class="btn btn-outline" data-close>Batal</button>
      <button class="btn btn-danger" id="confirmReject">Tolak Pembayaran</button>`,
    onMount(w) {
      w.querySelector('#confirmReject').onclick = async () => {
        const reason = String(w.querySelector('#rejectReason').value || '').trim();
        if (reason.length < 5) { toast('Alasan minimal 5 karakter.', 'warn'); return; }
        const btn = w.querySelector('#confirmReject');
        setBtnLoading(btn, true);
        try {
          await update(ref(db, `orders/${orderId}`), {
            paymentStatus: 'rejected',
            orderStatus: 'rejected',
            rejectionReason: reason,
            reviewedBy: state.user.uid,
            updatedAt: serverTimestamp()
          });
          try {
            const cs = await get(ref(db, 'paymentConfirmations'));
            if (cs.exists()) {
              const found = Object.entries(cs.val()).find(([,c]) => c.orderId === orderId && c.status === 'awaiting_verification');
              if (found) {
                await update(ref(db, `paymentConfirmations/${found[0]}`), {
                  status: 'rejected',
                  reviewedBy: state.user.uid,
                  reviewNote: reason,
                  reviewedAt: serverTimestamp()
                });
              }
            }
          } catch {}
          await logAudit('order_reject', `Pembayaran ditolak: ${reason}`, { orderId });
          toast('Pembayaran ditolak.', 'ok');
          closeModal();
          render();
        } catch (e) {
          setBtnLoading(btn, false);
          toast('Gagal: ' + e.message, 'err');
        }
      };
    }
  });
}

      `,
      footer: `
        <button class="btn btn-outline" data-close>Tutup</button>
        ${c.status === 'awaiting_verification' ? `
          <button class="btn btn-danger" id="mReject">Tolak</button>

      }
    });
  } catch (e) { toast('Gagal memuat: ' + e.message, 'err'); }
}

  try {
    const s = await get(ref(db, `paymentConfirmations/${confirmationId}`));
    if (!s.exists()) { toast('Konfirmasi tidak ditemukan.', 'err'); return; }
    const c = s.val();
    await approveOrder(c.orderId);
  } catch (e) { toast('Gagal: ' + e.message, 'err'); }
}

async function rejectConfirmation(confirmationId) {
  try {
    const s = await get(ref(db, `paymentConfirmations/${confirmationId}`));
    if (!s.exists()) { toast('Konfirmasi tidak ditemukan.', 'err'); return; }
    const c = s.val();
    await rejectOrder(c.orderId);
  } catch (e) { toast('Gagal: ' + e.message, 'err'); }
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('#iPaidBtn');
  if (!btn) return;
  const orderId = location.hash.split('/')[2];
  if (!orderId) return;

  openModal({
    title: 'Konfirmasi Pembayaran',
    subtitle: 'Kirim bukti pembayaran Anda untuk diverifikasi admin',
    body: `
      <div class="alert alert-info mb-3" style="font-size:13px">
        <i class="fa-solid fa-circle-info"></i>
        <div>Pastikan Anda sudah melakukan pembayaran sesuai nominal. Status pesanan akan berubah menjadi <strong>Dibayar</strong> setelah admin memverifikasi.</div>
      </div>
      <form id="confirmForm">
        <div class="field">
          <label class="label">Nomor Referensi / ID Transaksi <span class="req">*</span></label>
          <input class="input" name="referenceNumber" required placeholder="Contoh: 20250101ABC123" maxlength="80">
        </div>
        <div class="field">
          <label class="label">URL Bukti Pembayaran (opsional)</label>
          <input class="input" name="proofUrl" placeholder="https://... (tautan screenshot bukti transfer)">
          <div class="form-hint">Untuk produksi, gunakan Firebase Storage dengan Storage Rules terbatas.</div>
        </div>
        <div class="field">
          <label class="label">Catatan (opsional)</label>
          <textarea class="textarea" name="note" style="min-height:70px" placeholder="Informasi tambahan untuk admin"></textarea>
        </div>
      </form>`,
    footer: `
      <button class="btn btn-outline" data-close>Batal</button>
      <button class="btn btn-primary" id="submitConfirm">Kirim Konfirmasi</button>`,
    onMount(w) {
      w.querySelector('#submitConfirm').onclick = async () => {
        const form = w.querySelector('#confirmForm');
        if (!form.reportValidity()) return;
        const fd = new FormData(form);
        const referenceNumber = String(fd.get('referenceNumber') || '').trim();
        if (referenceNumber.length < 4) { toast('Nomor referensi minimal 4 karakter.', 'warn'); return; }

        const btn = w.querySelector('#submitConfirm');
        setBtnLoading(btn, true, 'Mengirim...');

        try {
          const os = await get(ref(db, `orders/${orderId}`));
          if (!os.exists()) throw new Error('Pesanan tidak ditemukan.');
          const order = os.val();

          if (order.uid !== state.user.uid) throw new Error('Anda tidak berhak atas pesanan ini.');
          if (order.paymentStatus === 'paid' || order.orderStatus === 'completed') throw new Error('Pesanan ini sudah dibayar.');
          if (order.paymentStatus === 'awaiting_verification') throw new Error('Konfirmasi Anda sedang menunggu verifikasi admin.');

          const cs = await get(ref(db, 'paymentConfirmations'));
          if (cs.exists()) {
            const dup = Object.values(cs.val()).find(c =>
              String(c.referenceNumber || '').toLowerCase() === referenceNumber.toLowerCase() &&
              c.orderId !== orderId && c.status !== 'rejected');
            if (dup) throw new Error('Nomor referensi ini sudah digunakan untuk pesanan lain.');
          }

          const confRef = push(ref(db, 'paymentConfirmations'));
          await set(confRef, {
            confirmationId: confRef.key,
            orderId,
            orderNumber: order.orderNumber || orderId,
            uid: state.user.uid,
            customerEmail: state.user.email || '',
            customerName: state.user.displayName || '',
            paymentMethod: order.paymentMethodLabel || order.paymentMethod || '',
            amount: order.total,
            referenceNumber,
            proofUrl: String(fd.get('proofUrl') || '').trim(),
            note: String(fd.get('note') || '').trim(),
            status: 'awaiting_verification',
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });

          await update(ref(db, `orders/${orderId}`), {
            paymentStatus: 'awaiting_verification',
            updatedAt: serverTimestamp()
          });

          await logAudit('payment_confirm', `Konfirmasi pembayaran dikirim untuk ${order.orderNumber || orderId}`, { orderId, referenceNumber });

          closeModal();
          toast('Konfirmasi terkirim. Menunggu verifikasi admin.', 'ok', 'Terkirim');
          render();
        } catch (err) {
          setBtnLoading(btn, false);
          toast(err.message || 'Gagal mengirim konfirmasi.', 'err');
        }
      };
    }
  });
});
