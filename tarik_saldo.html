<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarik Saldo - NEV Market</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script type="importmap">
        {
            "imports": {
                "firebase-app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase-database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
            }
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a2e0a;
            --bg-card: rgba(10, 46, 10, 0.88);
            --border-color: rgba(239, 178, 44, 0.18);
            --text-primary: #ffffff;
            --text-secondary: #b8d9b8;
            --text-muted: rgba(255, 255, 255, 0.4);
            --accent-gold: #efb22c;
            --accent-red: #ff6b6b;
            --accent-green: #00b894;
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.5);
            --radius-lg: 20px;
            --radius-md: 12px;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f3b0f;
            background-image:
                repeating-linear-gradient(90deg,
                    rgba(34, 120, 34, 0.45) 0px,
                    rgba(34, 120, 34, 0.45) 55px,
                    rgba(20, 80, 20, 0.45) 55px,
                    rgba(20, 80, 20, 0.45) 110px),
                radial-gradient(ellipse at 50% 0%, rgba(0, 0, 0, 0.0) 60%, rgba(0, 0, 0, 0.35) 100%),
                linear-gradient(180deg, #0f3b0f 0%, #0a2a0a 100%);
            background-size: 100% 100%, 100% 100%, 100% 100%;
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 520px;
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 32px 34px 28px;
            box-shadow: var(--shadow-lg);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .header .title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header .title i {
            font-size: 1.2rem;
        }

        .header .store-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            background: rgba(239, 178, 44, 0.12);
            padding: 6px 16px;
            border-radius: 50px;
            border: 1px solid rgba(239, 178, 44, 0.2);
        }

        .balance-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-box .label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .balance-box .amount {
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .balance-box .amount .currency {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-right: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            transition: var(--transition);
            outline: none;
        }

        .form-group select option {
            background: #0a2e0a;
            color: #fff;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--accent-gold);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(239, 178, 44, 0.06);
        }

        .form-group input::placeholder {
            font-weight: 400;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group input#withdrawAmount {
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
        }
        .hint i {
            margin-right: 4px;
        }

        .fee-breakdown {
            background: rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-md);
            padding: 16px 18px;
            margin: 16px 0 22px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .fee-breakdown .row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.9rem;
        }

        .fee-breakdown .row .label {
            color: var(--text-secondary);
        }

        .fee-breakdown .row .value {
            font-weight: 600;
            color: #fff;
        }

        .fee-breakdown .row .value.fee-amount {
            color: var(--accent-red);
        }

        .fee-breakdown .row .value.net-amount {
            color: var(--accent-gold);
        }

        .fee-breakdown .divider {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin: 8px 0;
        }

        .fee-breakdown .total-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0 0;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .fee-breakdown .total-row .label {
            color: #fff;
        }

        .fee-breakdown .total-row .value {
            color: var(--accent-gold);
        }

        /* ===== RIWAYAT ===== */
        .history-section {
            margin-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 18px;
        }

        .history-section .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .history-section .history-header h4 {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-section .history-header h4 i {
            color: var(--accent-gold);
        }

        .history-section .history-header .badge-count {
            font-size: 0.65rem;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 12px;
            border-radius: 50px;
            color: var(--text-muted);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .history-list::-webkit-scrollbar {
            width: 4px;
        }
        .history-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: var(--accent-gold);
            border-radius: 4px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-md);
            border-left: 3px solid transparent;
            transition: var(--transition);
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .history-item .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .history-item .left .icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .history-item .left .icon.pending {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
        }
        .history-item .left .icon.processed {
            background: rgba(0, 184, 148, 0.15);
            color: #00b894;
        }
        .history-item .left .icon.rejected {
            background: rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
        }

        .history-item .left .info .amount {
            font-weight: 700;
            font-size: 0.9rem;
            color: #fff;
        }

        .history-item .left .info .amount .fee-info {
            font-weight: 400;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-left: 6px;
        }

        .history-item .left .info .meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .history-item .left .info .meta .method {
            color: var(--text-secondary);
        }

        .history-item .status {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 3px 12px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        .history-item .status.pending {
            background: rgba(255, 193, 7, 0.12);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.15);
        }
        .history-item .status.processed {
            background: rgba(0, 184, 148, 0.12);
            color: #00b894;
            border: 1px solid rgba(0, 184, 148, 0.15);
        }
        .history-item .status.rejected {
            background: rgba(255, 107, 107, 0.12);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.15);
        }

        .history-empty {
            text-align: center;
            padding: 24px 10px;
            color: var(--text-muted);
        }
        .history-empty i {
            font-size: 2rem;
            opacity: 0.3;
            margin-bottom: 8px;
        }
        .history-empty p {
            font-size: 0.85rem;
        }

        /* ===== TOMBOL ===== */
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .actions .btn-cancel {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            text-decoration: none;
        }

        .actions .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .actions .btn-confirm {
            flex: 2;
            padding: 12px;
            background: linear-gradient(135deg, #efb22c, #f7d875);
            border: none;
            border-radius: 50px;
            color: #0a2a0a;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(239, 178, 44, 0.25);
        }

        .actions .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(239, 178, 44, 0.35);
        }

        .actions .btn-confirm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 10px 26px;
            border-radius: 60px;
            box-shadow: var(--shadow-lg);
            z-index: 99999;
            display: none;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(16px);
            opacity: 0;
            transition: all 0.35s ease;
            font-weight: 500;
            font-size: 0.9rem;
            color: #fff;
            white-space: nowrap;
        }

        .toast.show {
            display: flex;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast i {
            font-size: 1rem;
        }

        @media (max-width: 480px) {
            .container {
                padding: 22px 18px 20px;
            }
            .balance-box .amount {
                font-size: 1.4rem;
            }
            .header .title {
                font-size: 1.1rem;
            }
            .header .store-name {
                font-size: 0.7rem;
                padding: 4px 12px;
            }
            .actions {
                flex-direction: column;
            }
            .fee-breakdown .row {
                font-size: 0.8rem;
            }
            .history-item {
                flex-wrap: wrap;
                gap: 6px;
            }
            .history-item .left .info .amount .fee-info {
                display: block;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="title">
                <i class="fas fa-arrow-up-from-bracket"></i> Tarik Saldo
            </div>
            <span class="store-name" id="storeNameDisplay">Toko Saya</span>
        </div>

        <!-- Saldo -->
        <div class="balance-box">
            <span class="label">Saldo tersedia</span>
            <span class="amount"><span class="currency">Rp</span><span id="balanceDisplay">0</span></span>
        </div>

        <!-- Jumlah Penarikan -->
        <div class="form-group">
            <label for="withdrawAmount">Jumlah penarikan</label>
            <input type="number" id="withdrawAmount" placeholder="Minimal 20.000" min="20000" step="1000" />
            <div class="hint" id="minHint"><i class="fas fa-info-circle"></i> Minimal penarikan Rp 20.000</div>
        </div>

        <!-- Metode Penarikan (hanya 4) -->
        <div class="form-group">
            <label for="paymentMethod">Metode penarikan</label>
            <select id="paymentMethod">
                <option value="dana">DANA</option>
                <option value="gopay">GoPay</option>
                <option value="seabank">SeaBank</option>
                <option value="shopeepay">ShopeePay</option>
            </select>
            <div class="hint"><i class="fas fa-info-circle"></i> Pilih metode pencairan dana</div>
        </div>

        <!-- Nomor Tujuan -->
        <div class="form-group" id="destinationGroup">
            <label for="destinationAccount">Nomor tujuan <span id="methodLabel">(DANA)</span></label>
            <input type="text" id="destinationAccount" placeholder="Masukkan nomor tujuan" />
            <div class="hint"><i class="fas fa-info-circle"></i> <span id="methodHint">Nomor DANA aktif</span></div>
        </div>

        <!-- Rincian biaya -->
        <div class="fee-breakdown" id="feeBreakdown">
            <div class="row">
                <span class="label">Jumlah ditarik</span>
                <span class="value" id="fdGross">Rp 0</span>
            </div>
            <div class="row">
                <span class="label">Biaya layanan</span>
                <span class="value fee-amount" id="fdFee">Rp 0</span>
            </div>
            <div class="divider"></div>
            <div class="total-row">
                <span class="label">Total diterima</span>
                <span class="value net-amount" id="fdNet">Rp 0</span>
            </div>
        </div>

        <!-- Tombol -->
        <div class="actions">
            <a href="profil.html" class="btn-cancel">Batal</a>
            <button class="btn-confirm" id="btnConfirm" disabled>
                <i class="fas fa-paper-plane"></i> Kirim Tagihan
            </button>
        </div>

        <!-- ===== RIWAYAT TARIK SALDO ===== -->
        <div class="history-section">
            <div class="history-header">
                <h4><i class="fas fa-clock-rotate-left"></i> Riwayat Tarik Saldo</h4>
                <span class="badge-count" id="historyCount">0</span>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-empty">
                    <i class="fas fa-receipt"></i>
                    <p>Belum ada riwayat penarikan</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <i class="fas fa-info-circle"></i>
        <span id="toastMsg">Pesan</span>
    </div>

    <script type="module">
        import { initializeApp } from "firebase-app";
        import { getDatabase, ref, get, push, set, update, onValue, query, orderByChild, equalTo } from "firebase-database";

        // ============================================================
        // FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8",
            authDomain: "mybro-9ba5f.firebaseapp.com",
            databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com/",
            projectId: "mybro-9ba5f"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ============================================================
        // DEVICE ID
        // ============================================================
        function getDeviceId() {
            let id = localStorage.getItem('logoShop_deviceId');
            if (!id) {
                id = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
                localStorage.setItem('logoShop_deviceId', id);
            }
            return id;
        }
        const DEVICE_ID = getDeviceId();

        // ============================================================
        // DOM
        // ============================================================
        const storeNameDisplay = document.getElementById('storeNameDisplay');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const withdrawInput = document.getElementById('withdrawAmount');
        const paymentMethod = document.getElementById('paymentMethod');
        const destinationAccount = document.getElementById('destinationAccount');
        const methodLabel = document.getElementById('methodLabel');
        const methodHint = document.getElementById('methodHint');
        const fdGross = document.getElementById('fdGross');
        const fdFee = document.getElementById('fdFee');
        const fdNet = document.getElementById('fdNet');
        const btnConfirm = document.getElementById('btnConfirm');
        const historyList = document.getElementById('historyList');
        const historyCount = document.getElementById('historyCount');
        const minHint = document.getElementById('minHint');

        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        // ============================================================
        // METHOD LABELS & HINTS (4 metode)
        // ============================================================
        const methodInfo = {
            dana: { label: '(DANA)', hint: 'Nomor DANA aktif (08xx)' },
            gopay: { label: '(GoPay)', hint: 'Nomor GoPay aktif (08xx)' },
            seabank: { label: '(SeaBank)', hint: 'Nomor rekening SeaBank' },
            shopeepay: { label: '(ShopeePay)', hint: 'Nomor ShopeePay aktif' }
        };

        function updateMethodInfo() {
            const key = paymentMethod.value;
            const info = methodInfo[key] || methodInfo.dana;
            methodLabel.textContent = info.label;
            methodHint.textContent = info.hint;
            destinationAccount.placeholder = 'Masukkan ' + info.hint.replace('Nomor ', '').toLowerCase();
        }

        paymentMethod.addEventListener('change', updateMethodInfo);
        updateMethodInfo();

        // ============================================================
        // UTILITY
        // ============================================================
        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID').format(angka);
        }

        function showToast(msg, type = 'info') {
            const icon = toast.querySelector('i');
            icon.className = 'fas fa-' + (type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' :
                'info-circle');
            toast.className = 'toast show ' + type;
            toastMsg.textContent = msg;
            clearTimeout(toast._hide);
            toast._hide = setTimeout(() => { toast.classList.remove('show'); }, 4500);
        }

        // ============================================================
        // FEE CALCULATION
        // ============================================================
        function calculateFee(amount) {
            if (amount <= 100000) return 2000;
            if (amount <= 1000000) return 10000;
            if (amount <= 10000000) return 50000;
            if (amount <= 100000000) return 250000;
            if (amount <= 500000000) return 750000;
            if (amount <= 1000000000) return 1500000;
            return Math.round(amount * 0.002);
        }

        // ============================================================
        // STATE
        // ============================================================
        let currentBalance = 0;
        let storeName = 'Toko Saya';
        let historyData = [];
        let withdrawalCount = 0;   // <-- tambahan untuk menghitung penarikan

        // ============================================================
        // MINIMUM WITHDRAWAL (BERDASARKAN JUMLAH PENARIKAN)
        // ============================================================
        function getMinWithdrawal() {
            return withdrawalCount === 0 ? 10000 : 20000;
        }

        function updateMinWithdrawalUI() {
            const min = getMinWithdrawal();
            if (minHint) {
                minHint.innerHTML = `<i class="fas fa-info-circle"></i> Minimal penarikan Rp ${formatRupiah(min)}`;
            }
            withdrawInput.placeholder = `Minimal ${formatRupiah(min)}`;
            withdrawInput.min = min;
            // perbarui breakdown agar tombol aktif/nonaktif sesuai
            updateFeeBreakdown();
        }

        // ============================================================
        // LOAD DATA (storeName & history)
        // ============================================================
        async function loadData() {
            try {
                const snap = await get(ref(db, `logo-shop/sellers/${DEVICE_ID}`));
                const data = snap.val();
                if (data && data.storeName) {
                    storeName = data.storeName;
                } else {
                    storeName = 'Belum ada toko';
                }
                storeNameDisplay.textContent = storeName;
                // balance & withdrawalCount akan diupdate oleh onValue
            } catch (e) {
                console.error('Gagal load data:', e);
            }
        }

        // ============================================================
        // LOAD & RENDER HISTORY
        // ============================================================
        async function loadHistory() {
            try {
                const snap = await get(ref(db, 'logo-shop/withdrawals'));
                const all = snap.val() || {};
                const list = [];
                for (const [key, val] of Object.entries(all)) {
                    if (val.sellerId === DEVICE_ID) {
                        list.push({ id: key, ...val });
                    }
                }
                list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                historyData = list;
                renderHistory();
            } catch (e) {
                console.error('Gagal load riwayat:', e);
            }
        }

        function renderHistory() {
            historyCount.textContent = historyData.length;

            if (historyData.length === 0) {
                historyList.innerHTML = `
                    <div class="history-empty">
                        <i class="fas fa-receipt"></i>
                        <p>Belum ada riwayat penarikan</p>
                    </div>
                `;
                return;
            }

            let html = '';
            for (const item of historyData) {
                const statusClass = item.status || 'pending';
                const statusLabel = statusClass === 'pending' ? 'Menunggu' :
                    statusClass === 'processed' ? 'Diproses' :
                    statusClass === 'rejected' ? 'Ditolak' : 'Menunggu';

                const iconClass = statusClass === 'pending' ? 'pending' :
                    statusClass === 'processed' ? 'processed' : 'rejected';

                const dateStr = item.createdAt ? new Date(item.createdAt).toLocaleDateString('id-ID', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }) : '-';

                const methodMap = {
                    dana: 'DANA',
                    gopay: 'GoPay',
                    seabank: 'SeaBank',
                    shopeepay: 'ShopeePay'
                };
                const methodName = methodMap[item.method] || item.method || '-';

                html += `
                    <div class="history-item">
                        <div class="left">
                            <div class="icon ${iconClass}">
                                <i class="fas fa-${statusClass === 'pending' ? 'clock' : statusClass === 'processed' ? 'check' : 'xmark'}"></i>
                            </div>
                            <div class="info">
                                <div class="amount">
                                    Rp ${formatRupiah(item.amount)}
                                    <span class="fee-info">(fee Rp ${formatRupiah(item.fee || 0)})</span>
                                </div>
                                <div class="meta">
                                    <span>${dateStr}</span>
                                    <span class="method">via ${methodName}</span>
                                </div>
                            </div>
                        </div>
                        <span class="status ${statusClass}">${statusLabel}</span>
                    </div>
                `;
            }
            historyList.innerHTML = html;
        }

        // ============================================================
        // UPDATE FEE BREAKDOWN
        // ============================================================
        function updateFeeBreakdown() {
            const raw = parseInt(withdrawInput.value) || 0;
            const amount = Math.min(raw, currentBalance);
            const fee = calculateFee(amount);
            const net = amount - fee;
            const minWithdrawal = getMinWithdrawal();

            fdGross.textContent = 'Rp ' + formatRupiah(amount);
            fdFee.textContent = 'Rp ' + formatRupiah(fee);
            fdNet.textContent = 'Rp ' + formatRupiah(net);

            const isValid = amount >= minWithdrawal && amount <= currentBalance && net > 0;
            btnConfirm.disabled = !isValid;
            return { amount, fee, net, isValid };
        }

        // ============================================================
        // EVENT: input
        // ============================================================
        withdrawInput.addEventListener('input', updateFeeBreakdown);

        // ============================================================
        // CONFIRM
        // ============================================================
        btnConfirm.addEventListener('click', async () => {
            const raw = parseInt(withdrawInput.value) || 0;
            const amount = Math.min(raw, currentBalance);
            const fee = calculateFee(amount);
            const net = amount - fee;
            const minWithdrawal = getMinWithdrawal();

            if (amount < minWithdrawal) {
                showToast(`Minimal penarikan Rp ${formatRupiah(minWithdrawal)}`, 'error');
                return;
            }
            if (amount > currentBalance) {
                showToast('Jumlah melebihi saldo', 'error');
                return;
            }
            if (net <= 0) {
                showToast('Setelah biaya, nominal tidak valid', 'error');
                return;
            }

            const method = paymentMethod.value;
            const destination = destinationAccount.value.trim();
            if (!destination) {
                showToast('Masukkan nomor tujuan penarikan', 'error');
                destinationAccount.focus();
                return;
            }
            if (destination.length < 4) {
                showToast('Nomor tujuan terlalu pendek', 'error');
                return;
            }

            btnConfirm.disabled = true;
            btnConfirm.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengirim...';

            try {
                const withdrawalRef = push(ref(db, 'logo-shop/withdrawals'));
                const now = Date.now();
                await set(withdrawalRef, {
                    sellerId: DEVICE_ID,
                    storeName: storeName,
                    amount: amount,
                    fee: fee,
                    netAmount: net,
                    method: method,
                    destination: destination,
                    status: 'pending',
                    createdAt: now,
                    note: `Penarikan saldo oleh ${storeName} via ${method}`
                });

                const newBalance = currentBalance - amount;
                const newWithdrawalCount = (withdrawalCount || 0) + 1;

                // update saldo & jumlah penarikan di seller
                await update(ref(db, `logo-shop/sellers/${DEVICE_ID}`), {
                    balance: newBalance,
                    withdrawalCount: newWithdrawalCount
                });

                // update state lokal (onValue akan segera sinkron)
                currentBalance = newBalance;
                withdrawalCount = newWithdrawalCount;
                balanceDisplay.textContent = formatRupiah(currentBalance);
                updateMinWithdrawalUI();   // memperbarui placeholder & hint
                updateFeeBreakdown();

                const methodName = paymentMethod.options[paymentMethod.selectedIndex].text;
                showToast(`Tagihan penarikan Rp ${formatRupiah(amount)} via ${methodName} telah dikirim ke admin`, 'success');

                withdrawInput.value = '';
                destinationAccount.value = '';
                // updateFeeBreakdown sudah dipanggil di updateMinWithdrawalUI

                // Refresh history otomatis (listener akan update)
            } catch (err) {
                showToast('Gagal: ' + err.message, 'error');
            } finally {
                btnConfirm.disabled = false;
                btnConfirm.innerHTML = '<i class="fas fa-paper-plane"></i> Kirim Tagihan';
            }
        });

        // ============================================================
        // REALTIME SELLER DATA (balance & withdrawalCount)
        // ============================================================
        const sellerRef = ref(db, `logo-shop/sellers/${DEVICE_ID}`);
        onValue(sellerRef, (snap) => {
            const data = snap.val();
            if (data) {
                currentBalance = data.balance || 0;
                withdrawalCount = data.withdrawalCount || 0;
                balanceDisplay.textContent = formatRupiah(currentBalance);
                updateMinWithdrawalUI();
                updateFeeBreakdown();
            }
        });

        // ============================================================
        // REALTIME HISTORY
        // ============================================================
        const withdrawalsRef = ref(db, 'logo-shop/withdrawals');
        onValue(withdrawalsRef, async () => {
            await loadHistory();
        });

        // ============================================================
        // INIT
        // ============================================================
        loadData();
        loadHistory();
    </script>
</body>
</html>
